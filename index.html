<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>As-Built Tracker — IWTP2</title>
<style>
:root{
  color-scheme:light;
  --page1:#eef1f4; --page2:#e4e9ee;
  --glass:rgba(252,252,251,.94); --surface:#fcfcfb; --surface2:#f0efec; --field:#ffffff;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --ring:rgba(11,11,11,.09);
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10); --accent-soft2:rgba(42,120,214,.16);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --goodtext:#006300;
  --sel:rgba(42,120,214,.14); --selb:#2a78d6;
  --shadow:0 10px 34px rgba(15,20,30,.16),0 2px 8px rgba(15,20,30,.08);
  --shadow-focus:0 18px 50px rgba(15,20,30,.24),0 3px 10px rgba(15,20,30,.10);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page1:#101216; --page2:#0b0c0f;
  --glass:rgba(26,26,25,.94); --surface:#1a1a19; --surface2:#2c2c2a; --field:#111110;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.14); --accent-soft2:rgba(57,135,229,.22);
  --goodtext:#0ca30c; --sel:rgba(57,135,229,.20); --selb:#3987e5;
  --shadow:0 10px 34px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --shadow-focus:0 18px 50px rgba(0,0,0,.65),0 3px 10px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;color:var(--ink);
  background:radial-gradient(1200px 700px at 20% 0%,var(--page1),var(--page2));user-select:none}
button,input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ top bar ============ */
#topbar{height:52px;display:flex;align-items:center;gap:6px;padding:0 14px;
  background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--ring);
  position:relative;z-index:900}
#topbar .logo{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
#topbar .title{font-weight:650;font-size:13.5px;letter-spacing:-.01em;margin-right:6px;white-space:nowrap}
#topbar .title small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
#topbar .spacer{flex:1}
.tbbtn{border:none;background:none;color:var(--ink2);font-size:12.5px;padding:7px 11px;
  border-radius:9px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tbbtn:hover{background:var(--accent-soft);color:var(--ink)}
.tbbtn:disabled{opacity:.35;cursor:default}
.tbbtn:disabled:hover{background:none;color:var(--ink2)}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;display:block}
#mhead .ico{width:19px;height:19px}
.menuwrap{position:relative}
.menucard{display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:236px;
  background:var(--surface);border:1px solid var(--ring);border-radius:12px;
  box-shadow:var(--shadow);padding:6px;z-index:999}
.menuwrap.open .menucard{display:block}
.menucard button{display:flex;width:100%;text-align:left;background:none;border:none;
  font-size:12.5px;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;
  gap:9px;align-items:center}
.menucard button:hover{background:var(--accent-soft)}
.menucard hr{border:none;border-top:1px solid var(--ring);margin:5px 2px}
.bell{position:relative}
.bell i{position:absolute;top:2px;right:4px;background:var(--critical);color:#fff;
  border-radius:10px;font-size:9px;font-style:normal;padding:0 4px;line-height:14px;min-width:14px;text-align:center}

/* ============ desktop ============ */
#desktop{position:absolute;inset:52px 0 26px 0;overflow:hidden}
#dock{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;gap:6px;
  align-items:center;padding:0 10px;background:var(--glass);border-top:1px solid var(--ring);
  font-size:11.5px;z-index:800;overflow-x:auto}
#dock button{border:1px solid var(--ring);background:var(--surface2);color:var(--ink2);
  border-radius:7px;padding:1px 9px;cursor:pointer;font-size:11px;white-space:nowrap}
#dock button:hover{background:var(--accent-soft)}
#dock .st{margin-left:auto;color:var(--muted);white-space:nowrap;padding-left:12px}

.win{position:absolute;background:var(--surface);border:1px solid var(--ring);border-radius:13px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:320px;min-height:180px}
.win.focus{box-shadow:var(--shadow-focus);border-color:var(--accent-soft2)}
.win .wbar{height:34px;display:flex;align-items:center;gap:7px;padding:0 8px 0 12px;
  background:var(--surface2);border-bottom:1px solid var(--ring);cursor:move;flex:none}
.win .wt{font-weight:600;font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .wt small{font-weight:400;color:var(--muted);margin-left:7px}
.win .wb{border:none;background:none;color:var(--ink2);width:22px;height:22px;border-radius:6px;
  cursor:pointer;font-size:13px;line-height:1;flex:none}
.win .wb:hover{background:var(--accent-soft);color:var(--ink)}
.win .wbody{flex:1;overflow:auto;position:relative}
.win .wtools{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--ring);
  flex-wrap:wrap;background:var(--surface);position:sticky;top:0;z-index:6}
.grip{position:absolute;z-index:5}
.grip.e{top:0;right:-3px;width:8px;height:100%;cursor:ew-resize}
.grip.s{bottom:-3px;left:0;height:8px;width:100%;cursor:ns-resize}
.grip.se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:nwse-resize}
#snapghost{position:absolute;border:2px solid var(--accent);background:var(--accent-soft);
  border-radius:12px;display:none;pointer-events:none;z-index:700}

/* ============ grid ============ */
.gwrap{overflow:auto;height:100%}
table.g{border-collapse:separate;border-spacing:0;font-size:12px;table-layout:fixed}
table.g th,table.g td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
  padding:4px 7px;text-align:left;vertical-align:top;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;position:relative;background:var(--surface)}
table.g thead th{position:sticky;top:0;background:var(--surface2);font-weight:600;font-size:11px;
  color:var(--ink2);z-index:4;user-select:none;cursor:pointer}
table.g thead th.drag{opacity:.4}
table.g th .cr{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:5}
table.g tbody th{position:sticky;left:0;z-index:3;background:var(--surface2);text-align:right;
  color:var(--muted);font-weight:500;font-size:11px;width:44px;cursor:pointer}
table.g tbody th .rr{position:absolute;left:0;bottom:-3px;height:7px;width:100%;cursor:row-resize}
table.g thead th.corner{left:0;z-index:6;width:44px}
td.sel{background:var(--sel)}
td.cur{outline:2px solid var(--selb);outline-offset:-2px;z-index:2}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.ctr{text-align:center}
tr.dim td{color:var(--muted)}
.cellin{position:absolute;inset:0;border:2px solid var(--selb);background:var(--field);
  color:var(--ink);padding:3px 5px;font:inherit;z-index:20;user-select:text}
select.cellin{padding:1px 3px}

.pill{display:inline-block;padding:0 8px;border-radius:20px;font-size:11px;font-weight:600;line-height:17px}
.s-A,.s-B,.s-I{background:rgba(12,163,12,.15);color:var(--goodtext)}
.s-B{background:rgba(12,163,12,.10)}
.s-C{background:rgba(236,131,90,.20);color:#b8501f}
.s-D{background:rgba(208,59,59,.18);color:#a52020}
.s-W{background:rgba(250,178,25,.22);color:#8a6100}
.s-N{background:var(--surface2);color:var(--muted)}
:root[data-theme="dark"] .s-C{color:#f0a077}:root[data-theme="dark"] .s-D{color:#f08080}
:root[data-theme="dark"] .s-W{color:#f5c451}

.btn{border:1px solid var(--ring);background:var(--surface2);color:var(--ink);border-radius:9px;
  padding:5px 11px;cursor:pointer;font-size:12px}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:var(--surface2);border-color:var(--ring)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{background:var(--critical);color:#fff;border-color:var(--critical)}
input.f,select.f{border:1px solid var(--ring);background:var(--field);color:var(--ink);
  border-radius:8px;padding:5px 8px;user-select:text}
.hint{font-size:11.5px;color:var(--muted)}

/* ============ dashboard ============ */
.dash{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface2);border:1px solid var(--ring);border-radius:12px;padding:11px 13px}
.kpi .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:27px;font-weight:660;letter-spacing:-.02em;margin-top:3px;line-height:1}
.kpi .p{font-size:11px;color:var(--ink2);margin-top:3px}
.kpi .bar{height:4px;border-radius:3px;background:var(--surface);margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:3px}
.panel{background:var(--surface2);border:1px solid var(--ring);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.panel h3{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.panel table{border-collapse:collapse;width:100%;font-size:12px}
.panel th,.panel td{border-bottom:1px solid var(--grid);padding:4px 7px;text-align:left}
.panel th{font-weight:600;font-size:11px;color:var(--ink2)}
svg text{fill:var(--ink2);font-size:10px;font-family:inherit}
svg .gl{stroke:var(--grid);stroke-width:1}


/* ---- charts ---- */
.chart{--c-line:var(--grid);--c-dim:var(--muted)}
body.mobile .chart{--c-line:var(--m-line2);--c-dim:var(--m-ink3)}

/* readout strip */
.readout{display:flex;gap:0;border:1px solid var(--c-line);border-radius:9px;overflow:hidden;
  margin-bottom:11px;background:var(--surface2)}
body.mobile .readout{background:var(--m-paper);border-color:var(--m-line)}
.readout .ro{flex:1;padding:7px 9px;border-right:1px solid var(--c-line);min-width:0}
.readout .ro:last-child{border-right:none}
.readout .ro span{display:block;font-size:8.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--c-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .ro{white-space:nowrap}
.readout .ro b{display:block;font-family:var(--mono);font-size:15px;font-weight:700;
  letter-spacing:-.03em;margin-top:2px;color:var(--ink)}
body.mobile .readout .ro b{color:var(--m-ink);font-size:14px}
.readout .ro b.neg{color:#d64545}
.readout .ro b.pos{color:#0f9d58}

/* plot */
.plotsvg{width:100%;height:auto;display:block;overflow:visible}
.plotsvg .gl{stroke:var(--c-line);stroke-width:1}
.plotsvg .gl.vt{opacity:.45}
.plotsvg .ax{fill:var(--c-dim);font-family:var(--mono);font-size:9.5px;letter-spacing:-.02em}
.plotsvg .ln{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.plotsvg .ln.act{stroke:var(--accent);stroke-width:2.4}
.plotsvg .ln.ret{stroke:#0f9d58;stroke-width:1.6;opacity:.85}
.plotsvg .ln.pln{stroke:var(--c-dim);stroke-width:1.4;stroke-dasharray:5 4}
.plotsvg .pts circle{fill:var(--accent);transition:r .12s}
.plotsvg .tip{stroke:var(--surface);stroke-width:2}
body.mobile .plotsvg .tip{stroke:var(--m-card)}
.plotsvg .tip.act{fill:var(--accent)}
.plotsvg .tip.ret{fill:#0f9d58}
.plotsvg .cross{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.plotsvg .hot rect{fill:transparent;cursor:crosshair}
.plotsvg .draw{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.plotsvg .draw{animation:none;stroke-dashoffset:0}}

/* legend */
.chart .legend{display:flex;gap:13px;flex-wrap:wrap;align-items:center;margin-top:9px;
  font-size:10px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--c-dim)}
.chart .legend b{font-family:var(--mono);letter-spacing:-.02em;font-size:11px}
.chart .legend .rt{margin-left:auto;text-transform:none;letter-spacing:.02em}
.chart .legend i.sw{width:13px;height:2.5px;border-radius:2px;display:inline-block;
  margin-right:5px;vertical-align:2px;background:var(--c-dim)}
.chart .legend i.sw.act{background:var(--accent);height:3px}
.chart .legend i.sw.ret{background:#0f9d58}
.chart .legend i.sw.pln{background:repeating-linear-gradient(90deg,var(--c-dim) 0 4px,transparent 4px 7px)}
.chart .legend i.sw.wip{background:rgba(240,180,41,.5);height:9px;border-radius:2px;vertical-align:-1px}

/* review code ring */
.ringc{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
body.mobile .ringc{flex-direction:column;gap:14px}
body.mobile .ringsvg{width:200px;margin:2px auto 0}
body.mobile .codes{width:100%;min-width:0}
.ringsvg{width:150px;flex:none}
.ringsvg .track{fill:none;stroke:var(--c-line);stroke-width:11}
.ringsvg .ring{fill:none;stroke-width:11;transform:rotate(-90deg);transform-origin:70px 70px;
  cursor:pointer;transition:stroke-width .14s,opacity .14s}
.ringsvg .ring:hover{stroke-width:15}
.ringsvg .ring.dim{opacity:.2}
.ringsvg .rgn{fill:var(--ink);font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.04em}
.ringsvg .rgl{fill:var(--c-dim);font-size:8px;font-weight:700;letter-spacing:.14em}
body.mobile .ringsvg .rgn{fill:var(--m-ink)}
.codes{flex:1;min-width:190px;display:flex;flex-direction:column;gap:1px}
.crow{display:flex;align-items:center;gap:9px;padding:5px 7px;border:none;background:none;
  border-radius:7px;cursor:pointer;text-align:left;width:100%;color:inherit;
  border-bottom:1px solid var(--c-line);transition:background .12s,opacity .12s}
.crow:last-child{border-bottom:none}
.crow:hover{background:var(--accent-soft)}
.crow.dim{opacity:.32}
.crow i{width:9px;height:9px;border-radius:2px;flex:none}
.crow .cl{flex:1;font-size:11.5px;font-weight:600;color:var(--ink)}
body.mobile .crow .cl{color:var(--m-ink)}
.crow b{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:-.03em}
.crow em{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--c-dim);
  width:44px;text-align:right}

/* discipline bars */
.dbars .drow{display:flex;align-items:center;gap:9px;margin-bottom:6px;font-size:11px}
.dbars .dlab{width:96px;flex:none;font-size:10px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--c-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbars .dtrack{flex:1;height:15px;background:var(--c-line);border-radius:3px;overflow:hidden}
.dbars .dbar{height:100%;display:flex;border-radius:3px;overflow:hidden;
  transition:width .5s cubic-bezier(.2,.8,.3,1)}
.dbars .dbar i{display:block;height:100%;cursor:pointer;transition:opacity .12s}
.dbars.focus .dbar i{opacity:.28}
.dbars.focus .dbar i.on{opacity:1}
.dbars .dn{width:30px;text-align:right;font-family:var(--mono);font-weight:700;font-size:12px;flex:none}
.dbars .dp{width:38px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--c-dim);flex:none}

/* ageing bullets */
.bullets .brow{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;
  border-bottom:1px solid var(--c-line)}
.bullets .brow:hover{background:var(--accent-soft)}
.bullets .blab{width:96px;flex:none;font-size:10px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--c-dim)}
.bullets .btrack{flex:1;height:9px;background:var(--c-line);border-radius:5px;overflow:hidden}
.bullets .btrack i{display:block;height:100%;border-radius:5px;min-width:3px;
  transition:width .55s cubic-bezier(.2,.8,.3,1)}
.bullets .bn{width:32px;text-align:right;font-family:var(--mono);font-weight:700;font-size:13px;flex:none}

/* throughput columns */
.cols .colwrap{display:flex;gap:9px;align-items:flex-end;height:158px;
  border-bottom:1px solid var(--c-line);padding-bottom:0}
.cols .col{flex:1;min-width:30px;height:100%;display:flex;flex-direction:column;cursor:pointer;
  border-radius:6px 6px 0 0;transition:background .12s}
.cols .col:hover{background:var(--accent-soft)}
.cols .cbars{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:0 3px}
.cols .cbars i{width:46%;border-radius:3px 3px 0 0;min-height:2px;position:relative;
  transition:height .55s cubic-bezier(.2,.8,.3,1)}
.cols .cbars i.s{background:var(--accent)}
.cols .cbars i.r{background:#0f9d58}
.cols .cbars i b{position:absolute;top:-14px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--c-dim)}
.cols .clab{font-family:var(--mono);font-size:9.5px;text-align:center;color:var(--c-dim);
  padding-top:6px;white-space:nowrap}

/* tooltip */
.ctip{position:fixed;z-index:3000;pointer-events:none;opacity:0;transition:opacity .12s;
  background:#0d1b2a;color:#eef2f6;border-radius:9px;padding:8px 10px;font-size:11.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.34);max-width:250px;border:1px solid rgba(255,255,255,.09)}
.ctip.on{opacity:1}
.ctip b{font-family:var(--mono);font-weight:700}
.ctip>b{font-family:inherit;display:block;margin-bottom:4px;font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;color:#9fb0c0}
.ctip .tl{display:flex;justify-content:space-between;gap:14px;padding:1.5px 0}
.ctip .tl span{color:#c3d0db}
.ctip .th{margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.12);
  font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#7d8fa0}


/* ---- discussion ---- */
.thread{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.cmt{display:flex;gap:10px}
.av{width:30px;height:30px;border-radius:50%;flex:none;background:var(--accent-soft2);
  color:var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;letter-spacing:.02em}
.av.me{background:var(--accent);color:#fff}
.cb{flex:1;min-width:0}
.ch{display:flex;gap:8px;align-items:baseline;margin-bottom:3px}
.ch b{font-size:12.5px;font-weight:650}
.ch span{font-size:11px;color:var(--muted)}
.ch .cx{margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;
  font-size:11px;padding:1px 4px;border-radius:5px;opacity:0;transition:opacity .12s}
.cmt:hover .ch .cx{opacity:1}
.ch .cx:hover{background:var(--accent-soft);color:var(--ink)}
.ct{font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.composer{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--ring);
  padding-top:12px;flex-wrap:wrap}
.composer .btn{flex:none}
body.mobile .composer{gap:8px;position:relative}
body.mobile .composer .av{display:none}
body.mobile .composer .cwrap{flex:1 1 100%}
body.mobile .composer .btn{margin-left:auto;padding:9px 20px;border-radius:10px}
.composer textarea{flex:1;border:1px solid var(--ring);background:var(--field);color:var(--ink);
  border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;resize:vertical;min-height:44px}
.composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
body.mobile .cb{min-width:0}
body.mobile .composer{padding-top:10px;padding-bottom:4px}
body.mobile .ct{color:var(--m-ink)}
body.mobile .av{background:var(--accent);color:#fff}

/* ---- submission plan ---- */
.planbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.planbar select,.planbar input{min-width:150px}
table.ptbl{width:100%;border-collapse:collapse;font-size:12px}
table.ptbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);padding:5px 7px;border-bottom:1px solid var(--grid)}
table.ptbl td{padding:5px 7px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.ptbl select,table.ptbl input{padding:4px 7px;font-size:12px;border-radius:7px;
  border:1px solid var(--ring);background:var(--field);color:var(--ink);width:100%}
.alist{display:flex;gap:7px;flex-wrap:wrap}
.atag{background:var(--surface2);border:1px solid var(--ring);border-radius:20px;
  padding:4px 11px;font-size:12px;font-weight:600}
.atag i{font-style:normal;color:var(--muted);font-weight:400;margin-left:6px;font-size:11px}
.cbadge{display:inline-block;min-width:16px;padding:0 4px;border-radius:9px;background:var(--accent);
  color:#fff;font-size:9.5px;font-weight:700;line-height:15px;text-align:center;margin-left:6px}

.picker{max-height:46vh;overflow:auto;border:1px solid var(--ring);border-radius:10px}
.pk{display:flex;gap:9px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--grid);
  cursor:pointer;font-size:12px}
.pk:last-child{border-bottom:none}
.pk:hover{background:var(--accent-soft)}
.pk input{flex:none}
.pk .pmain{flex:1;min-width:0}
.pk .pmain b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .pmain i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;
  color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.mobile .pk{padding:9px 11px}
body.mobile .pk .pmain b{font-size:13.5px;white-space:normal}

.mention{background:var(--accent-soft2);color:var(--accent);border-radius:5px;
  padding:0 4px;font-weight:650}
.cwrap{flex:1;position:relative;min-width:0}
.cwrap textarea{width:100%}
.mpick{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:1200;
  background:var(--surface);border:1px solid var(--ring);border-radius:11px;
  box-shadow:var(--shadow);overflow:hidden;max-height:168px;overflow-y:auto}
.mpick .mphd{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:7px 10px 4px}
.mp{display:flex;gap:8px;align-items:baseline;width:100%;border:none;background:none;
  padding:6px 10px;cursor:pointer;text-align:left;color:inherit;line-height:1.25}
.mp:hover,.mp.on{background:var(--accent-soft)}
.mp .av{display:none}
.mp b{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp i{font-style:normal;font-size:10px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin-left:auto;flex:none}
body.mobile .mp{padding:8px 12px}
body.mobile .mp b{font-size:13px}
.nrow{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--grid);cursor:pointer}
.nrow:last-child{border-bottom:none}
.nrow:hover{background:var(--accent-soft)}
.nrow.unread{border-left:3px solid var(--accent);padding-left:9px}
.nrow b{font-size:12.5px}
.nrow .nb{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.45}
body.mobile .mpick{bottom:calc(100% + 8px);top:auto;max-height:172px;
  background:var(--m-card);border-color:var(--m-line)}
body.mobile .mpick .mphd{color:var(--m-ink3)}

.pgwrap{display:flex;flex-direction:column;gap:9px}
.pgnum{display:flex;align-items:baseline;gap:10px}
.pgnum b{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.04em;color:var(--ink)}
.pgnum span{font-size:12px;color:var(--muted)}
body.mobile .pgnum b{color:var(--m-ink)}
.pgbar{height:11px;border-radius:6px;background:var(--surface2);overflow:hidden;display:flex}
body.mobile .pgbar{background:var(--m-paper)}
.pgbar i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.pgbar i.on{background:#0f9d58}.pgbar i.lt{background:#f0b429}.pgbar i.ov{background:#d64545}
.pglg{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;font-weight:650;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pglg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.pglg i.on{background:#0f9d58}.pglg i.lt{background:#f0b429}
.pglg i.ov{background:#d64545}.pglg i.op{background:var(--grid)}
.mcount button{flex:none}
.mrowlist{display:flex;flex-direction:column;gap:2px}
.mopt{display:block;width:100%;text-align:left;border:none;background:none;color:var(--ink);
  padding:12px 10px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;
  border-bottom:1px solid var(--ring)}
.mopt:last-child{border-bottom:none}
.mopt:hover,.mopt:active{background:var(--accent-soft)}
.mopt span{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
.mopt.danger{color:var(--critical)}
.fl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin:12px 0 5px}
.fl:first-child{margin-top:0}
.f.big{width:100%;padding:10px 11px;font-size:15px;border-radius:10px}
.itemhd{font-size:14px;font-weight:650;line-height:1.35;margin-bottom:4px}
.itemhd span{display:block;font-size:11px;font-weight:400;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.chkline{display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:13px;cursor:pointer}
.chkline span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.chkline input{margin-top:2px}
table.g tbody th{padding:0 6px}
table.g tbody th .rowchk{margin-right:5px;vertical-align:middle}
table.g tbody th .rn{vertical-align:middle}
table.g thead th.corner{text-align:center}
.lnk{border:none;background:none;color:var(--accent);cursor:pointer;font-size:11.5px;
  text-decoration:underline;padding:0}
.dcard.ticked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dc-h .mchk{flex:none;width:17px;height:17px}
.dcard.swiping{transition:none;user-select:none}
.dcard{transition:transform .18s cubic-bezier(.2,.8,.3,1),border-color .13s}
.dcard[data-swipe="left"]{border-color:#d64545;box-shadow:0 0 0 1px #d64545}
.dcard[data-swipe="right"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.asgchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.asgchip{border:1px solid var(--ring);background:var(--surface2);color:var(--ink2);
  border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
.asgchip:hover,.asgchip:active{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.swipehint{font-size:10.5px;color:var(--muted);text-align:center;padding:2px 0 10px;
  text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.phase{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase}
.ph-live{background:rgba(15,157,88,.15);color:#0b7a44}
.ph-future{background:var(--accent-soft2);color:var(--accent)}
.ph-past{background:var(--surface2);color:var(--muted)}
body.mobile .ph-past{background:var(--m-chip)}
:root[data-theme="dark"] .ph-live{color:#5fd08e}
.pstate{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10.5px;font-weight:700;
  letter-spacing:.03em;white-space:nowrap}
.st-done{background:rgba(15,157,88,.15);color:#0b7a44}
.st-late{background:rgba(240,180,41,.18);color:#8a6100}
.st-over{background:rgba(214,69,69,.15);color:#a92c2c}
.st-due{background:var(--surface2);color:var(--ink2)}
.st-none{background:var(--surface2);color:var(--muted)}
:root[data-theme="dark"] .st-done{color:#5fd08e}
:root[data-theme="dark"] .st-late{color:#f5c451}
:root[data-theme="dark"] .st-over{color:#f08a8a}
body.mobile .st-due{background:var(--m-chip)}

/* ---- gantt ---- */
.gantt{font-size:12px}
.grow,.ghead{display:flex;align-items:center;gap:10px;padding:3px 0}
.ghead{border-bottom:1px solid var(--grid);padding-bottom:7px;margin-bottom:6px}
.grow{border-bottom:1px solid var(--grid);cursor:pointer}
.grow:last-of-type{border-bottom:none}
.grow:hover{background:var(--accent-soft)}
.gantt .glab{width:210px;flex:none;font-size:11.5px;font-weight:600;line-height:1.25;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gantt .glab i{display:block;font-style:normal;font-size:9.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.gantt .gtrack{flex:1;position:relative;height:26px;min-width:180px}
.gantt .gaxis{height:20px}
.gantt .gl{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid)}
.gantt .gl.rest{background:var(--surface2)}
body.mobile .gantt .gl.rest{background:var(--m-paper)}
.gantt .gnow{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--accent);z-index:3}
.gantt .gnowlab{position:absolute;top:2px;transform:translateX(-50%);font-size:9px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.gantt .gaxis span{position:absolute;top:5px;transform:translateX(-50%);font-family:var(--mono);
  font-size:9px;color:var(--muted);white-space:nowrap}
.gantt .gbar{position:absolute;top:6px;height:14px;border-radius:4px;z-index:2;
  display:flex;align-items:center;padding:0 6px;overflow:hidden}
.gantt .gbar b{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:#fff;white-space:nowrap;opacity:.95}
.gantt .gdia{position:absolute;top:9px;width:9px;height:9px;margin-left:-4.5px;
  transform:rotate(45deg);z-index:4;border:1.5px solid var(--surface)}
body.mobile .gantt .gdia{border-color:var(--m-card)}
.g-done{background:#0f9d58}.g-late{background:#f0b429}.g-over{background:#d64545}
.g-due{background:var(--accent)}.g-plan{background:var(--muted)}.g-none{background:#b9bfc7}
.gantt .gdate{width:80px;flex:none;text-align:right;font-family:var(--mono);font-size:10.5px;
  color:var(--muted)}
@media(max-width:820px){
  .gantt .glab{width:104px;font-size:11px}
  .gantt .gdate{width:56px;font-size:9.5px}
  .gantt .gbar b{display:none}
}

.autofield{display:flex;align-items:center;gap:9px}
.autofield .f{flex:1}
.autofield .f[readonly]{background:var(--surface2);color:var(--ink2);cursor:default}
body.mobile .autofield .f[readonly]{background:var(--m-paper)}

/* ---- submission history ---- */
table.histtbl{width:100%;border-collapse:collapse;font-size:12px}
table.histtbl th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);padding:5px 7px;border-bottom:1px solid var(--grid)}
table.histtbl td{padding:5px 7px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.histtbl tr:last-child td{border-bottom:none}
table.histtbl .mono{font-family:var(--mono);font-size:11px}
.hlist{display:flex;flex-direction:column;gap:1px}
.hrow{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--m-line)}
.hrow:last-child{border-bottom:none}
.hrev{flex:none;width:66px;font-size:12.5px;font-weight:700;line-height:1.2}
.hrev i{display:block;font-style:normal;font-size:9.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--m-ink3);margin-top:2px}
.hmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.hdates{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:11.5px;
  flex-wrap:wrap}
.hdates span{color:var(--m-ink3)}
.hdays{flex:none;text-align:right;font-family:var(--mono);font-size:14px;font-weight:700}
.hdays i{display:block;font-style:normal;font-family:var(--sans);font-size:9px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--m-ink3);margin-top:2px}
.hdays.out{color:var(--m-amber,#f0b429)}

.hrow.pending{opacity:.72}
table.histtbl tr.iscur td{font-weight:650}
table.histtbl tr.iscur td:first-child::after{content:" ●";color:var(--accent)}
.hrow.pending .hrev{color:var(--m-amber,#f0b429)}
table.histtbl tr.pending td{opacity:.72}
table.histtbl tr.pending .mono{color:#b98b12}
table.histtbl tr:hover td{background:var(--accent-soft)}

/* ---- printed report ---- */
#printroot{display:none}
@media screen{ body.printing #printroot{display:none} }
@media print{
  @page{ size:A4 landscape; margin:10mm 8mm; }
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;
    color:#000!important}
  body>*{display:none!important}
  body #printroot{display:block!important}
  #printroot{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#000;font-size:8pt}

  .rhead{display:flex;align-items:flex-end;justify-content:space-between;
    border-bottom:2pt solid #12304f;padding-bottom:4pt;margin-bottom:6pt}
  .rhead h1{font-size:12.5pt;font-weight:700;color:#12304f;letter-spacing:-.2pt;margin:0;line-height:1.15}
  .rhead .rs{font-size:7.6pt;color:#555;margin-top:1pt}
  .rhead .rd{text-align:right;font-size:7.6pt;color:#555;line-height:1.4;white-space:nowrap}
  .rhead .rd span{font-weight:700;color:#12304f}

  .rfilt{font-size:7.8pt;background:#eef2f6;border:.4pt solid #c3ced9;border-radius:2pt;
    padding:3pt 6pt;margin-bottom:5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rkpis{display:flex;gap:3.5pt;margin-bottom:6pt}
  .rk{flex:1;border:.4pt solid #c3ced9;border-radius:2pt;padding:3pt 2pt;text-align:center}
  .rk b{display:block;font-size:11pt;color:#12304f;line-height:1.05}
  .rk span{font-size:5.6pt;text-transform:uppercase;letter-spacing:.3pt;color:#666;
    display:block;line-height:1.15;margin-top:1pt}

  table.rtbl{width:100%;border-collapse:collapse;font-size:6.6pt;table-layout:fixed}
  table.rtbl thead{display:table-header-group}
  table.rtbl tr{page-break-inside:avoid}
  table.rtbl th,table.rtbl td{
    padding:2.4pt 3pt;text-align:left;vertical-align:top;line-height:1.25;
    word-wrap:break-word;overflow-wrap:break-word;hyphens:none}
  table.rtbl th{background:#12304f!important;color:#fff!important;font-weight:600;
    font-size:6.2pt;letter-spacing:.1pt;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.rtbl td{border-bottom:.35pt solid #d9dee3}
  table.rtbl tbody tr:nth-child(even) td{background:#f4f6f8;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* widths total 100% */
  table.rtbl .c-idx{width:3.4%;text-align:right;color:#777;font-variant-numeric:tabular-nums}
  table.rtbl .c-docNo{width:17.5%;font-variant-numeric:tabular-nums}
  table.rtbl .c-title{width:32%}
  table.rtbl .c-discipline{width:11.5%}
  table.rtbl .c-currentRev{width:6%;text-align:center}
  table.rtbl .c-status{width:8.6%;text-align:center;font-weight:700;white-space:nowrap}
  table.rtbl .c-targetDate,table.rtbl .c-actualSub,table.rtbl .c-actualRcv{
    width:7%;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.rtbl .c-daysUR,table.rtbl .c-late{width:5%;text-align:right}

  .rfoot{margin-top:7pt;padding-top:3pt;border-top:.4pt solid #d9dee3;
    font-size:6.2pt;color:#777}
}
/* ============ overlays ============ */
#msgwrap{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;z-index:1500;
  align-items:center;justify-content:center;padding:20px}
#msgwrap.on{display:flex}
.msg{background:var(--surface);border:1px solid var(--ring);border-radius:14px;box-shadow:var(--shadow-focus);
  max-width:460px;width:100%;padding:18px 20px}
.msg h4{font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.msg .body{font-size:12.5px;color:var(--ink2);line-height:1.55;max-height:50vh;overflow:auto}
.msg .tlrow{display:flex;justify-content:space-between;gap:14px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--ring)}
.msg .tlrow:last-child{border-bottom:none}
.msg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;bottom:38px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--page1);padding:8px 15px;border-radius:10px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.22s;z-index:2000}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#login{position:fixed;inset:0;background:radial-gradient(900px 600px at 30% 10%,var(--page1),var(--page2));
  display:none;align-items:center;justify-content:center;z-index:1400;padding:20px}
#login.on{display:flex}
#login .card{background:var(--surface);border:1px solid var(--ring);border-radius:16px;
  box-shadow:var(--shadow-focus);padding:26px 24px;width:100%;max-width:340px}
#login h1{font-size:17px;margin-bottom:3px}
#login p{font-size:12px;color:var(--muted);margin-bottom:18px}
#login input,#login select{width:100%;margin-bottom:9px}
#login select{padding:9px 10px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
    linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ============ mobile ============
   Visual language borrowed from the drawing sheet itself: a title block.
   Monospace for anything that is a number on a real drawing — document
   numbers, revisions, dates, review codes. Hairline rules divide fields.
   Status is carried on the card edge so a list can be read at a glance. */
:root{
  --m-paper:#eef1f5; --m-card:#ffffff; --m-line:#e3e7ec; --m-line2:#eef1f4;
  --m-ink:#0d1b2a; --m-ink2:#5a6672; --m-ink3:#93a0ad;
  --m-chip:#f2f5f8;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --m-paper:#0b0e13; --m-card:#161b22; --m-line:#252c35; --m-line2:#1d232b;
  --m-ink:#eef2f6; --m-ink2:#96a3b1; --m-ink3:#67747f;
  --m-chip:#1e242c;
}
#mob{display:none;position:fixed;inset:0;flex-direction:column;z-index:1000;background:var(--m-paper)}
body.mobile #mob{display:flex}
body.mobile #topbar,body.mobile #desktop,body.mobile #dock{display:none}
body.mobile{overflow:hidden}

/* --- header --- */
#mhead{display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:var(--m-card);border-bottom:1px solid var(--m-line);flex:none}
#mhead .t{flex:1;min-width:0}
#mtitle{font-weight:680;font-size:17px;letter-spacing:-.022em;color:var(--m-ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
#mtitle.mono{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:-.01em}
#msub{font-size:10.5px;color:var(--m-ink3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.09em;font-weight:600;margin-top:2px}
#mhead button{border:1px solid var(--m-line);background:var(--m-card);color:var(--m-ink2);
  width:36px;height:36px;border-radius:12px;font-size:15px;cursor:pointer;flex:none;position:relative;
  display:flex;align-items:center;justify-content:center;transition:transform .12s,background .12s}
#mhead button:active{transform:scale(.93);background:var(--m-chip)}

#mbody{flex:1;overflow:auto;padding:14px 14px 22px;-webkit-overflow-scrolling:touch}

/* --- tab bar --- */
#mtabs{display:flex;background:var(--m-card);border-top:1px solid var(--m-line);flex:none;
  padding-bottom:env(safe-area-inset-bottom)}
#mtabs button{flex:1;border:none;background:none;color:var(--m-ink3);padding:9px 2px 10px;

  display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;
  transition:color .15s}
#mtabs button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
#mtabs button.on{color:var(--accent)}
#mtabs button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2px;background:var(--accent);border-radius:0 0 2px 2px}

/* --- the card: a drawing title block --- */
.dcard{background:var(--m-card);border:1px solid var(--m-line);border-radius:13px;
  margin-bottom:9px;overflow:hidden;position:relative;cursor:pointer;
  transition:transform .13s ease,border-color .13s}
.dcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--m-ink3)}
.dcard:active{transform:scale(.985);border-color:var(--m-ink3)}
.dcard.k-A::before,.dcard.k-I::before{background:#0f9d58}
.dcard.k-B::before{background:#6fc38a}
.dcard.k-C::before{background:#e8834a}
.dcard.k-D::before{background:#d64545}
.dcard.k-W::before{background:#f0b429}
.dcard.k-N::before{background:#b6bfc9}

.dc-h{display:flex;align-items:center;gap:9px;padding:10px 12px 8px 15px}
.dc-no{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;font-weight:600;
  color:var(--m-ink2);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-code{flex:none;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:2px 8px;border-radius:5px;border:1px solid transparent;background:var(--m-chip);
  color:var(--m-ink2)}
.k-A .dc-code,.k-I .dc-code{background:rgba(15,157,88,.13);color:#0b7a44;border-color:rgba(15,157,88,.25)}
.k-B .dc-code{background:rgba(15,157,88,.09);color:#0b7a44;border-color:rgba(15,157,88,.2)}
.k-C .dc-code{background:rgba(232,131,74,.15);color:#b8551f;border-color:rgba(232,131,74,.3)}
.k-D .dc-code{background:rgba(214,69,69,.14);color:#a92c2c;border-color:rgba(214,69,69,.3)}
.k-W .dc-code{background:rgba(240,180,41,.16);color:#8a6100;border-color:rgba(240,180,41,.32)}
:root[data-theme="dark"] .k-A .dc-code,:root[data-theme="dark"] .k-B .dc-code,
:root[data-theme="dark"] .k-I .dc-code{color:#5fd08e}
:root[data-theme="dark"] .k-C .dc-code{color:#f0a077}
:root[data-theme="dark"] .k-D .dc-code{color:#f08a8a}
:root[data-theme="dark"] .k-W .dc-code{color:#f5c451}

.dc-t{padding:0 12px 10px 15px;font-size:14px;font-weight:600;line-height:1.32;

.dc-m{display:flex;align-items:center;gap:8px;padding:7px 12px 8px 15px;

.dc-m .sep{width:2px;height:2px;border-radius:50%;background:var(--m-ink3);flex:none}
.dc-m .rev{font-family:var(--mono);letter-spacing:.02em;text-transform:none}
.dc-m .late{margin-left:auto;color:#d64545;white-space:nowrap}
.dc-m .out{margin-left:auto;color:#8a6100;white-space:nowrap}

/* stagger the list in, but never for people who asked for less motion */
.dcard{animation:cardin .32s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes cardin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.dcard{animation:none}}

/* --- search + filters --- */
.msearchwrap{position:relative;margin-bottom:11px}
.msearchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);

  -webkit-appearance:none}
#msearch::placeholder{color:var(--m-ink3)}
#msearch:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.mfilt{display:flex;gap:6px;overflow-x:auto;padding-bottom:11px;margin:0 -14px 2px;

.mfilt button{border:1px solid var(--m-line);background:var(--m-card);color:var(--m-ink2);

.applied{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:11px}

  font-size:11px;font-weight:650;letter-spacing:.02em}

  color:var(--m-ink2);border-radius:8px;padding:5px 11px;font-size:11px;font-weight:650;cursor:pointer}

.mcount{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.mcount .n{flex:1 1 auto;min-width:0;font-size:10.5px;font-weight:650;text-transform:uppercase;
  letter-spacing:.08em;color:var(--m-ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcount button{flex:none;white-space:nowrap}
.mcount .n b{font-family:var(--mono);color:var(--m-ink2);font-size:11px}

.spec{background:var(--m-card);border:1px solid var(--m-line);border-radius:13px;

.spec h4{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;
  color:var(--m-ink3);padding:11px 14px 8px;border-bottom:1px solid var(--m-line2)}

.srow .v.none{color:var(--m-ink3);font-weight:400}
.srow.tap{cursor:pointer}
.srow.tap:active{background:var(--m-chip)}
.srow.tap .v::after{content:"›";color:var(--m-ink3);margin-left:9px;font-weight:400}

/* --- dashboard tiles --- */
.mkpi{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.mkpi .kpi{background:var(--m-card);border:1px solid var(--m-line);border-radius:13px;padding:13px 14px}

.mkpi .kpi .v{font-family:var(--mono);font-size:29px;font-weight:700;letter-spacing:-.035em;
  margin-top:5px;line-height:1;color:var(--m-ink)}
.mkpi .kpi .p{font-size:10.5px;color:var(--m-ink2);margin-top:4px;font-weight:500}
.mkpi .kpi .bar{height:3px;border-radius:2px;background:var(--m-chip);margin-top:10px;overflow:hidden}
.mkpi .kpi .bar i{display:block;height:100%;border-radius:2px}
body.mobile .panel{background:var(--m-card);border:1px solid var(--m-line);border-radius:13px;
  padding:14px;margin-bottom:11px}
body.mobile .panel h3{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--m-ink3);margin-bottom:12px}

.empty{padding:44px 20px;text-align:center;color:var(--m-ink3);font-size:13px}
.empty b{display:block;color:var(--m-ink2);font-weight:650;margin-bottom:5px;font-size:14px}

  padding:11px 13px;margin-bottom:12px;font-size:12px;color:var(--m-ink2);line-height:1.5}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');

function msgBox(title,icon,body,acts){
  const w=document.getElementById('msgwrap'),m=document.getElementById('msg');
  m.innerHTML=`<h4>${icon?icon+' ':''}${esc(title)}</h4><div class="body">${body}</div>
    <div class="acts">${(acts||[['Close',null,'']]).map((a,i)=>
      `<button class="btn ${a[2]||''}" data-i="${i}">${esc(a[0])}</button>`).join('')}</div>`;
  w.classList.add('on');
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const fn=(acts||[['Close',null,'']])[+b.dataset.i][1];
    w.classList.remove('on'); if(fn)fn();});
  return m;
}
const closeMsg=()=>document.getElementById('msgwrap').classList.remove('on');
document.getElementById('msgwrap').addEventListener('click',e=>{if(e.target.id==='msgwrap')closeMsg();});

/* ---------------- api ---------------- */
async function api(path,opts){
  const o={...opts}; o.headers={...H(),...(o.headers||{})};
  const r=await fetch(SB_URL+'/rest/v1/'+path,o);
  if(r.status===401||r.status===403){ signOut('Your session expired — please sign in again'); throw new Error('auth'); }
  if(!r.ok)throw new Error(r.status+' '+await r.text());
  // 201 from an insert, and 204 from an update, both come back with no body —
  // calling .json() on those throws, which used to surface as "could not save"
  if(r.status===204||r.status===205)return null;
  const txt=await r.text();
  if(!txt)return null;
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
async function auth(path,body){
  const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',
    headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Sign-in failed');
  return j;
}
async function apiUpdate(id,patch){ if(LIVE) await api('asbuilts?id=eq.'+id,{method:'PATCH',body:JSON.stringify(patch)}); }
async function apiInsert(row){ const r=await api('asbuilts',{method:'POST',
  headers:{Prefer:'return=representation'},body:JSON.stringify(row)}); return r[0]; }
async function apiDelete(id){ if(LIVE) await api('asbuilts?id=eq.'+id,{method:'DELETE'}); }
async function apiBin(id){ if(LIVE) await api('asbuilts?id=eq.'+id,
  {method:'PATCH',body:JSON.stringify({deletedAt:nowTs(),deletedBy:(USER&&USER.email)||''})}); }
async function apiUnbin(id){ if(LIVE) await api('asbuilts?id=eq.'+id,
  {method:'PATCH',body:JSON.stringify({deletedAt:null,deletedBy:''})}); }
async function logAct(action,rec,field,oldV,newV){
  if(!LIVE)return;
  const a={projectId:PROJ,ts:nowTs(),action,tbl:'asbuilts',recId:rec&&rec.id,
    recName:(rec&&rec.docNo)||'',field:field||'',oldVal:String(oldV??''),newVal:String(newV??''),
    actor:(USER&&USER.name)||''};
  ACTS.unshift(a);
  try{await api('activity',{method:'POST',body:JSON.stringify(a)});}catch(e){}
}

/* ---------------- undo / redo ---------------- */
let UNDO=[],REDO=[],_tx=null,_replaying=false;
function txBegin(label){if(_tx||_replaying)return false;_tx={label,ops:[]};return true;}
function txPush(op){ if(_replaying)return;
  if(_tx)_tx.ops.push(op); else {UNDO.push({label:'edit',ops:[op]});REDO.length=0;trimUndo();} }
function txEnd(){ if(_tx&&_tx.ops.length){UNDO.push(_tx);REDO.length=0;trimUndo();} _tx=null; updateUndoBtns(); }
function txAbort(){_tx=null;}
function trimUndo(){ while(UNDO.length>60)UNDO.shift(); updateUndoBtns(); }
async function applyOp(op,dir){
  const v=dir<0?op.from:op.to;
  if(op.t==='set'){
    const r=AB.find(x=>x.id===op.id); if(!r)return;
    r[op.k]=v; await apiUpdate(op.id,{[op.k]:v});
  }else if(op.t==='add'){
    if(dir<0){ AB=AB.filter(x=>x.id!==op.id); await apiDelete(op.id); }
    else { const row=await apiInsert(op.row); AB.push(row); op.id=row.id; }
  }else if(op.t==='del'){
    if(dir<0){ await apiUnbin(op.id); AB.push(op.row); }
    else { AB=AB.filter(x=>x.id!==op.id); await apiBin(op.id); }
  }
}
async function undo(){
  if(!UNDO.length)return toast('Nothing to undo');
  const t=UNDO.pop(); _replaying=true;
  for(let i=t.ops.length-1;i>=0;i--) await applyOp(t.ops[i],-1);
  _replaying=false; REDO.push(t); updateUndoBtns(); refresh(); toast('Undid '+t.label);
}
async function redo(){
  if(!REDO.length)return toast('Nothing to redo');
  const t=REDO.pop(); _replaying=true;
  for(const op of t.ops) await applyOp(op,1);
  _replaying=false; UNDO.push(t); updateUndoBtns(); refresh(); toast('Redid '+t.label);
}
function updateUndoBtns(){
  const u=document.getElementById('b-undo'),r=document.getElementById('b-redo');
  if(u)u.disabled=!UNDO.length||!canEdit(); if(r)r.disabled=!REDO.length||!canEdit();
}
async function setCell(row,k,val,silent){
  const before=row[k]??'';
  if(String(before)===String(val))return;
  row[k]=val;
  txPush({t:'set',id:row.id,k,from:before,to:val});
  try{ await apiUpdate(row.id,{[k]:val}); await logAct('edit',row,k,before,val); }
  catch(e){ row[k]=before; toast('Not saved — check your connection'); console.error(e); return; }
  if(!silent){ await loadRevs(); refresh(); }
}

/* ================= window manager ================= */
const WINS=new Map(); let winSeq=0, focused=null;
const desk=()=>document.getElementById('desktop');

function createWindow(kind,title,sub,x,y,w,h){
  const ex=[...WINS.values()].find(v=>v.kind===kind);
  if(ex){focusWin(ex.id);return ex;}
  const id='w'+(++winSeq);
  const D=desk();
  const win={id,kind,title,sub,x:x??(24+WINS.size*26),y:y??(18+WINS.size*22),
    w:w??Math.min(1180,D.clientWidth-60),h:h??Math.min(660,D.clientHeight-50),min:false,max:false};
  const el=document.createElement('div');
  el.className='win';el.id=id;
  el.innerHTML=`<div class="wbar"><div class="wt">${esc(title)}<small>${esc(sub||'')}</small></div>
      <button class="wb" data-w="min" title="Minimise">–</button>
      <button class="wb" data-w="max" title="Maximise">▢</button>
      <button class="wb" data-w="close" title="Close">✕</button></div>
    <div class="wbody"></div>
    <div class="grip e"></div><div class="grip s"></div><div class="grip se"></div>`;
  D.appendChild(el);
  win.el=el; win.body=el.querySelector('.wbody');
  WINS.set(id,win); applyRect(win); focusWin(id);
  el.addEventListener('pointerdown',()=>focusWin(id),true);
  el.querySelector('.wbar').addEventListener('pointerdown',e=>{
    if(e.target.closest('.wb'))return; startDrag(e,win);});
  el.querySelectorAll('.wb').forEach(b=>b.onclick=()=>{
    const a=b.dataset.w;
    if(a==='close')closeWin(id);
    else if(a==='min'){win.min=true;applyRect(win);renderDock();}
    else{win.max=!win.max;applyRect(win);} });
  el.querySelector('.grip.e').addEventListener('pointerdown',e=>startResize(e,win,1,0));
  el.querySelector('.grip.s').addEventListener('pointerdown',e=>startResize(e,win,0,1));
  el.querySelector('.grip.se').addEventListener('pointerdown',e=>startResize(e,win,1,1));
  renderDock();
  return win;
}
function applyRect(w){
  const D=desk(), el=w.el;
  if(w.min){el.style.display='none';return;}
  el.style.display='flex';
  if(w.max){Object.assign(el.style,{left:'6px',top:'6px',width:(D.clientWidth-12)+'px',height:(D.clientHeight-12)+'px'});return;}
  w.x=Math.max(-w.w+120,Math.min(w.x,D.clientWidth-80));
  w.y=Math.max(0,Math.min(w.y,D.clientHeight-40));
  Object.assign(el.style,{left:w.x+'px',top:w.y+'px',width:w.w+'px',height:w.h+'px'});
}
function focusWin(id){
  focused=id;
  [...WINS.values()].forEach(w=>{w.el.classList.toggle('focus',w.id===id);});
  const w=WINS.get(id); if(w){w.el.style.zIndex=++winSeq+100; if(w.min){w.min=false;applyRect(w);renderDock();}}
}
function closeWin(id){const w=WINS.get(id);if(!w)return;w.el.remove();WINS.delete(id);renderDock();}
function arrangeWins(){
  const list=[...WINS.values()].filter(w=>!w.min); if(!list.length)return;
  const D=desk(), cols=Math.ceil(Math.sqrt(list.length)), rows=Math.ceil(list.length/cols);
  list.forEach((w,i)=>{ w.max=false;
    w.w=Math.floor(D.clientWidth/cols)-10; w.h=Math.floor(D.clientHeight/rows)-10;
    w.x=(i%cols)*(w.w+8)+6; w.y=Math.floor(i/cols)*(w.h+8)+6; applyRect(w);});
  toast('Windows tidied');
}
function renderDock(){
  const d=document.getElementById('dock');
  const btns=[...WINS.values()].map(w=>
    `<button data-d="${w.id}">${w.min?'▫ ':''}${esc(w.title)}</button>`).join('');
  d.innerHTML=btns+`<span class="st" id="dockst">${dockStatus()}</span>`;
  d.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>focusWin(b.dataset.d));
}
function dockStatus(){
  const s=stats();
  return (LIVE?'● live':'● snapshot, read-only')+' · '+s.t+' drawings · '+
    s.sub+' submitted · '+s.ur+' under review'+(USER?' · '+esc(USER.name):'')+' · build '+BUILD;
}
let _drag=null;
function startDrag(e,w){
  if(w.max)return;
  _drag={w,dx:e.clientX-w.x,dy:e.clientY-w.y,mode:'move'};
  e.target.setPointerCapture(e.pointerId);
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd,{once:true});
}
function startResize(e,w,ex,ey){
  if(w.max)return;
  _drag={w,sx:e.clientX,sy:e.clientY,w0:w.w,h0:w.h,ex,ey,mode:'size'};
  e.target.setPointerCapture(e.pointerId);
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd,{once:true});
  e.preventDefault();
}
function dragMove(e){
  if(!_drag)return; const w=_drag.w, D=desk(), g=document.getElementById('snapghost');
  if(_drag.mode==='move'){
    w.x=e.clientX-_drag.dx; w.y=e.clientY-_drag.dy; applyRect(w);
    const r=D.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
    let z=null;
    if(px<28)z={left:0,top:0,width:D.clientWidth/2,height:D.clientHeight};
    else if(px>D.clientWidth-28)z={left:D.clientWidth/2,top:0,width:D.clientWidth/2,height:D.clientHeight};
    else if(py<10)z={left:0,top:0,width:D.clientWidth,height:D.clientHeight};
    _drag.zone=z;
    if(z){Object.assign(g.style,{display:'block',left:z.left+'px',top:z.top+'px',
      width:z.width+'px',height:z.height+'px'});}
    else g.style.display='none';
  }else{
    if(_drag.ex)w.w=Math.max(340,_drag.w0+(e.clientX-_drag.sx));
    if(_drag.ey)w.h=Math.max(190,_drag.h0+(e.clientY-_drag.sy));
    applyRect(w);
  }
}
function dragEnd(){
  document.removeEventListener('pointermove',dragMove);
  document.getElementById('snapghost').style.display='none';
  if(_drag&&_drag.zone){const w=_drag.w,z=_drag.zone;
    w.x=z.left;w.y=z.top;w.w=z.width;w.h=z.height;w.max=false;applyRect(w);}
  _drag=null;
}
window.addEventListener('resize',()=>{ [...WINS.values()].forEach(applyRect); checkMode(); });

let GRID=null; const PICKED=new Set();   /* {win, rows, sel:{r1,c1,r2,c2}, cur:{r,c}, sort:{k,dir}, filters} */

function openRegister(){
  const w=createWindow('reg','Register','as-built drawings');
  GRID={win:w, sort:{k:'sn',dir:1}, q:'', fd:'', fs:'', fx:'', fage:null, fageL:'',
        sel:null, cur:{r:0,c:0}, editing:null};
  renderGrid();
  return w;
}
function gridRows(){
  const q=GRID.q.toLowerCase();
  let rows=AB.filter(r=>{
    if(q&&!((r.docNo||'')+' '+(r.title||'')).toLowerCase().includes(q))return false;
    if(GRID.fd&&r.discipline!==GRID.fd)return false;
    if(GRID.fs&&(r.status||'Not Submitted')!==GRID.fs)return false;
    if(GRID.fx==='open'&&!isOpen(r))return false;
    if(GRID.fx==='ur'&&r.status!=='W')return false;
    if(GRID.fx==='late'&&!(!APPROVED.includes(r.status)&&r.targetDate&&r.targetDate<today))return false;
    if(GRID.fx==='ns'&&r.status!=='Not Submitted')return false;
    if(GRID.fage){ if(r.status!=='W'||!r.actualSub)return false;
      const a=days(r.actualSub,today);
      if(a<GRID.fage[0]||a>GRID.fage[1])return false; }
    return true;
  });
  const {k,dir}=GRID.sort, c=COLBY[k];
  rows.sort((a,b)=>{
    const va=c&&c.calc?c.calc(a):(a[k]??''), vb=c&&c.calc?c.calc(b):(b[k]??'');
    const ea=String(va).trim()==='', eb=String(vb).trim()==='';
    if(ea!==eb)return ea?1:-1;          /* blanks always sit at the bottom */
    if(ea&&eb)return 0;
    const na=parseFloat(va),nb=parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb))return (na-nb)*dir;
    return String(va).localeCompare(String(vb))*dir;
  });
  return rows;
}
function cellText(r,c){
  const v=c.calc?c.calc(r):(r[c.k]??'');
  if(c.pill){const k=v||'Not Submitted';
    return `<span class="pill ${k==='Not Submitted'?'s-N':'s-'+k}">${esc(k==='Not Submitted'?'Not sub.':k)}</span>`;}
  if(c.k==='title'&&CCOUNT[r.id])
    return esc(v)+'<span class="cbadge" title="'+CCOUNT[r.id]+' comment(s)">'+CCOUNT[r.id]+'</span>';
  return esc(v);
}

  const body=`<tbody>${rows.map((r,ri)=>

    th.ondragstart=e=>{e.dataTransfer.setData('text/plain',th.dataset.k);th.classList.add('drag');};
    th.ondragend=()=>th.classList.remove('drag');
    th.ondragover=e=>e.preventDefault();
    th.ondrop=e=>{e.preventDefault();

    if(!dragging)return; const td=e.target.closest('td[data-c]'); if(!td)return;

  document.addEventListener('pointerup',()=>{dragging=false;},{once:false});

    const td=e.target.closest('td[data-c]'); if(td)beginEdit(+td.dataset.r,+td.dataset.c);});

}
function paintSel(){
  const tbl=document.querySelector('#gwrap table'); if(!tbl||!GRID.sel)return;

  const [ra,rb]=[Math.min(r1,r2),Math.max(r1,r2)],[ca,cb]=[Math.min(c1,c2),Math.max(c1,c2)];
  tbl.querySelectorAll('td[data-c]').forEach(td=>{
    const r=+td.dataset.r,c=+td.dataset.c;
    td.classList.toggle('sel',r>=ra&&r<=rb&&c>=ca&&c<=cb);

function selCells(){
  if(!GRID.sel)return[];

  for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)
    for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)
      if(GRID.rows[r]&&cs[c])out.push({row:GRID.rows[r],col:cs[c],r,c});

function beginEdit(r,c){
  const cs=visCols(), col=cs[c], row=GRID.rows[r];

    el.innerHTML=col.opts().map(o=>`<option${String(cur)===String(o)?' selected':''}>${esc(o)}</option>`).join('');
  }else{ el=document.createElement('input'); el.type=col.date?'date':'text'; el.value=cur; }
  el.className='cellin'; td.appendChild(el); el.focus(); if(el.select)el.select();
  const done=async(commit)=>{
    if(GRID.editing===null)return; GRID.editing=null;
    const v=el.value;
    el.remove();
    if(commit)await setCell(row,col.k,v);
    else renderGrid();
    const wrap=document.getElementById('gwrap'); if(wrap)wrap.focus();
  };
  el.addEventListener('blur',()=>done(true));
  el.addEventListener('keydown',ev=>{
    ev.stopPropagation();
    if(ev.key==='Enter'){ev.preventDefault();done(true);}
    if(ev.key==='Escape'){ev.preventDefault();done(false);}
    if(ev.key==='Tab'){ev.preventDefault();done(true).then(()=>{
      GRID.cur={r,c:Math.min(c+1,cs.length-1)};GRID.sel={r1:r,c1:GRID.cur.c,r2:r,c2:GRID.cur.c};paintSel();});}
  });
}
async function gridKey(e){
  if(GRID.editing)return;
  const cs=visCols(), maxR=GRID.rows.length-1, maxC=cs.length-1;
  const mv=(dr,dc,ext)=>{
    const r=Math.max(0,Math.min(maxR,GRID.cur.r+dr)), c=Math.max(0,Math.min(maxC,GRID.cur.c+dc));
    GRID.cur={r,c};
    GRID.sel=ext&&GRID.sel?{...GRID.sel,r2:r,c2:c}:{r1:r,c1:c,r2:r,c2:c};
    paintSel();
    const td=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
    if(td)td.scrollIntoView({block:'nearest',inline:'nearest'});
  };
  const k=e.key;
  if(k==='ArrowDown'){e.preventDefault();mv(1,0,e.shiftKey);}
  else if(k==='ArrowUp'){e.preventDefault();mv(-1,0,e.shiftKey);}
  else if(k==='ArrowLeft'){e.preventDefault();mv(0,-1,e.shiftKey);}
  else if(k==='ArrowRight'||k==='Tab'){e.preventDefault();mv(0,1,e.shiftKey&&k!=='Tab');}
  else if(k==='Enter'){e.preventDefault();beginEdit(GRID.cur.r,GRID.cur.c);}
  else if(k==='Delete'||k==='Backspace'){e.preventDefault();await clearSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='c'){e.preventDefault();copySel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='a'){e.preventDefault();
    GRID.sel={r1:0,c1:0,r2:maxR,c2:maxC};paintSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();undo();}
  else if((e.ctrlKey||e.metaKey)&&(k.toLowerCase()==='y'||(e.shiftKey&&k.toLowerCase()==='z'))){e.preventDefault();redo();}
  else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    beginEdit(GRID.cur.r,GRID.cur.c);
    const el=document.querySelector('.cellin');
    if(el&&el.tagName==='INPUT'){el.value=k;}
  }
}
function copySel(){
  const cells=selCells(); if(!cells.length)return;
  const {r1,r2,c1,c2}=GRID.sel;
  const [ra,rb]=[Math.min(r1,r2),Math.max(r1,r2)],[ca,cb]=[Math.min(c1,c2),Math.max(c1,c2)];
  const cs=visCols(), lines=[];
  for(let r=ra;r<=rb;r++){
    const row=GRID.rows[r]; if(!row)continue;
    const cells=[];
    for(let c=ca;c<=cb;c++){const col=cs[c]; cells.push(col.calc?col.calc(row):(row[col.k]??''));}
    lines.push(cells.join('\t'));
  }
  const txt=lines.join('\r\n');
  navigator.clipboard.writeText(txt).then(()=>toast(lines.length+' row(s) copied'))
    .catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
      ta.select();document.execCommand('copy');ta.remove();toast('Copied');});
}
function parseTSV(txt){
  return txt.replace(/\r\n?/g,'\n').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
}
async function pasteIntoSel(txt){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const data=parseTSV(txt); if(!data.length)return;
  const cs=visCols(), {r1,c1,r2,c2}=GRID.sel||{r1:0,c1:0,r2:0,c2:0};
  const ra=Math.min(r1,r2), ca=Math.min(c1,c2);
  txBegin('paste');
  let n=0,skipped=0;
  for(let i=0;i<data.length;i++){
    const row=GRID.rows[ra+i]; if(!row)break;
    for(let j=0;j<data[i].length;j++){
      const col=cs[ca+j]; if(!col)break;
      if(col.ro){skipped++;continue;}
      await setCell(row,col.k,data[i][j].trim(),true); n++;
    }
  }
  txEnd(); renderGrid();
  toast(n+' cell(s) pasted'+(skipped?', '+skipped+' calculated cell(s) skipped':''));
}
async function clearSel(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const cells=selCells().filter(x=>!x.col.ro); if(!cells.length)return;
  txBegin('clear '+cells.length+' cell(s)');
  for(const {row,col} of cells) await setCell(row,col.k,'',true);
  txEnd(); renderGrid(); toast(cells.length+' cell(s) cleared');
}

/* ================= discussion =================
   A thread per drawing. Every comment carries who wrote it and when.
   Anyone signed in can read and post; you can edit or remove your own,
   an admin can remove anything. */

let CMTS={}, MEMBERS=[];                       // asbuiltId -> [comment]
async function loadComments(id){
  try{
    const list=await api('comments?asbuiltId=eq.'+id+'&deletedAt=is.null&order=createdAt.asc');
    CMTS[id]=list; return list;
  }catch(e){ CMTS[id]=[]; return []; }
}
async function loadCommentCounts(){
  try{
    const list=await api('comments?deletedAt=is.null&select=asbuiltId');
    CCOUNT={}; list.forEach(c=>{CCOUNT[c.asbuiltId]=(CCOUNT[c.asbuiltId]||0)+1;});
  }catch(e){ CCOUNT={}; }
}
let CCOUNT={};
const ago=ts=>{
  if(!ts)return '';
  const mins=Math.round((Date.now()-new Date(ts))/60000);
  if(mins<1)return 'just now';
  if(mins<60)return mins+' min ago';
  if(mins<1440)return Math.round(mins/60)+'h ago';
  const d=Math.round(mins/1440);
  if(d<8)return d+'d ago';
  return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'});
};
const initials=n=>(n||'?').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

function commentsHTML(id){
  const list=CMTS[id]||[];
  if(!list.length)return '<div class="empty">No discussion yet. Start it below.</div>';
  return `<div class="thread">${list.map(c=>{
    const mine=USER&&c.authorId===USER.id;
    return `<div class="cmt" data-c="${c.id}">
      <div class="av">${esc(initials(c.authorName))}</div>
      <div class="cb">
        <div class="ch"><b>${esc(c.authorName||c.authorEmail)}</b>
          <span>${esc(ago(c.createdAt))}${c.editedAt?' · edited':''}</span>
          ${(mine||canAdmin())?`<button class="cx" data-del="${c.id}" title="Remove">✕</button>`:''}
          ${mine?`<button class="cx" data-edit="${c.id}" title="Edit">✎</button>`:''}
        </div>
        <div class="ct">${renderMentions(c.body).replace(/\n/g,'<br>')}</div>
      </div></div>`;}).join('')}</div>`;
}
function composerHTML(id){
  if(!LIVE||!USER)return '';
  return `<div class="composer">
    <div class="av me">${esc(initials(USER.name))}</div>
    <div class="cwrap">
      <textarea id="cnew" rows="2" placeholder="Write a comment…  type @ to mention someone"></textarea>
      <div class="mpick" id="mpick"></div>
    </div>
    <button class="btn primary" id="csend">Post</button></div>`;
}
function findMentions(text){
  const hits=[];
  MEMBERS.forEach(m=>{
    const n=(m.name||'').trim(); if(!n)return;
    const re=new RegExp('@'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    if(re.test(text))hits.push(m);
  });
  return hits;
}
function renderMentions(text){
  let out=esc(text);
  MEMBERS.forEach(m=>{
    const n=(m.name||'').trim(); if(!n)return;
    out=out.replace(new RegExp('@'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),
      '<span class="mention">@'+esc(n)+'</span>');
  });
  return out;
}
async function notifyMentions(text,r,commentId){
  const hits=findMentions(text).filter(m=>!USER||m.user_id!==USER.id);
  for(const m of hits){
    try{
      await api('notifs',{method:'POST',body:JSON.stringify({
        projectId:PROJ, ts:nowTs(), kind:'mention',
        title:(USER?USER.name:'Someone')+' mentioned you',
        body:text.slice(0,220), toUser:m.user_id,
        fromName:(USER&&USER.name)||'', docNo:r.docNo||'',
        asbuiltId:r.id, commentId:commentId||null, read:'', cleared:''})});
    }catch(e){ console.warn('could not notify',m.name,e); }
  }
  return hits;
}
async function postComment(id,body){
  if(!body.trim())return;
  const row={asbuiltId:id,body:body.trim(),authorId:USER.id,
    authorName:USER.name||USER.email,authorEmail:USER.email};
  const r=await api('comments',{method:'POST',
    headers:{Prefer:'return=representation'},body:JSON.stringify(row)});
  (CMTS[id]=CMTS[id]||[]).push(r[0]);
  const drawing=AB.find(x=>x.id===id)||{id,docNo:''};
  const told=await notifyMentions(body.trim(),drawing,r[0].id);
  if(told.length)toast('Notified '+told.map(m=>m.name.split(' ')[0]).join(', '));
  CCOUNT[id]=(CCOUNT[id]||0)+1;
  await logAct('comment',AB.find(x=>x.id===id)||{id},'discussion','',body.trim().slice(0,60));
  if(GRID&&GRID.win&&WINS.has(GRID.win.id))renderGrid();
}
async function removeComment(id,cid){
  await api('comments?id=eq.'+cid,{method:'PATCH',body:JSON.stringify({deletedAt:nowTs()})});
  CMTS[id]=(CMTS[id]||[]).filter(c=>c.id!==cid);
  CCOUNT[id]=Math.max(0,(CCOUNT[id]||1)-1);
  if(GRID&&GRID.win&&WINS.has(GRID.win.id))renderGrid();
}
function wireComments(root,id,redraw){
  const send=root.querySelector('#csend'), ta=root.querySelector('#cnew');
  if(send)send.onclick=async()=>{
    const v=ta.value; if(!v.trim())return;
    send.disabled=true;
    try{ await postComment(id,v); ta.value=''; redraw(); }
    catch(e){ toast('Could not post that comment'); }
    finally{ send.disabled=false; }
  };
  if(ta){
    const pick=root.querySelector('#mpick');
    let open=false, idx=0, matches=[];
    const close=()=>{open=false;if(pick){pick.style.display='none';pick.innerHTML='';}};
    const paint=()=>{
      if(!pick)return;
      pick.innerHTML=(matches.length?'<div class="mphd">Mention someone</div>':'')+
        matches.map((m,i)=>
        `<button class="mp${i===idx?' on':''}" data-m="${i}">
           <b>${esc(m.name)}</b><i>${esc(m.role)}</i></button>`).join('');
      pick.style.display=matches.length?'block':'none';
      pick.querySelectorAll('[data-m]').forEach(b=>b.onmousedown=e=>{
        e.preventDefault(); insert(matches[+b.dataset.m]);});
    };
    const insert=m=>{
      const v=ta.value, c=ta.selectionStart;
      const at=v.lastIndexOf('@',c-1);
      ta.value=v.slice(0,at)+'@'+m.name+' '+v.slice(c);
      const np=at+m.name.length+2;
      close(); ta.focus(); ta.setSelectionRange(np,np);
    };
    const scan=()=>{
      const v=ta.value, c=ta.selectionStart;
      const at=v.lastIndexOf('@',c-1);
      if(at<0||(at>0&&/\S/.test(v[at-1]))){close();return;}
      const frag=v.slice(at+1,c);
      if(/\s{2,}|\n/.test(frag)){close();return;}
      matches=MEMBERS.filter(m=>m.user_id!==(USER&&USER.id)
        &&(m.name||'').toLowerCase().includes(frag.toLowerCase())).slice(0,4);
      idx=0; open=matches.length>0; paint();
    };
    ta.addEventListener('input',scan);
    ta.addEventListener('click',scan);
    ta.addEventListener('blur',()=>setTimeout(close,150));
    ta.addEventListener('keydown',e=>{
      if(open&&matches.length){
        if(e.key==='ArrowDown'){e.preventDefault();idx=(idx+1)%matches.length;paint();return;}
        if(e.key==='ArrowUp'){e.preventDefault();idx=(idx-1+matches.length)%matches.length;paint();return;}
        if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insert(matches[idx]);return;}
        if(e.key==='Escape'){close();return;}
      }
      if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send.click();}
    });
  }
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    msgBox('Remove this comment?','','It will no longer be shown to anyone.',
      [['Cancel',null,''],['Remove',async()=>{await removeComment(id,+b.dataset.del);redraw();},'danger']]);});
  root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{
    const c=(CMTS[id]||[]).find(x=>x.id===+b.dataset.edit); if(!c)return;
    msgBox('Edit your comment','',
      `<textarea id="cedit" rows="4" style="width:100%;padding:9px;border-radius:9px;
        border:1px solid var(--ring);background:var(--field);color:var(--ink);font:inherit">${esc(c.body)}</textarea>`,
      [['Cancel',null,''],['Save',async()=>{
        const v=document.getElementById('cedit').value.trim(); if(!v)return;
        await api('comments?id=eq.'+c.id,{method:'PATCH',
          body:JSON.stringify({body:v,editedAt:nowTs()})});
        c.body=v; c.editedAt=nowTs(); redraw();},'primary']]);});
}

  w.body.innerHTML='<div class="dash"><div class="hint">Loading…</div></div>';

/* ================= weekly submission plan =================
   Pick drawings, say who is submitting each and by when. The person
   responsible need not have a login — they are names on a list. */

let ASSIGNEES=[], PLANS=[], PITEMS={};
/* the working week here runs Saturday to Thursday */
const WEEK_DAYS=6;
const weekStartOf=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+1)%7));
  return x.toISOString().slice(0,10);};
const monday=weekStartOf;            /* kept so older calls still work */
const weekEndOf=ws=>{const b=new Date(ws);b.setDate(b.getDate()+WEEK_DAYS-1);
  return b.toISOString().slice(0,10);};
const weekLabel=ws=>{
  const a=new Date(ws), b=new Date(weekEndOf(ws));
  const f=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  return 'Sat '+f(a)+' – Thu '+f(b);
};
function weekOptions(back,fwd){
  const out=[], base=new Date(weekStartOf(today));
  for(let i=-back;i<=fwd;i++){
    const d=new Date(base); d.setDate(d.getDate()+i*7);
    const ws=d.toISOString().slice(0,10);
    const taken=PLANS.find(p=>p.weekStart===ws);
    out.push({ws,label:weekLabel(ws),taken:!!taken,planId:taken?taken.id:null,
      note:i===0?'this week':i===1?'next week':i===-1?'last week'
        :i<0?Math.abs(i)+' weeks ago':'in '+i+' weeks'});
  }
  return out;
}
const planStarted=p=>!!p&&p.weekStart<=today;
const planEnded=p=>!!p&&weekEndOf(p.weekStart)<today;
const planPhase=p=>{
  if(!p)return {k:'none',label:''};
  if(!planStarted(p)){
    const d=days(today,p.weekStart);
    return {k:'future',label:d===1?'Starts tomorrow':'Starts in '+d+' days'};
  }
  if(planEnded(p))return {k:'past',label:'Week finished'};
  return {k:'live',label:'Live this week'};
};
async function loadPlanning(){
  try{
    [ASSIGNEES,PLANS]=await Promise.all([
      api('assignees?active=is.true&order=usedCount.desc,name.asc'),
      api('plans?projectId=eq.'+PROJ+'&deletedAt=is.null&order=weekStart.desc')]);
  }catch(e){ ASSIGNEES=[]; PLANS=[]; }
}
async function loadPlanItems(planId){
  try{ PITEMS[planId]=await api('plan_items?planId=eq.'+planId+'&order=id.asc'); }
  catch(e){ PITEMS[planId]=[]; }
  return PITEMS[planId];
}
const assigneeName=id=>{const a=ASSIGNEES.find(x=>x.id===id);return a?a.name:'— not assigned —';};
/* the people who do the submitting are kept separately from the login
   accounts — type a name once and it is remembered for next time */
function assigneeField(id,val){
  const cur=val!=null?val:(id?assigneeName(id):'');
  return `<input class="f big" id="asgName" list="asgList" autocomplete="off"
      placeholder="Type a name, or pick one you have used before"
      value="${esc(cur==='— not assigned —'?'':cur)}">
    <datalist id="asgList">${ASSIGNEES.map(a=>
      `<option value="${esc(a.name)}">${esc(a.role||'')}</option>`).join('')}</datalist>
    ${ASSIGNEES.length?`<div class="asgchips">${ASSIGNEES.slice(0,8).map(a=>
      `<button type="button" class="asgchip" data-asg="${esc(a.name)}">${esc(a.name)}</button>`).join('')}
      </div>`:'<div class="hint" style="margin-top:6px">No names saved yet — type one and it will be remembered.</div>'}`;

function wireAssignee(){
  document.querySelectorAll('[data-asg]').forEach(b=>b.onclick=()=>{

/* resolve a typed name to an assignee, creating and remembering it if new */
async function resolveAssignee(name){
  const n=(name||'').trim();
  if(!n)return null;
  const hit=ASSIGNEES.find(a=>a.name.toLowerCase()===n.toLowerCase());
  if(hit){
    api('assignees?id=eq.'+hit.id,{method:'PATCH',
      body:JSON.stringify({usedCount:(hit.usedCount||0)+1,lastUsed:nowTs()})}).catch(()=>{});
    return hit.id;
  }
  try{
    const r=await api('assignees',{method:'POST',headers:{Prefer:'return=representation'},
      body:JSON.stringify({name:n,reportsTo:USER?USER.id:null,usedCount:1,lastUsed:nowTs()})});
    await loadPlanning();
    return r[0].id;
  }catch(e){ await loadPlanning();
    const again=ASSIGNEES.find(a=>a.name.toLowerCase()===n.toLowerCase());
    return again?again.id:null; }
}

/* An item counts as achieved when the drawing has been submitted SINCE it was
   planned — comparing against the submission date captured when it was added,
   so work already done beforehand is not claimed as progress. */
function itemState(it,plan){
  const r=AB.find(a=>a.id===it.asbuiltId)||{};
  if(plan&&!planStarted(plan))
    return {k:'pending',label:'Planned',cls:'st-none'};
  const sub=(r.actualSub||'').trim(), base=(it.baseSub||'').trim();
  const done=!!sub&&sub!==base;
  if(done){
    const late=it.targetDate&&sub>it.targetDate;
    return {k:late?'late':'done',label:late?'Submitted late':'Submitted',
            cls:late?'st-late':'st-done',sub,days:it.targetDate?days(it.targetDate,sub):null};
  }
  if(it.targetDate&&it.targetDate<today)
    return {k:'overdue',label:days(it.targetDate,today)+'d overdue',cls:'st-over'};
  if(it.targetDate)return {k:'due',label:'Due '+it.targetDate,cls:'st-due'};
  return {k:'nodate',label:'No target date',cls:'st-none'};
}
function planProgress(planId){
  const items=PITEMS[planId]||[];
  const plan=PLANS.find(p=>p.id===planId);
  const st=items.map(it=>itemState(it,plan));
  const done=st.filter(x=>x.k==='done'||x.k==='late').length;
  return {total:items.length,done,
    onTime:st.filter(x=>x.k==='done').length,
    late:st.filter(x=>x.k==='late').length,
    overdue:st.filter(x=>x.k==='overdue').length,
    open:st.filter(x=>x.k==='due'||x.k==='nodate'||x.k==='pending').length,
    pct:items.length?Math.round(done/items.length*100):0,
    started:planStarted(plan),phase:planPhase(plan)};
}
function progressBar(p){
  const w=n=>p.total?(n/p.total*100):0;
  if(!p.started)return `<div class="pgwrap">
    <div class="pgnum"><b>—</b><span>${p.total} drawing(s) planned · ${esc(p.phase.label)}</span></div>
    <div class="pgbar"></div>
    <div class="pglg"><span>Progress starts being measured on the first day of the week.</span></div></div>`;
  return `<div class="pgwrap">
    <div class="pgnum"><b>${p.pct}%</b><span>${p.done} of ${p.total} submitted${
      p.phase.k==='past'?' · week finished':''}</span></div>
    <div class="pgbar">
      <i class="on" style="width:${w(p.onTime)}%"></i>
      <i class="lt" style="width:${w(p.late)}%"></i>
      <i class="ov" style="width:${w(p.overdue)}%"></i>
    </div>
    <div class="pglg">
      <span><i class="on"></i>On time ${p.onTime}</span>
      <span><i class="lt"></i>Late ${p.late}</span>
      <span><i class="ov"></i>Overdue ${p.overdue}</span>
      <span><i class="op"></i>Still to come ${p.open}</span>
    </div></div>`;
}

      ||'<div class="empty">Nothing matches.</div>'}</div>
    <div class="hint" id="pksum" style="margin-top:8px">${chosen.size} selected</div>`;
  const m=msgBox('Add drawings to the plan','',body(),
    [['Cancel',null,''],['Add selected',async()=>{
      let added=0,already=0;
      for(const id of chosen){
        try{ await api('plan_items',{method:'POST',body:JSON.stringify({planId,asbuiltId:id})}); added++; }
        catch(e){ already++; }

    },'primary']]);
  const wire=()=>{
    const box=document.getElementById('msg');
    box.querySelectorAll('[data-p]').forEach(cb=>cb.onchange=()=>{
      const id=+cb.dataset.p; cb.checked?chosen.add(id):chosen.delete(id);

    const fi=document.getElementById('pkf');
