<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>As-Built Tracker — IWTP2</title>
<style>
:root{
  color-scheme:light;
  --page1:#eef1f4; --page2:#e4e9ee;
  --glass:rgba(252,252,251,.94); --surface:#fcfcfb; --surface2:#f0efec; --field:#ffffff;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --ring:rgba(11,11,11,.09);
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10); --accent-soft2:rgba(42,120,214,.16);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --goodtext:#006300;
  --sel:rgba(42,120,214,.14); --selb:#2a78d6;
  --shadow:0 10px 34px rgba(15,20,30,.16),0 2px 8px rgba(15,20,30,.08);
  --shadow-focus:0 18px 50px rgba(15,20,30,.24),0 3px 10px rgba(15,20,30,.10);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page1:#101216; --page2:#0b0c0f;
  --glass:rgba(26,26,25,.94); --surface:#1a1a19; --surface2:#2c2c2a; --field:#111110;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.14); --accent-soft2:rgba(57,135,229,.22);
  --goodtext:#0ca30c; --sel:rgba(57,135,229,.20); --selb:#3987e5;
  --shadow:0 10px 34px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --shadow-focus:0 18px 50px rgba(0,0,0,.65),0 3px 10px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;color:var(--ink);
  background:radial-gradient(1200px 700px at 20% 0%,var(--page1),var(--page2));user-select:none}
button,input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ top bar ============ */
#topbar{height:52px;display:flex;align-items:center;gap:6px;padding:0 14px;
  background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--ring);
  position:relative;z-index:900}
#topbar .logo{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
#topbar .title{font-weight:650;font-size:13.5px;letter-spacing:-.01em;margin-right:6px;white-space:nowrap}
#topbar .title small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
#topbar .spacer{flex:1}
.tbbtn{border:none;background:none;color:var(--ink2);font-size:12.5px;padding:7px 11px;
  border-radius:9px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tbbtn:hover{background:var(--accent-soft);color:var(--ink)}
.tbbtn:disabled{opacity:.35;cursor:default}
.tbbtn:disabled:hover{background:none;color:var(--ink2)}
.menuwrap{position:relative}
.menucard{display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:236px;
  background:var(--surface);border:1px solid var(--ring);border-radius:12px;
  box-shadow:var(--shadow);padding:6px;z-index:999}
.menuwrap.open .menucard{display:block}
.menucard button{display:flex;width:100%;text-align:left;background:none;border:none;
  font-size:12.5px;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;
  gap:9px;align-items:center}
.menucard button:hover{background:var(--accent-soft)}
.menucard hr{border:none;border-top:1px solid var(--ring);margin:5px 2px}
.bell{position:relative}
.bell i{position:absolute;top:2px;right:4px;background:var(--critical);color:#fff;
  border-radius:10px;font-size:9px;font-style:normal;padding:0 4px;line-height:14px;min-width:14px;text-align:center}

/* ============ desktop ============ */
#desktop{position:absolute;inset:52px 0 26px 0;overflow:hidden}
#dock{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;gap:6px;
  align-items:center;padding:0 10px;background:var(--glass);border-top:1px solid var(--ring);
  font-size:11.5px;z-index:800;overflow-x:auto}
#dock button{border:1px solid var(--ring);background:var(--surface2);color:var(--ink2);
  border-radius:7px;padding:1px 9px;cursor:pointer;font-size:11px;white-space:nowrap}
#dock button:hover{background:var(--accent-soft)}
#dock .st{margin-left:auto;color:var(--muted);white-space:nowrap;padding-left:12px}

.win{position:absolute;background:var(--surface);border:1px solid var(--ring);border-radius:13px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:320px;min-height:180px}
.win.focus{box-shadow:var(--shadow-focus);border-color:var(--accent-soft2)}
.win .wbar{height:34px;display:flex;align-items:center;gap:7px;padding:0 8px 0 12px;
  background:var(--surface2);border-bottom:1px solid var(--ring);cursor:move;flex:none}
.win .wt{font-weight:600;font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .wt small{font-weight:400;color:var(--muted);margin-left:7px}
.win .wb{border:none;background:none;color:var(--ink2);width:22px;height:22px;border-radius:6px;
  cursor:pointer;font-size:13px;line-height:1;flex:none}
.win .wb:hover{background:var(--accent-soft);color:var(--ink)}
.win .wbody{flex:1;overflow:auto;position:relative}
.win .wtools{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--ring);
  flex-wrap:wrap;background:var(--surface);position:sticky;top:0;z-index:6}
.grip{position:absolute;z-index:5}
.grip.e{top:0;right:-3px;width:8px;height:100%;cursor:ew-resize}
.grip.s{bottom:-3px;left:0;height:8px;width:100%;cursor:ns-resize}
.grip.se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:nwse-resize}
#snapghost{position:absolute;border:2px solid var(--accent);background:var(--accent-soft);
  border-radius:12px;display:none;pointer-events:none;z-index:700}

/* ============ grid ============ */
.gwrap{overflow:auto;height:100%}
table.g{border-collapse:separate;border-spacing:0;font-size:12px;table-layout:fixed}
table.g th,table.g td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
  padding:4px 7px;text-align:left;vertical-align:top;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;position:relative;background:var(--surface)}
table.g thead th{position:sticky;top:0;background:var(--surface2);font-weight:600;font-size:11px;
  color:var(--ink2);z-index:4;user-select:none;cursor:pointer}
table.g thead th.drag{opacity:.4}
table.g th .cr{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:5}
table.g tbody th{position:sticky;left:0;z-index:3;background:var(--surface2);text-align:right;
  color:var(--muted);font-weight:500;font-size:11px;width:44px;cursor:pointer}
table.g tbody th .rr{position:absolute;left:0;bottom:-3px;height:7px;width:100%;cursor:row-resize}
table.g thead th.corner{left:0;z-index:6;width:44px}
td.sel{background:var(--sel)}
td.cur{outline:2px solid var(--selb);outline-offset:-2px;z-index:2}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.ctr{text-align:center}
tr.dim td{color:var(--muted)}
.cellin{position:absolute;inset:0;border:2px solid var(--selb);background:var(--field);
  color:var(--ink);padding:3px 5px;font:inherit;z-index:20;user-select:text}
select.cellin{padding:1px 3px}

.pill{display:inline-block;padding:0 8px;border-radius:20px;font-size:11px;font-weight:600;line-height:17px}
.s-A,.s-B,.s-I{background:rgba(12,163,12,.15);color:var(--goodtext)}
.s-B{background:rgba(12,163,12,.10)}
.s-C{background:rgba(236,131,90,.20);color:#b8501f}
.s-D{background:rgba(208,59,59,.18);color:#a52020}
.s-W{background:rgba(250,178,25,.22);color:#8a6100}
.s-N{background:var(--surface2);color:var(--muted)}
:root[data-theme="dark"] .s-C{color:#f0a077}:root[data-theme="dark"] .s-D{color:#f08080}
:root[data-theme="dark"] .s-W{color:#f5c451}

.btn{border:1px solid var(--ring);background:var(--surface2);color:var(--ink);border-radius:9px;
  padding:5px 11px;cursor:pointer;font-size:12px}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:var(--surface2);border-color:var(--ring)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{background:var(--critical);color:#fff;border-color:var(--critical)}
input.f,select.f{border:1px solid var(--ring);background:var(--field);color:var(--ink);
  border-radius:8px;padding:5px 8px;user-select:text}
.hint{font-size:11.5px;color:var(--muted)}

/* ============ dashboard ============ */
.dash{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface2);border:1px solid var(--ring);border-radius:12px;padding:11px 13px}
.kpi .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:27px;font-weight:660;letter-spacing:-.02em;margin-top:3px;line-height:1}
.kpi .p{font-size:11px;color:var(--ink2);margin-top:3px}
.kpi .bar{height:4px;border-radius:3px;background:var(--surface);margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:3px}
.panel{background:var(--surface2);border:1px solid var(--ring);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.panel h3{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.panel table{border-collapse:collapse;width:100%;font-size:12px}
.panel th,.panel td{border-bottom:1px solid var(--grid);padding:4px 7px;text-align:left}
.panel th{font-weight:600;font-size:11px;color:var(--ink2)}
svg text{fill:var(--ink2);font-size:10px;font-family:inherit}
svg .gl{stroke:var(--grid);stroke-width:1}


/* ---- charts ---- */
.chart .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:8px;
  font-size:11.5px;color:var(--ink2)}
.chart .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;
  vertical-align:-1px}
.chart .legend i.dash{background:none;border-top:2px dashed var(--muted);height:0;border-radius:0;
  vertical-align:4px;width:15px}
.chart .lrow{display:flex;gap:8px;align-items:center;padding:3px 5px;border-radius:7px;transition:.12s}
.chart .lrow:hover{background:var(--accent-soft)}
.chart .lrow i{width:11px;height:11px;border-radius:3px;flex:none}
.chart .lrow span:first-of-type{flex:1}
.chart .lrow b{font-variant-numeric:tabular-nums}
.chart path.draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.chart path.draw{animation:none;stroke-dashoffset:0}}
.chart .drow{display:flex;align-items:center;gap:9px;margin-bottom:5px;font-size:11.5px}
.chart .dlab{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.chart .dbar{height:17px;border-radius:5px;overflow:hidden;display:flex;min-width:3px;
  box-shadow:inset 0 0 0 1px var(--ring)}
.chart .dbar i{display:block;height:100%;transition:opacity .12s}
.chart .dn{width:34px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.chart .dp{width:42px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.chart .bars{display:flex;gap:8px;align-items:flex-end;height:170px;overflow-x:auto;padding-top:4px}
.chart .bcol{flex:1;min-width:34px;display:flex;flex-direction:column;height:100%;
  border-radius:8px;padding:2px;transition:background .12s}
.chart .bcol:hover{background:var(--accent-soft)}
.chart .bval{font-size:11px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink2);height:14px}
.chart .btr{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.chart .btr i{width:60%;border-radius:4px 4px 0 0;min-height:2px;transition:height .5s cubic-bezier(.2,.8,.3,1)}
.chart .btr.pair i{width:44%}
.chart .blab{font-size:10px;text-align:center;color:var(--muted);padding-top:5px;white-space:nowrap}
@media(max-width:820px){.chart .dlab{width:98px}}

/* ============ overlays ============ */
#msgwrap{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;z-index:1500;
  align-items:center;justify-content:center;padding:20px}
#msgwrap.on{display:flex}
.msg{background:var(--surface);border:1px solid var(--ring);border-radius:14px;box-shadow:var(--shadow-focus);
  max-width:460px;width:100%;padding:18px 20px}
.msg h4{font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.msg .body{font-size:12.5px;color:var(--ink2);line-height:1.55;max-height:50vh;overflow:auto}
.msg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;bottom:38px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--page1);padding:8px 15px;border-radius:10px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.22s;z-index:2000}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#login{position:fixed;inset:0;background:radial-gradient(900px 600px at 30% 10%,var(--page1),var(--page2));
  display:none;align-items:center;justify-content:center;z-index:1400;padding:20px}
#login.on{display:flex}
#login .card{background:var(--surface);border:1px solid var(--ring);border-radius:16px;
  box-shadow:var(--shadow-focus);padding:26px 24px;width:100%;max-width:340px}
#login h1{font-size:17px;margin-bottom:3px}
#login p{font-size:12px;color:var(--muted);margin-bottom:18px}
#login input{width:100%;margin-bottom:9px}

/* ============ mobile ============ */
#mob{display:none;position:fixed;inset:0;flex-direction:column;z-index:1000;background:var(--page2)}
body.mobile #mob{display:flex}
body.mobile #topbar,body.mobile #desktop,body.mobile #dock{display:none}
body.mobile{overflow:hidden}
#mhead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:var(--glass);border-bottom:1px solid var(--ring);flex:none}
#mhead .t{flex:1;min-width:0}
#mtitle{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mhead button{border:none;background:var(--surface2);color:var(--ink);width:34px;height:34px;
  border-radius:11px;font-size:15px;cursor:pointer;flex:none;position:relative}
#mbody{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
#mtabs{display:flex;background:var(--glass);border-top:1px solid var(--ring);flex:none;
  padding-bottom:env(safe-area-inset-bottom)}
#mtabs button{flex:1;border:none;background:none;color:var(--muted);padding:8px 2px 9px;
  font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
#mtabs button b{font-size:17px;font-weight:400;line-height:1}
#mtabs button.on{color:var(--accent)}
.mcard{background:var(--surface);border:1px solid var(--ring);border-radius:13px;padding:12px 14px;
  margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.mcard .r1{display:flex;gap:8px;align-items:baseline}
.mcard .no{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .ti{font-size:13.5px;font-weight:600;margin-top:3px;line-height:1.35}
.mcard .m{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--grid);
  font-size:13px;align-items:center}
.mrow:last-child{border-bottom:none}
.mrow .l{color:var(--muted);font-size:12px;flex:none}
.mrow .v{text-align:right;word-break:break-word}
.mrow.tap{cursor:pointer}
.mrow.tap:active{background:var(--accent-soft)}
.applied{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.applied span{background:var(--accent);color:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600}
.applied button{margin-left:auto;border:1px solid var(--ring);background:var(--surface);color:var(--ink2);
  border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer}
.mfilt{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px}
.mfilt button{border:1px solid var(--ring);background:var(--surface);color:var(--ink2);
  border-radius:20px;padding:5px 13px;font-size:12px;white-space:nowrap;cursor:pointer;flex:none}
.mfilt button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#msearch{width:100%;margin-bottom:10px;padding:9px 12px;border-radius:11px;font-size:14px}
.mkpi{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.mkpi .kpi{background:var(--surface)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.offbar{background:rgba(250,178,25,.14);border:1px solid rgba(250,178,25,.5);border-radius:11px;
  padding:9px 12px;margin-bottom:12px;font-size:12px}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">▦</div>
  <div class="title">As-Built Tracker<small id="projsub">IWTP2</small></div>
  <button class="tbbtn" id="b-reg">▦ Register</button>
  <button class="tbbtn" id="b-dash">◔ Dashboard</button>
  <button class="tbbtn" id="b-undo" title="Undo (Ctrl+Z)">↶</button>
  <button class="tbbtn" id="b-redo" title="Redo (Ctrl+Y)">↷</button>
  <div class="spacer"></div>
  <button class="tbbtn bell" id="b-bell" title="Notifications">🔔<i id="belln" style="display:none"></i></button>
  <div class="menuwrap" id="menu">
    <button class="tbbtn" id="b-menu">☰</button>
    <div class="menucard">
      <button data-a="cols">▤ Choose columns…</button>
      <button data-a="xlsx">⤓ Export to Excel</button>
      <button data-a="csv">⤓ Export to CSV</button>
      <button data-a="import">⤒ Import from Excel…</button>
      <hr>
      <button data-a="activity">📜 Activity log</button>
      <button data-a="users">👤 People and access</button>
      <hr>
      <button data-a="arrange">⊞ Tidy the windows</button>
      <button data-a="theme">◐ Light / dark</button>
      <button data-a="mobile">▯ Switch to the phone layout</button>
      <hr>
      <button data-a="logout">⇥ Sign out</button>
    </div>
  </div>
</div>

<div id="desktop"><div id="snapghost"></div></div>
<div id="dock"><span class="st" id="dockst"></span></div>

<!-- mobile -->
<div id="mob">
  <div id="mhead">
    <button id="mback" style="visibility:hidden">‹</button>
    <div class="t"><div id="mtitle">As-Builts</div><div id="msub">IWTP2</div></div>
    <button id="mbell">🔔<i id="mbelln" style="position:absolute;top:2px;right:3px;background:var(--critical);color:#fff;border-radius:9px;font-size:9px;font-style:normal;padding:0 4px;line-height:13px;display:none"></i></button>
  </div>
  <div id="mbody"></div>
  <div id="mtabs"></div>
</div>

<!-- login -->
<div id="login"><div class="card">
  <h1>As-Built Tracker</h1><p>IWTP2 — sign in to continue</p>
  <input class="f" id="lu" placeholder="Username" autocomplete="username">
  <input class="f" id="lp" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn primary" id="lgo" style="width:100%;padding:9px;margin-top:6px">Sign in</button>
  <p style="margin:12px 0 0" id="lerr"></p>
</div></div>

<div id="msgwrap"><div class="msg" id="msg"></div></div>
<div id="toast"></div>

<script>
/* ==================================================================
   IWTP2 As-Built Tracker
   Grid engine, window shell, undo stack and mobile shell ported from
   the MAADEN Taif-Ar Rjum tracker and adapted to a single register.
   ================================================================== */
const SB_URL='https://flwlxjibrokmohtehtjc.supabase.co';
const SB_KEY='sb_publishable_RG6mCq0bcyiMsEsZns8fvw_d0bBUMJv';

function msgBox(title,icon,body,acts){
  const w=document.getElementById('msgwrap'),m=document.getElementById('msg');
  m.innerHTML=`<h4>${icon?icon+' ':''}${esc(title)}</h4><div class="body">${body}</div>
    <div class="acts">${(acts||[['Close',null,'']]).map((a,i)=>
      `<button class="btn ${a[2]||''}" data-i="${i}">${esc(a[0])}</button>`).join('')}</div>`;
  w.classList.add('on');
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const fn=(acts||[['Close',null,'']])[+b.dataset.i][1];
    w.classList.remove('on'); if(fn)fn();});
  return m;
}
const closeMsg=()=>document.getElementById('msgwrap').classList.remove('on');
document.getElementById('msgwrap').addEventListener('click',e=>{if(e.target.id==='msgwrap')closeMsg();});

/* ---------------- api ---------------- */
async function api(path,opts){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:H,...opts});
  if(!r.ok)throw new Error(r.status+' '+await r.text());
  return r.status===204?null:r.json();
}
async function apiUpdate(id,patch){ if(LIVE) await api('asbuilts?id=eq.'+id,{method:'PATCH',body:JSON.stringify(patch)}); }
async function apiInsert(row){ const r=await api('asbuilts',{method:'POST',
  headers:{...H,Prefer:'return=representation'},body:JSON.stringify(row)}); return r[0]; }
async function apiDelete(id){ if(LIVE) await api('asbuilts?id=eq.'+id,{method:'DELETE'}); }
async function logAct(action,rec,field,oldV,newV){
  if(!LIVE)return;
  const a={projectId:PROJ,ts:nowTs(),action,tbl:'asbuilts',recId:rec&&rec.id,
    recName:(rec&&rec.docNo)||'',field:field||'',oldVal:String(oldV??''),newVal:String(newV??''),
    actor:(USER&&USER.name)||''};
  ACTS.unshift(a);
  try{await api('activity',{method:'POST',body:JSON.stringify(a)});}catch(e){}
}

/* ---------------- undo / redo ---------------- */
let UNDO=[],REDO=[],_tx=null,_replaying=false;
function txBegin(label){if(_tx||_replaying)return false;_tx={label,ops:[]};return true;}
function txPush(op){ if(_replaying)return;
  if(_tx)_tx.ops.push(op); else {UNDO.push({label:'edit',ops:[op]});REDO.length=0;trimUndo();} }
function txEnd(){ if(_tx&&_tx.ops.length){UNDO.push(_tx);REDO.length=0;trimUndo();} _tx=null; updateUndoBtns(); }
function txAbort(){_tx=null;}
function trimUndo(){ while(UNDO.length>60)UNDO.shift(); updateUndoBtns(); }
async function applyOp(op,dir){
  const v=dir<0?op.from:op.to;
  if(op.t==='set'){
    const r=AB.find(x=>x.id===op.id); if(!r)return;
    r[op.k]=v; await apiUpdate(op.id,{[op.k]:v});
  }else if(op.t==='add'){
    if(dir<0){ AB=AB.filter(x=>x.id!==op.id); await apiDelete(op.id); }
    else { const row=await apiInsert(op.row); AB.push(row); op.id=row.id; }
  }else if(op.t==='del'){
    if(dir<0){ const row=await apiInsert(op.row); AB.push(row); op.id=row.id; }
    else { AB=AB.filter(x=>x.id!==op.id); await apiDelete(op.id); }
  }
}
async function undo(){
  if(!UNDO.length)return toast('Nothing to undo');
  const t=UNDO.pop(); _replaying=true;
  for(let i=t.ops.length-1;i>=0;i--) await applyOp(t.ops[i],-1);
  _replaying=false; REDO.push(t); updateUndoBtns(); refresh(); toast('Undid '+t.label);
}
async function redo(){
  if(!REDO.length)return toast('Nothing to redo');
  const t=REDO.pop(); _replaying=true;
  for(const op of t.ops) await applyOp(op,1);
  _replaying=false; UNDO.push(t); updateUndoBtns(); refresh(); toast('Redid '+t.label);
}
function updateUndoBtns(){
  const u=document.getElementById('b-undo'),r=document.getElementById('b-redo');
  if(u)u.disabled=!UNDO.length||!canEdit(); if(r)r.disabled=!REDO.length||!canEdit();
}
async function setCell(row,k,val,silent){
  const before=row[k]??'';
  if(String(before)===String(val))return;
  row[k]=val;
  txPush({t:'set',id:row.id,k,from:before,to:val});
  try{ await apiUpdate(row.id,{[k]:val}); await logAct('edit',row,k,before,val); }
  catch(e){ row[k]=before; toast('Not saved — check your connection'); console.error(e); return; }
  if(!silent)refresh();
}

/* ---------------- column prefs ---------------- */
function visCols(){ return PREFS.order.map(k=>COLBY[k]).filter(c=>c&&!PREFS.hidden.includes(c.k)); }
function colW(c){ return PREFS.w[c.k]||c.w; }
async function savePrefs(){
  try{ localStorage.setItem('ab-prefs',JSON.stringify(PREFS)); }catch(e){}
  if(LIVE){ try{ await api('projects?id=eq.'+PROJ,{method:'PATCH',
    body:JSON.stringify({colprefs:JSON.stringify(PREFS)})}); }catch(e){} }
}
function loadPrefs(fromDb){
  let p=null;
  try{ p=JSON.parse(fromDb||localStorage.getItem('ab-prefs')||'null'); }catch(e){}
  if(p&&p.order){
    PREFS.order=COLS.map(c=>c.k).sort((a,b)=>{
      const ia=p.order.indexOf(a),ib=p.order.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);});
    PREFS.hidden=(p.hidden||[]).filter(k=>COLBY[k]);
    PREFS.w=p.w||{}; PREFS.rowh=p.rowh||24;
  }
}

/* ================= window manager ================= */
const WINS=new Map(); let winSeq=0, focused=null;
const desk=()=>document.getElementById('desktop');

function createWindow(kind,title,sub,x,y,w,h){
  const ex=[...WINS.values()].find(v=>v.kind===kind);
  if(ex){focusWin(ex.id);return ex;}
  const id='w'+(++winSeq);
  const D=desk();
  const win={id,kind,title,sub,x:x??(24+WINS.size*26),y:y??(18+WINS.size*22),
    w:w??Math.min(1180,D.clientWidth-60),h:h??Math.min(660,D.clientHeight-50),min:false,max:false};
  const el=document.createElement('div');
  el.className='win';el.id=id;
  el.innerHTML=`<div class="wbar"><div class="wt">${esc(title)}<small>${esc(sub||'')}</small></div>
      <button class="wb" data-w="min" title="Minimise">–</button>
      <button class="wb" data-w="max" title="Maximise">▢</button>
      <button class="wb" data-w="close" title="Close">✕</button></div>
    <div class="wbody"></div>
    <div class="grip e"></div><div class="grip s"></div><div class="grip se"></div>`;
  D.appendChild(el);
  win.el=el; win.body=el.querySelector('.wbody');
  WINS.set(id,win); applyRect(win); focusWin(id);
  el.addEventListener('pointerdown',()=>focusWin(id),true);
  el.querySelector('.wbar').addEventListener('pointerdown',e=>{
    if(e.target.closest('.wb'))return; startDrag(e,win);});
  el.querySelectorAll('.wb').forEach(b=>b.onclick=()=>{
    const a=b.dataset.w;
    if(a==='close')closeWin(id);
    else if(a==='min'){win.min=true;applyRect(win);renderDock();}
    else{win.max=!win.max;applyRect(win);} });
  el.querySelector('.grip.e').addEventListener('pointerdown',e=>startResize(e,win,1,0));
  el.querySelector('.grip.s').addEventListener('pointerdown',e=>startResize(e,win,0,1));
  el.querySelector('.grip.se').addEventListener('pointerdown',e=>startResize(e,win,1,1));
  renderDock();
  return win;
}
function applyRect(w){
  const D=desk(), el=w.el;
  if(w.min){el.style.display='none';return;}
  el.style.display='flex';
  if(w.max){Object.assign(el.style,{left:'6px',top:'6px',width:(D.clientWidth-12)+'px',height:(D.clientHeight-12)+'px'});return;}
  w.x=Math.max(-w.w+120,Math.min(w.x,D.clientWidth-80));
  w.y=Math.max(0,Math.min(w.y,D.clientHeight-40));
  Object.assign(el.style,{left:w.x+'px',top:w.y+'px',width:w.w+'px',height:w.h+'px'});
}
function focusWin(id){
  focused=id;
  [...WINS.values()].forEach(w=>{w.el.classList.toggle('focus',w.id===id);});
  const w=WINS.get(id); if(w){w.el.style.zIndex=++winSeq+100; if(w.min){w.min=false;applyRect(w);renderDock();}}
}
function closeWin(id){const w=WINS.get(id);if(!w)return;w.el.remove();WINS.delete(id);renderDock();}
function arrangeWins(){
  const list=[...WINS.values()].filter(w=>!w.min); if(!list.length)return;
  const D=desk(), cols=Math.ceil(Math.sqrt(list.length)), rows=Math.ceil(list.length/cols);
  list.forEach((w,i)=>{ w.max=false;
    w.w=Math.floor(D.clientWidth/cols)-10; w.h=Math.floor(D.clientHeight/rows)-10;
    w.x=(i%cols)*(w.w+8)+6; w.y=Math.floor(i/cols)*(w.h+8)+6; applyRect(w);});
  toast('Windows tidied');
}
function renderDock(){
  const d=document.getElementById('dock');
  const btns=[...WINS.values()].map(w=>
    `<button data-d="${w.id}">${w.min?'▫ ':''}${esc(w.title)}</button>`).join('');
  d.innerHTML=btns+`<span class="st" id="dockst">${dockStatus()}</span>`;
  d.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>focusWin(b.dataset.d));
}
function dockStatus(){
  const s=stats();
  return (LIVE?'● live':'● snapshot, read-only')+' · '+s.t+' drawings · '+
    s.sub+' submitted · '+s.ur+' under review'+(USER?' · '+esc(USER.name):'')+' · build '+BUILD;
}
let _drag=null;
function startDrag(e,w){
  if(w.max)return;
  _drag={w,dx:e.clientX-w.x,dy:e.clientY-w.y,mode:'move'};
  e.target.setPointerCapture(e.pointerId);
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd,{once:true});
}
function startResize(e,w,ex,ey){
  if(w.max)return;
  _drag={w,sx:e.clientX,sy:e.clientY,w0:w.w,h0:w.h,ex,ey,mode:'size'};
  e.target.setPointerCapture(e.pointerId);
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd,{once:true});
  e.preventDefault();
}
function dragMove(e){
  if(!_drag)return; const w=_drag.w, D=desk(), g=document.getElementById('snapghost');
  if(_drag.mode==='move'){
    w.x=e.clientX-_drag.dx; w.y=e.clientY-_drag.dy; applyRect(w);
    const r=D.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
    let z=null;
    if(px<28)z={left:0,top:0,width:D.clientWidth/2,height:D.clientHeight};
    else if(px>D.clientWidth-28)z={left:D.clientWidth/2,top:0,width:D.clientWidth/2,height:D.clientHeight};
    else if(py<10)z={left:0,top:0,width:D.clientWidth,height:D.clientHeight};
    _drag.zone=z;
    if(z){Object.assign(g.style,{display:'block',left:z.left+'px',top:z.top+'px',
      width:z.width+'px',height:z.height+'px'});}
    else g.style.display='none';
  }else{
    if(_drag.ex)w.w=Math.max(340,_drag.w0+(e.clientX-_drag.sx));
    if(_drag.ey)w.h=Math.max(190,_drag.h0+(e.clientY-_drag.sy));
    applyRect(w);
  }
}
function dragEnd(){
  document.removeEventListener('pointermove',dragMove);
  document.getElementById('snapghost').style.display='none';
  if(_drag&&_drag.zone){const w=_drag.w,z=_drag.zone;
    w.x=z.left;w.y=z.top;w.w=z.width;w.h=z.height;w.max=false;applyRect(w);}
  _drag=null;
}
window.addEventListener('resize',()=>{ [...WINS.values()].forEach(applyRect); checkMode(); });

/* ================= grid engine ================= */
let GRID=null;   /* {win, rows, sel:{r1,c1,r2,c2}, cur:{r,c}, sort:{k,dir}, filters} */

function openRegister(){
  const w=createWindow('reg','Register','as-built drawings');
  GRID={win:w, sort:{k:'sn',dir:1}, q:'', fd:'', fs:'', fx:'',
        sel:null, cur:{r:0,c:0}, editing:null};
  renderGrid();
  return w;
}
function gridRows(){
  const q=GRID.q.toLowerCase();
  let rows=AB.filter(r=>{
    if(q&&!((r.docNo||'')+' '+(r.title||'')).toLowerCase().includes(q))return false;
    if(GRID.fd&&r.discipline!==GRID.fd)return false;
    if(GRID.fs&&(r.status||'Not Submitted')!==GRID.fs)return false;
    if(GRID.fx==='open'&&!isOpen(r))return false;
    if(GRID.fx==='ur'&&r.status!=='W')return false;
    if(GRID.fx==='late'&&!(!APPROVED.includes(r.status)&&r.targetDate&&r.targetDate<today))return false;
    if(GRID.fx==='ns'&&r.status!=='Not Submitted')return false;
    return true;
  });
  const {k,dir}=GRID.sort, c=COLBY[k];
  rows.sort((a,b)=>{
    const va=c&&c.calc?c.calc(a):(a[k]??''), vb=c&&c.calc?c.calc(b):(b[k]??'');
    const ea=String(va).trim()==='', eb=String(vb).trim()==='';
    if(ea!==eb)return ea?1:-1;          /* blanks always sit at the bottom */
    if(ea&&eb)return 0;
    const na=parseFloat(va),nb=parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb))return (na-nb)*dir;
    return String(va).localeCompare(String(vb))*dir;
  });
  return rows;
}
function cellText(r,c){
  const v=c.calc?c.calc(r):(r[c.k]??'');
  if(c.pill){const k=v||'Not Submitted';
    return `<span class="pill ${k==='Not Submitted'?'s-N':'s-'+k}">${esc(k==='Not Submitted'?'Not sub.':k)}</span>`;}
  return esc(v);
}
function renderGrid(){
  const w=GRID.win; if(!w)return;
  const rows=gridRows(); GRID.rows=rows;
  const cs=visCols();
  const tools=`<div class="wtools">
    <input class="f" id="gq" placeholder="Search number or name" style="min-width:210px;flex:1" value="${esc(GRID.q)}">
    <select class="f" id="gfd"><option value="">All disciplines</option>${
      DISCS.map(d=>`<option${GRID.fd===d?' selected':''}>${esc(d)}</option>`).join('')}</select>
    <select class="f" id="gfs"><option value="">All statuses</option>${
      CODES.map(k=>`<option${GRID.fs===k?' selected':''}>${esc(k)}</option>`).join('')}</select>
    <select class="f" id="gfx">
      <option value="">Everything</option>
      <option value="open"${GRID.fx==='open'?' selected':''}>Open only</option>
      <option value="ur"${GRID.fx==='ur'?' selected':''}>Under review</option>
      <option value="late"${GRID.fx==='late'?' selected':''}>Past target</option>
      <option value="ns"${GRID.fx==='ns'?' selected':''}>Not submitted</option>
    </select>
    <button class="btn" id="gadd"${canEdit()?'':' disabled'}>Add drawing</button>
    <button class="btn" id="gdel"${canEdit()?'':' disabled'}>Delete selected</button>
    <button class="btn" id="gcols">Columns</button>
    <span class="hint" id="gcount"></span></div>`;
  const head=`<thead><tr><th class="corner"></th>${cs.map((c,i)=>
      `<th data-c="${i}" data-k="${c.k}" draggable="${canEdit()}" style="width:${colW(c)}px;min-width:${colW(c)}px">${
        esc(c.t)}${GRID.sort.k===c.k?(GRID.sort.dir>0?' ▲':' ▼'):''}<span class="cr" data-rz="${c.k}"></span></th>`).join('')}</tr></thead>`;
  const body=`<tbody>${rows.map((r,ri)=>
    `<tr data-r="${ri}" data-id="${r.id}" class="${r.docNo?'':'dim'}" style="height:${PREFS.rowh}px">
      <th data-rh="${ri}">${ri+1}<span class="rr"></span></th>${
      cs.map((c,ci)=>`<td data-r="${ri}" data-c="${ci}" class="${c.cls||''}">${cellText(r,c)}</td>`).join('')}
    </tr>`).join('')}</tbody>`;
  w.body.innerHTML=tools+`<div class="gwrap" id="gwrap"><table class="g">${head}${body}</table></div>`;
  document.getElementById('gcount').textContent=rows.length+' of '+AB.length;
  wireGrid();
  paintSel();
}
function wireGrid(){
  const $=id=>document.getElementById(id);
  $('gq').oninput=e=>{GRID.q=e.target.value;const s=e.target.selectionStart;renderGrid();
    const n=document.getElementById('gq');n.focus();n.setSelectionRange(s,s);};
  $('gfd').onchange=e=>{GRID.fd=e.target.value;renderGrid();};
  $('gfs').onchange=e=>{GRID.fs=e.target.value;renderGrid();};
  $('gfx').onchange=e=>{GRID.fx=e.target.value;renderGrid();};
  $('gadd').onclick=addRow;
  $('gdel').onclick=deleteSelected;
  $('gcols').onclick=openCols;

  const wrap=$('gwrap'), tbl=wrap.querySelector('table');
  /* sort + column drag + resize */
  tbl.querySelectorAll('thead th[data-k]').forEach(th=>{
    th.onclick=e=>{ if(e.target.classList.contains('cr'))return;
      const k=th.dataset.k;
      GRID.sort=(GRID.sort.k===k)?{k,dir:-GRID.sort.dir}:{k,dir:1}; renderGrid();};
    th.ondragstart=e=>{e.dataTransfer.setData('text/plain',th.dataset.k);th.classList.add('drag');};
    th.ondragend=()=>th.classList.remove('drag');
    th.ondragover=e=>e.preventDefault();
    th.ondrop=e=>{e.preventDefault();
      const from=e.dataTransfer.getData('text/plain'), to=th.dataset.k;
      if(!from||from===to)return;
      const o=PREFS.order.filter(k=>k!==from), i=o.indexOf(to);
      o.splice(i<0?o.length:i,0,from); PREFS.order=o; savePrefs(); renderGrid();};
    const cr=th.querySelector('.cr');
    cr.addEventListener('pointerdown',e=>{
      e.stopPropagation();e.preventDefault();
      const k=cr.dataset.rz, x0=e.clientX, w0=colW(COLBY[k]);
      const mv=ev=>{PREFS.w[k]=Math.max(46,w0+(ev.clientX-x0));
        th.style.width=th.style.minWidth=PREFS.w[k]+'px';};
      const up=()=>{document.removeEventListener('pointermove',mv);savePrefs();renderGrid();};
      document.addEventListener('pointermove',mv);
      document.addEventListener('pointerup',up,{once:true});});
  });
  /* row height */
  tbl.querySelectorAll('tbody th .rr').forEach(rr=>{
    rr.addEventListener('pointerdown',e=>{
      e.stopPropagation();e.preventDefault();
      const y0=e.clientY,h0=PREFS.rowh;
      const mv=ev=>{PREFS.rowh=Math.max(20,Math.min(80,h0+(ev.clientY-y0)));
        tbl.querySelectorAll('tbody tr').forEach(tr=>tr.style.height=PREFS.rowh+'px');};
      const up=()=>{document.removeEventListener('pointermove',mv);savePrefs();};
      document.addEventListener('pointermove',mv);
      document.addEventListener('pointerup',up,{once:true});});
  });
  /* row header selects the whole row */
  tbl.querySelectorAll('tbody th[data-rh]').forEach(th=>{
    th.onclick=()=>{const r=+th.dataset.rh;
      GRID.sel={r1:r,c1:0,r2:r,c2:visCols().length-1};GRID.cur={r,c:0};paintSel();};});

  /* cell selection */
  let dragging=false;
  tbl.addEventListener('pointerdown',e=>{
    const td=e.target.closest('td[data-c]'); if(!td)return;
    const r=+td.dataset.r,c=+td.dataset.c;
    if(e.shiftKey&&GRID.sel){GRID.sel={...GRID.sel,r2:r,c2:c};}
    else {GRID.sel={r1:r,c1:c,r2:r,c2:c};GRID.cur={r,c};}
    dragging=true;paintSel();
    wrap.focus();
  });
  tbl.addEventListener('pointerover',e=>{
    if(!dragging)return; const td=e.target.closest('td[data-c]'); if(!td)return;
    GRID.sel={...GRID.sel,r2:+td.dataset.r,c2:+td.dataset.c};paintSel();});
  document.addEventListener('pointerup',()=>{dragging=false;},{once:false});
  tbl.addEventListener('dblclick',e=>{
    const td=e.target.closest('td[data-c]'); if(td)beginEdit(+td.dataset.r,+td.dataset.c);});
  wrap.tabIndex=0;
  wrap.addEventListener('keydown',gridKey);
}
function paintSel(){
  const tbl=document.querySelector('#gwrap table'); if(!tbl||!GRID.sel)return;
  const {r1,c1,r2,c2}=GRID.sel;
  const [ra,rb]=[Math.min(r1,r2),Math.max(r1,r2)],[ca,cb]=[Math.min(c1,c2),Math.max(c1,c2)];
  tbl.querySelectorAll('td[data-c]').forEach(td=>{
    const r=+td.dataset.r,c=+td.dataset.c;
    td.classList.toggle('sel',r>=ra&&r<=rb&&c>=ca&&c<=cb);
    td.classList.toggle('cur',r===GRID.cur.r&&c===GRID.cur.c);});
}
function selCells(){
  if(!GRID.sel)return[];
  const {r1,c1,r2,c2}=GRID.sel, cs=visCols(), out=[];
  for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)
    for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)
      if(GRID.rows[r]&&cs[c])out.push({row:GRID.rows[r],col:cs[c],r,c});
  return out;
}
function beginEdit(r,c){
  const cs=visCols(), col=cs[c], row=GRID.rows[r];
  if(!col||!row)return;
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  if(col.ro)return toast(col.t+' is worked out automatically');
  const td=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`); if(!td)return;
  GRID.editing={r,c};
  const cur=row[col.k]??'';
  let el;
  if(col.opts){ el=document.createElement('select');
    el.innerHTML=col.opts().map(o=>`<option${String(cur)===String(o)?' selected':''}>${esc(o)}</option>`).join('');
  }else{ el=document.createElement('input'); el.type=col.date?'date':'text'; el.value=cur; }
  el.className='cellin'; td.appendChild(el); el.focus(); if(el.select)el.select();
  const done=async(commit)=>{
    if(GRID.editing===null)return; GRID.editing=null;
    const v=el.value;
    el.remove();
    if(commit)await setCell(row,col.k,v);
    else renderGrid();
    const wrap=document.getElementById('gwrap'); if(wrap)wrap.focus();
  };
  el.addEventListener('blur',()=>done(true));
  el.addEventListener('keydown',ev=>{
    ev.stopPropagation();
    if(ev.key==='Enter'){ev.preventDefault();done(true);}
    if(ev.key==='Escape'){ev.preventDefault();done(false);}
    if(ev.key==='Tab'){ev.preventDefault();done(true).then(()=>{
      GRID.cur={r,c:Math.min(c+1,cs.length-1)};GRID.sel={r1:r,c1:GRID.cur.c,r2:r,c2:GRID.cur.c};paintSel();});}
  });
}
async function gridKey(e){
  if(GRID.editing)return;
  const cs=visCols(), maxR=GRID.rows.length-1, maxC=cs.length-1;
  const mv=(dr,dc,ext)=>{
    const r=Math.max(0,Math.min(maxR,GRID.cur.r+dr)), c=Math.max(0,Math.min(maxC,GRID.cur.c+dc));
    GRID.cur={r,c};
    GRID.sel=ext&&GRID.sel?{...GRID.sel,r2:r,c2:c}:{r1:r,c1:c,r2:r,c2:c};
    paintSel();
    const td=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
    if(td)td.scrollIntoView({block:'nearest',inline:'nearest'});
  };
  const k=e.key;
  if(k==='ArrowDown'){e.preventDefault();mv(1,0,e.shiftKey);}
  else if(k==='ArrowUp'){e.preventDefault();mv(-1,0,e.shiftKey);}
  else if(k==='ArrowLeft'){e.preventDefault();mv(0,-1,e.shiftKey);}
  else if(k==='ArrowRight'||k==='Tab'){e.preventDefault();mv(0,1,e.shiftKey&&k!=='Tab');}
  else if(k==='Enter'){e.preventDefault();beginEdit(GRID.cur.r,GRID.cur.c);}
  else if(k==='Delete'||k==='Backspace'){e.preventDefault();await clearSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='c'){e.preventDefault();copySel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='a'){e.preventDefault();
    GRID.sel={r1:0,c1:0,r2:maxR,c2:maxC};paintSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();undo();}
  else if((e.ctrlKey||e.metaKey)&&(k.toLowerCase()==='y'||(e.shiftKey&&k.toLowerCase()==='z'))){e.preventDefault();redo();}
  else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    beginEdit(GRID.cur.r,GRID.cur.c);
    const el=document.querySelector('.cellin');
    if(el&&el.tagName==='INPUT'){el.value=k;}
  }
}
function copySel(){
  const cells=selCells(); if(!cells.length)return;
  const {r1,r2,c1,c2}=GRID.sel;
  const [ra,rb]=[Math.min(r1,r2),Math.max(r1,r2)],[ca,cb]=[Math.min(c1,c2),Math.max(c1,c2)];
  const cs=visCols(), lines=[];
  for(let r=ra;r<=rb;r++){
    const row=GRID.rows[r]; if(!row)continue;
    const cells=[];
    for(let c=ca;c<=cb;c++){const col=cs[c]; cells.push(col.calc?col.calc(row):(row[col.k]??''));}
    lines.push(cells.join('\t'));
  }
  const txt=lines.join('\r\n');
  navigator.clipboard.writeText(txt).then(()=>toast(lines.length+' row(s) copied'))
    .catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
      ta.select();document.execCommand('copy');ta.remove();toast('Copied');});
}
function parseTSV(txt){
  return txt.replace(/\r\n?/g,'\n').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
}
async function pasteIntoSel(txt){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const data=parseTSV(txt); if(!data.length)return;
  const cs=visCols(), {r1,c1,r2,c2}=GRID.sel||{r1:0,c1:0,r2:0,c2:0};
  const ra=Math.min(r1,r2), ca=Math.min(c1,c2);
  txBegin('paste');
  let n=0,skipped=0;
  for(let i=0;i<data.length;i++){
    const row=GRID.rows[ra+i]; if(!row)break;
    for(let j=0;j<data[i].length;j++){
      const col=cs[ca+j]; if(!col)break;
      if(col.ro){skipped++;continue;}
      await setCell(row,col.k,data[i][j].trim(),true); n++;
    }
  }
  txEnd(); renderGrid();
  toast(n+' cell(s) pasted'+(skipped?', '+skipped+' calculated cell(s) skipped':''));
}
async function clearSel(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const cells=selCells().filter(x=>!x.col.ro); if(!cells.length)return;
  txBegin('clear '+cells.length+' cell(s)');
  for(const {row,col} of cells) await setCell(row,col.k,'',true);
  txEnd(); renderGrid(); toast(cells.length+' cell(s) cleared');
}
async function addRow(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const base={projectId:PROJ,sn:String(AB.length+1),docNo:'',title:'',
    discipline:'',currentRev:'',status:'Not Submitted'};
  const row=await apiInsert(base);
  AB.push(row); txPush({t:'add',id:row.id,row:base}); updateUndoBtns();
  await logAct('add',row); refresh(); toast('Drawing added — fill in the number and name');
}
async function deleteSelected(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const ids=[...new Set(selCells().map(x=>x.row.id))];
  if(!ids.length)return toast('Select the rows to delete first');
  msgBox('Delete '+ids.length+' drawing(s)?','🗑',
    'They will be removed from the register. You can undo this straight afterwards.',
    [['Cancel',null,''],['Delete',async()=>{
      txBegin('delete '+ids.length+' row(s)');
      for(const id of ids){
        const row=AB.find(r=>r.id===id); if(!row)continue;
        const copy={...row}; delete copy.id;
        txPush({t:'del',id,row:copy});
        AB=AB.filter(r=>r.id!==id); await apiDelete(id); await logAct('delete',row);
      }
      txEnd(); refresh(); toast(ids.length+' drawing(s) deleted');
    },'danger']]);
}
document.addEventListener('paste',e=>{

function curveChart(id){
  const sm={},rm={},tm={};
  AB.forEach(r=>{ if(r.actualSub)sm[r.actualSub.slice(0,7)]=(sm[r.actualSub.slice(0,7)]||0)+1;
                  if(r.actualRcv)rm[r.actualRcv.slice(0,7)]=(rm[r.actualRcv.slice(0,7)]||0)+1;
                  if(r.targetDate)tm[r.targetDate.slice(0,7)]=(tm[r.targetDate.slice(0,7)]||0)+1;});
  const ms=[...new Set([...Object.keys(sm),...Object.keys(rm),...Object.keys(tm)])].sort();
  if(!ms.length)return '<div class="empty">No dates recorded yet.</div>';
  let a=0,b=0,c=0; const act=[],rcv=[],pln=[],mo=[];
  ms.forEach(m=>{a+=sm[m]||0;b+=rm[m]||0;c+=tm[m]||0;act.push(a);rcv.push(b);pln.push(c);
    mo.push({m,sub:sm[m]||0,rcv:rm[m]||0,tgt:tm[m]||0});});
  const W=920,H=290,PL=46,PR=18,PT=16,PB=34;
  const max=Math.ceil(Math.max(AB.length,...pln,...act)/20)*20||20;
  const X=i=>PL+(W-PL-PR)*(ms.length<2?.5:i/(ms.length-1));
  const Y=v=>H-PB-(H-PT-PB)*(v/max);
  const line=arr=>arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=arr=>line(arr)+`L${X(arr.length-1).toFixed(1)} ${Y(0)}L${X(0).toFixed(1)} ${Y(0)}Z`;
  let g='';

        <text x="${PL-8}" y="${Y(v)+3.5}" text-anchor="end">${Math.round(v)}</text>`;}

  const dots=arr=>arr.map((v,i)=>`<circle class="pt" data-i="${i}" cx="${X(i)}" cy="${Y(v)}" r="3.2"/>`).join('');
  return `<div class="chart" data-chart="curve" style="position:relative">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">

        <stop offset="0%" stop-color="var(--accent)" stop-opacity=".26"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${g}
      <path d="${area(act)}" fill="url(#cg)"/>
      <path d="${line(pln)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 4"/>
      <path d="${line(rcv)}" fill="none" stroke="#0ca30c" stroke-width="2" opacity=".85"/>

      <line id="cx" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="var(--accent)" stroke-width="1"
        stroke-dasharray="3 3" opacity="0"/>

    </svg>

/* ---------- ageing histogram ---------- */
function ageingChart(){
  const ur=AB.filter(r=>r.status==='W'&&r.actualSub).map(r=>({...r,age:days(r.actualSub,today)}))
    .sort((a,b)=>b.age-a.age);
  if(!ur.length)return '<div class="empty">Nothing is with the reviewer.</div>';
  const B=[['0–14',0,14,'#0ca30c'],['15–30',15,30,'#fab219'],['31–60',31,60,'#ec835a'],['60+',61,1e9,'#d03b3b']];
  const counts=B.map(([l,lo,hi])=>ur.filter(r=>r.age>=lo&&r.age<=hi).length);
  const max=Math.max(...counts)||1;
  return `<div class="chart" data-chart="age">
    <div class="bars">${B.map(([l,lo,hi,col],i)=>`
      <div class="bcol" data-lo="${lo}" data-hi="${hi}" data-l="${l}" data-n="${counts[i]}">
        <div class="bval">${counts[i]||''}</div>
        <div class="btr"><i style="height:${counts[i]/max*100}%;background:${col}"></i></div>
        <div class="blab">${l}</div></div>`).join('')}</div>
    <div class="hint" style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap">
      <span>Days waiting since submission</span>
      <span style="margin-left:auto">Longest <b>${ur[0].age}d</b> — ${esc(ur[0].docNo)}</span></div></div>`;
}
function wireAge(root){
  const box=root.querySelector('[data-chart="age"]'); if(!box)return;
  const ur=AB.filter(r=>r.status==='W'&&r.actualSub).map(r=>({...r,age:days(r.actualSub,today)}));
  box.querySelectorAll('.bcol').forEach(b=>{
    b.style.cursor='pointer';
    b.addEventListener('pointerenter',e=>{
      const lo=+b.dataset.lo,hi=+b.dataset.hi;
      const list=ur.filter(r=>r.age>=lo&&r.age<=hi).sort((x,y)=>y.age-x.age).slice(0,5);
      showTip(`<b>${b.dataset.l} days</b> — ${b.dataset.n} drawing${b.dataset.n==='1'?'':'s'}${
        list.length?'<br>'+list.map(r=>`${esc(r.docNo||'—')} <span style="opacity:.7">${r.age}d</span>`).join('<br>'):''}
        <br><span style="color:var(--muted)">click to see them all</span>`,e.clientX,e.clientY);});
    b.addEventListener('pointerleave',hideTip);
    b.addEventListener('click',()=>drillTo({fx:'ur'}));
  });
}

/* ---------- monthly throughput ---------- */
function throughputChart(){
  const sm={},rm={};
  AB.forEach(r=>{ if(r.actualSub)sm[r.actualSub.slice(0,7)]=(sm[r.actualSub.slice(0,7)]||0)+1;
                  if(r.actualRcv)rm[r.actualRcv.slice(0,7)]=(rm[r.actualRcv.slice(0,7)]||0)+1;});
  const ms=[...new Set([...Object.keys(sm),...Object.keys(rm)])].sort();
  if(!ms.length)return '<div class="empty">Nothing submitted yet.</div>';
  const max=Math.max(...ms.map(m=>Math.max(sm[m]||0,rm[m]||0)))||1;
  return `<div class="chart" data-chart="thr">
    <div class="bars">${ms.map(m=>`
      <div class="bcol" data-m="${m}" data-s="${sm[m]||0}" data-r="${rm[m]||0}">
        <div class="bval">${sm[m]||0}</div>
        <div class="btr pair">
          <i style="height:${(sm[m]||0)/max*100}%;background:var(--accent)"></i>
          <i style="height:${(rm[m]||0)/max*100}%;background:#0ca30c"></i></div>
        <div class="blab">${m.slice(2).replace('-','/')}</div></div>`).join('')}</div>
    <div class="legend" style="margin-top:8px">
      <span><i style="background:var(--accent)"></i>Submitted</span>
      <span><i style="background:#0ca30c"></i>Returned by the reviewer</span></div></div>`;
}
function wireThr(root){
  const box=root.querySelector('[data-chart="thr"]'); if(!box)return;
  box.querySelectorAll('.bcol').forEach(b=>{
    b.addEventListener('pointerenter',e=>showTip(
      `<b>${b.dataset.m}</b><br>Submitted <b>${b.dataset.s}</b><br>Returned <b>${b.dataset.r}</b>`,
      e.clientX,e.clientY));
    b.addEventListener('pointerleave',hideTip);
  });
}

function wireCharts(root){ wireCurve(root);wireDonut(root);wireDisc(root);wireAge(root);wireThr(root); }

function matrixHTML(){
  const ds=[...new Set(AB.map(r=>r.discipline))].filter(Boolean).sort();
  const cell=(d,k)=>AB.filter(r=>r.discipline===d&&(r.status||'Not Submitted')===k).length;
  const rows=ds.map(d=>{
    const cs=CODES.map(k=>cell(d,k)),tot=cs.reduce((a,b)=>a+b,0);
    const app=AB.filter(r=>r.discipline===d&&APPROVED.includes(r.status)).length;
    return `<tr><td>${esc(d)}</td>${cs.map(n=>`<td style="text-align:center">${n||'—'}</td>`).join('')}
      <td style="text-align:right"><b>${tot}</b></td><td style="text-align:right">${tot?Math.round(app/tot*100):0}%</td></tr>`;}).join('');
  const tot=CODES.map(k=>AB.filter(r=>(r.status||'Not Submitted')===k).length),s=stats();
  return `<table><thead><tr><th>Discipline</th>${CODES.map(k=>
      `<th style="text-align:center">${k==='Not Submitted'?'Not sub.':k}</th>`).join('')}
      <th style="text-align:right">Total</th><th style="text-align:right">Approved</th></tr></thead>
    <tbody>${rows}<tr style="font-weight:650;background:var(--surface)">
      <td>All disciplines</td>${tot.map(n=>`<td style="text-align:center">${n}</td>`).join('')}
      <td style="text-align:right">${s.t}</td><td style="text-align:right">${s.t?Math.round(s.app/s.t*100):0}%</td></tr></tbody></table>`;
}
function overdueHTML(limit){
  const od=AB.filter(r=>!APPROVED.includes(r.status)&&r.targetDate&&r.targetDate<today)
    .map(r=>({...r,late:days(r.targetDate,today)})).sort((a,b)=>b.late-a.late);
  if(!od.length)return '<div class="empty">Nothing is past its target date.</div>';
  const where=r=>r.status==='W'?'With the reviewer':REJECTED.includes(r.status)?'Needs resubmission':'Not submitted';
  return `<table><thead><tr><th>Drawing</th><th>Name</th><th>Discipline</th><th>Target</th>
    <th style="text-align:right">Days late</th><th>Sitting with</th></tr></thead><tbody>`+
    od.slice(0,limit||20).map(r=>`<tr><td>${esc(r.docNo)}</td>
      <td>${esc(r.title)}</td><td>${esc(r.discipline)}</td><td>${esc(r.targetDate)}</td>
      <td style="text-align:right;color:var(--critical);font-weight:600">${r.late}</td>
      <td>${where(r)}</td></tr>`).join('')+`</tbody></table>`+
    (od.length>(limit||20)?`<div class="hint" style="padding:7px">Showing the ${limit||20} latest of ${od.length}.</div>`:'');
}

/* ================= excel ================= */
function ensureXLSX(){return new Promise((res,rej)=>{
  if(window.XLSX)return res(window.XLSX);
  const s=document.createElement('script');s.src=XLSX_CDN;
  s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('no xlsx'));document.head.appendChild(s);});}
function tableAOA(){
  const cs=visCols(), rows=GRID?GRID.rows:AB;
  return [cs.map(c=>c.t)].concat(rows.map(r=>cs.map(c=>c.calc?c.calc(r):(r[c.k]??''))));
}
async function exportXLSX(){
  try{
    const X=await ensureXLSX();
    const ws=X.utils.aoa_to_sheet(tableAOA());
    ws['!cols']=visCols().map(c=>({wpx:colW(c)}));
    const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,'As-Builts');
    X.writeFile(wb,'IWTP2_AsBuilts_'+today+'.xlsx');
    toast('Excel file downloaded');
  }catch(e){ toast('Could not load the Excel library — CSV works offline'); exportCSV(); }
}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=tableAOA().map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download='IWTP2_AsBuilts_'+today+'.csv';a.click();
  toast('CSV downloaded');
}
function importExcel(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls,.csv';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f)return;
    try{
      const X=await ensureXLSX();
      const wb=X.read(await f.arrayBuffer(),{type:'array'});
      const aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
      if(aoa.length<2)return toast('That sheet looks empty');
      const head=aoa[0].map(h=>String(h).trim().toLowerCase());
      const map=head.map(h=>{const c=COLS.find(c=>c.t.toLowerCase()===h||c.k.toLowerCase()===h);
        return c&&!c.ro?c.k:null;});
      if(!map.some(Boolean))return msgBox('Import from Excel','⤒',
        'None of the headings matched. Use the same headings as the register — '+
        'export it first if you want a template.',[['Close',null,'primary']]);
      const dn=map.indexOf('docNo');
      msgBox('Import '+(aoa.length-1)+' row(s)?','⤒',
        `Matching on <b>Drawing number</b>: rows that already exist are updated, new numbers are added.
         Columns matched: ${map.filter(Boolean).map(k=>esc(COLBY[k].t)).join(', ')}.`,
        [['Cancel',null,''],['Import',async()=>{
          txBegin('import '+(aoa.length-1)+' row(s)');
          let upd=0,add=0;
          for(let i=1;i<aoa.length;i++){
            const line=aoa[i]; if(!line.join('').trim())continue;
            const no=dn>=0?String(line[dn]||'').trim():'';
            let row=no?AB.find(r=>r.docNo===no):null;
            if(!row){
              const base={projectId:PROJ,sn:String(AB.length+1),docNo:no,title:'',
                discipline:'',currentRev:'',status:'Not Submitted'};
              row=await apiInsert(base); AB.push(row); txPush({t:'add',id:row.id,row:base}); add++;
            } else upd++;
            for(let j=0;j<map.length;j++){
              if(!map[j])continue;
              const v=String(line[j]??'').trim(); if(v==='')continue;
              await setCell(row,map[j],v,true);
            }
          }
          txEnd(); refresh(); toast(add+' added, '+upd+' updated');
        },'primary']]);
    }catch(e){ console.error(e); toast('Could not read that file'); }
  };
  inp.click();
}

/* ================= mobile shell ================= */
const MOB={view:'dash',id:null,stack:[],q:'',f:'',fs:'',fd:''};
function isPhone(){
  if(location.hash==='#mobile')return true;
  if(location.hash==='#desktop')return false;
  if(/Android|iPhone|iPod|Windows Phone|Mobile/i.test(navigator.userAgent||''))return true;
  const coarse=window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;
  if(coarse&&window.innerWidth<1100)return true;
  return !!(window.matchMedia&&window.matchMedia('(max-width: 820px)').matches);
}
function setMobile(on,remember){
  MOBILE=!!on;
  document.body.classList.toggle('mobile',MOBILE);
  if(remember){try{location.hash=MOBILE?'mobile':'desktop';}catch(e){}}
  if(MOBILE){MOB.stack=[];mobRender();}
  else{ if(!WINS.size&&USER){openRegister();openDashboard();} }
}
function checkMode(){ const p=isPhone(); if(p!==MOBILE)setMobile(p,false); }
function mobGo(view,id){MOB.stack.push({view:MOB.view,id:MOB.id,q:MOB.q,f:MOB.f});
  MOB.view=view;MOB.id=id;MOB.q='';mobRender();}
function mobBack(){const p=MOB.stack.pop();if(!p)return;Object.assign(MOB,p);mobRender();}
function mobTab(v){MOB.stack=[];MOB.view=v;MOB.id=null;MOB.q='';MOB.f='';MOB.fs='';MOB.fd='';
  const b=document.getElementById('mbody');if(b)b.scrollTop=0;mobRender();}
function mobRender(){
  if(!MOBILE)return;
  const T={dash:'Dashboard',reg:'Register',one:'Drawing',late:'Past target',more:'More'};
  let ttl=T[MOB.view]||'As-Builts', sub='IWTP2';
  if(MOB.view==='one'){const r=AB.find(x=>x.id===MOB.id);
    ttl=r?(r.docNo||'New drawing'):'Drawing'; sub=r?(r.discipline||''):'';}
  document.getElementById('mtitle').textContent=ttl;
  document.getElementById('msub').textContent=sub;
  document.getElementById('mback').style.visibility=MOB.stack.length?'visible':'hidden';
  const tabs=[['dash','◔','Dashboard'],['reg','▦','Register'],['late','⚑','Past target'],['more','⋯','More']];
  document.getElementById('mtabs').innerHTML=tabs.map(([v,i,l])=>
    `<button class="${MOB.view===v||(v==='reg'&&MOB.view==='one')?'on':''}" data-mt="${v}"><b>${i}</b>${l}</button>`).join('');
  document.getElementById('mtabs').querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>mobTab(b.dataset.mt));
  const V={dash:mobDash,reg:mobList,one:mobOne,late:mobLate,more:mobMore};
  document.getElementById('mbody').innerHTML=(V[MOB.view]||mobDash)();
  wireMob(); wireCharts(document.getElementById('mbody')); updateBell();
}
const offBar=()=>LIVE?'':`<div class="offbar"><b>Saved snapshot.</b> This copy cannot reach the
  database, so the figures are as at 14 Aug 2026 and editing is off.</div>`;
function mobDash(){
  const s=stats(),pc=n=>s.t?Math.round(n/s.t*100):0;
  const t=(k,v,p,c,f)=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>
    <div class="p">${p}</div><div class="bar"><i style="width:${f}%;background:${c}"></i></div></div>`;
  return offBar()+`<div class="mkpi">
      ${t('In scope',s.t,'drawings','var(--accent)',100)}
      ${t('Submitted',s.sub,pc(s.sub)+'%','var(--accent)',pc(s.sub))}
      ${t('Approved',s.app,'A, B or I','#0ca30c',pc(s.app))}
      ${t('Under review',s.ur,'code W','#fab219',pc(s.ur))}
      ${t('Resubmit',s.rej,'C or D','#d03b3b',pc(s.rej))}
      ${t('Not submitted',s.ns,pc(s.ns)+'%','#b9b7b0',pc(s.ns))}</div>
    <div class="panel"><h3>Submission curve</h3>${curveChart()}</div>
    <div class="panel"><h3>Review codes</h3>${donutChart()}</div>
    <div class="panel"><h3>Under review</h3>${ageingChart()}</div>
    <div class="panel"><h3>Submitted and returned each month</h3>${throughputChart()}</div>
    <div class="panel"><h3>Discipline against code</h3>${disciplineChart()}</div>`;
}
function mobFilters(){
  const F=[['','All'],['open','Open'],['ur','Under review'],['late','Past target'],['ns','Not submitted']];
  return `<div class="mfilt">${F.map(([v,l])=>
    `<button class="${MOB.f===v?'on':''}" data-mf="${v}">${l}</button>`).join('')}</div>`;
}
function mobRows(){
  const q=MOB.q.toLowerCase();
  return AB.filter(r=>{
    if(q&&!((r.docNo||'')+' '+(r.title||'')).toLowerCase().includes(q))return false;
    if(MOB.f==='open'&&!isOpen(r))return false;
    if(MOB.f==='ur'&&r.status!=='W')return false;
    if(MOB.f==='ns'&&r.status!=='Not Submitted')return false;
    if(MOB.fs&&(r.status||'Not Submitted')!==MOB.fs)return false;
    if(MOB.fd&&r.discipline!==MOB.fd)return false;
    if(MOB.f==='late'&&!(!APPROVED.includes(r.status)&&r.targetDate&&r.targetDate<today))return false;
    return true;});
}
function card(r){
  const k=r.status||'Not Submitted';
  const late=(!APPROVED.includes(r.status)&&r.targetDate&&r.targetDate<today)?days(r.targetDate,today):0;
  return `<div class="mcard" data-mo="${r.id}">
    <div class="r1"><span class="no">${esc(r.docNo)}</span>
      <span class="pill ${k==='Not Submitted'?'s-N':'s-'+k}">${esc(k==='Not Submitted'?'Not sub.':k)}</span></div>
    <div class="ti">${esc(r.title)}</div>
    <div class="m"><span>${esc(r.discipline)||'—'}</span>${r.currentRev?`<span>Rev ${esc(r.currentRev)}</span>`:''}
      ${r.actualSub?`<span>Sent ${esc(r.actualSub)}</span>`:''}
      ${late?`<span style="color:var(--critical)">${late}d late</span>`:''}</div></div>`;
}

  const rows=mobRows();
  const chips=[MOB.fd,MOB.fs&&('Code '+MOB.fs)].filter(Boolean);
  const applied=chips.length?`<div class="applied">
      <span>${chips.map(esc).join('</span><span>')}</span>
      <button id="mclear">Clear</button></div>`:'';
  return offBar()+`<input class="f" id="msearch" placeholder="Search number or name" value="${esc(MOB.q)}">

    ${rows.length?rows.map(card).join(''):'<div class="empty">Nothing matches that.</div>'}`;
}
function mobLate(){
  const rows=AB.filter(r=>!APPROVED.includes(r.status)&&r.targetDate&&r.targetDate<today)
    .map(r=>({...r,late:days(r.targetDate,today)})).sort((a,b)=>b.late-a.late);
  return offBar()+`<div class="hint" style="margin-bottom:8px">${rows.length} past their target date</div>`+
    (rows.length?rows.map(card).join(''):'<div class="empty">Nothing is past its target date.</div>');
}
function mobOne(){
  const r=AB.find(x=>x.id===MOB.id); if(!r)return '<div class="empty">That drawing has gone.</div>';
  const show=COLS.filter(c=>!c.ro||c.calc);
  return `<div class="mcard">${show.map(c=>{
      const v=c.calc?c.calc(r):(r[c.k]??'');
      if(c.calc&&!v)return '';
      return `<div class="mrow ${c.ro?'':'tap'}" ${c.ro?'':`data-me="${c.k}"`}>
        <span class="l">${esc(c.t)}</span>
        <span class="v">${c.pill?cellText(r,c):(esc(v)||'<span style="color:var(--muted)">—</span>')}
        ${c.ro?'':'<span class="hint"> ›</span>'}</span></div>`;}).join('')}</div>
    ${canEdit()?`<button class="btn danger" id="mdel" style="width:100%;padding:11px;margin-top:6px">Delete this drawing</button>`:''}`;
}
function mobMore(){
  return `<div class="mcard">
    <div class="mrow"><span class="l">Signed in as</span><span class="v">${esc(USER?USER.name:'—')}</span></div>
    <div class="mrow"><span class="l">Access</span><span class="v">${esc(USER?USER.role:'—')}</span></div>
    <div class="mrow"><span class="l">Connection</span><span class="v">${LIVE?'Live':'Snapshot, read-only'}</span></div>
    <div class="mrow"><span class="l">Drawings</span><span class="v">${AB.length}</span></div>
    <div class="mrow"><span class="l">Build</span><span class="v">${BUILD}</span></div></div>
    <div class="mcard">
    <div class="mrow tap" data-mm="csv"><span class="l">Export to CSV</span><span class="v">›</span></div>
    <div class="mrow tap" data-mm="xlsx"><span class="l">Export to Excel</span><span class="v">›</span></div>
    <div class="mrow tap" data-mm="theme"><span class="l">Light or dark</span><span class="v">›</span></div>
    <div class="mrow tap" data-mm="desktop"><span class="l">Switch to the full layout</span><span class="v">›</span></div>
    <div class="mrow tap" data-mm="logout"><span class="l">Sign out</span><span class="v">›</span></div></div>`;
}
function wireMob(){
  const b=document.getElementById('mbody');
  b.querySelectorAll('[data-mo]').forEach(el=>el.onclick=()=>mobGo('one',+el.dataset.mo));
  b.querySelectorAll('[data-mf]').forEach(el=>el.onclick=()=>{
    MOB.f=el.dataset.mf;MOB.fs='';MOB.fd='';mobRender();});
  const mc=document.getElementById('mclear');
  if(mc)mc.onclick=()=>{MOB.fs='';MOB.fd='';MOB.f='';MOB.q='';mobRender();};
  const s=document.getElementById('msearch');
  if(s)s.oninput=()=>{MOB.q=s.value;const p=s.selectionStart;mobRender();
    const n=document.getElementById('msearch');if(n){n.focus();n.setSelectionRange(p,p);}};
  b.querySelectorAll('[data-me]').forEach(el=>el.onclick=()=>mobEdit(el.dataset.me));
  const d=document.getElementById('mdel');
  if(d)d.onclick=()=>{const r=AB.find(x=>x.id===MOB.id);
    msgBox('Delete '+(r.docNo||'this drawing')+'?','🗑','It will be removed from the register.',
      [['Cancel',null,''],['Delete',async()=>{
        const copy={...r};delete copy.id;
        txPush({t:'del',id:r.id,row:copy});
        AB=AB.filter(x=>x.id!==r.id);await apiDelete(r.id);await logAct('delete',r);
        mobBack();refresh();toast('Deleted');},'danger']]);};
  b.querySelectorAll('[data-mm]').forEach(el=>el.onclick=()=>{
    const a=el.dataset.mm;
    if(a==='csv')exportCSV(); else if(a==='xlsx')exportXLSX();
    else if(a==='theme')toggleTheme();
    else if(a==='desktop')setMobile(false,true);
    else if(a==='logout')logout();});
}
function mobEdit(k){
  const c=COLBY[k], r=AB.find(x=>x.id===MOB.id); if(!c||!r)return;
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const cur=r[k]??'';
  const field=c.opts
    ? `<select class="f" id="mev" style="width:100%;padding:10px;font-size:15px">${
        c.opts().map(o=>`<option${String(cur)===String(o)?' selected':''}>${esc(o)||'—'}</option>`).join('')}</select>`
    : `<input class="f" id="mev" type="${c.date?'date':'text'}" value="${esc(cur)}"
        style="width:100%;padding:10px;font-size:15px">`;
  msgBox(c.t,'✎',field,[['Cancel',null,''],['Save',async()=>{
    const v=document.getElementById('mev')?document.getElementById('mev').value:cur;
    await setCell(r,k,v); mobRender();},'primary']]);
  setTimeout(()=>{const el=document.getElementById('mev');if(el)el.focus();},40);
}

/* ================= auth & boot ================= */
function toggleTheme(){
  const d=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=d?'':'dark';
  try{localStorage.setItem('ab-theme',d?'light':'dark');}catch(e){}
  refresh();
}
function logout(){
  USER=null; try{localStorage.removeItem('ab-user');}catch(e){}
  [...WINS.keys()].forEach(closeWin);
  document.getElementById('login').classList.add('on');
}
async function doLogin(){
  const u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value;
  const err=document.getElementById('lerr');
  if(!LIVE){
    USER={name:'Guest',username:'guest',role:'viewer'};
    err.innerHTML='<span class="hint">No connection — opening the read-only snapshot.</span>';
    return setTimeout(startApp,500);
  }
  try{
    const list=await api('users?username=eq.'+encodeURIComponent(u)+'&limit=1');
    if(!list.length||list[0].password!==p){
      err.innerHTML='<span style="color:var(--critical);font-size:12px">That username and password do not match.</span>';
      return;
    }
    USER=list[0];
    try{localStorage.setItem('ab-user',JSON.stringify(USER));}catch(e){}
    startApp();
  }catch(e){ err.innerHTML='<span style="color:var(--critical);font-size:12px">Could not reach the database.</span>'; }
}
function startApp(){
  document.getElementById('login').classList.remove('on');
  document.getElementById('projsub').textContent='IWTP2'+(USER?' · '+USER.name:'');
  MOBILE=isPhone(); document.body.classList.toggle('mobile',MOBILE);
  if(MOBILE)mobRender();
  else{ openRegister(); openDashboard();
    const d=[...WINS.values()].find(w=>w.kind==='dash');
    if(d){d.x=Math.max(20,desk().clientWidth-d.w-20);d.y=16;applyRect(d);}
    focusWin([...WINS.values()].find(w=>w.kind==='reg').id); }
  updateUndoBtns(); updateBell(); renderDock();
}
async function boot(){
  try{ if(localStorage.getItem('ab-theme')==='dark')document.documentElement.dataset.theme='dark'; }catch(e){}
  loadPrefs();
  try{
    const [ab,pr]=await Promise.all([
      api('asbuilts?projectId=eq.'+PROJ+'&order=sn.asc&limit=2000'),
      api('projects?id=eq.'+PROJ+'&limit=1')]);
    AB=ab; LIVE=true;
    if(pr[0]&&pr[0].colprefs)loadPrefs(pr[0].colprefs);
    try{ NOTIFS=await api('notifs?projectId=eq.'+PROJ+'&order=id.desc&limit=100'); }catch(e){}
  }catch(e){
    console.warn('Database unreachable — using the built-in snapshot.',e);
    AB=SNAPSHOT.map(r=>({...r})); LIVE=false;
  }
  if(!LIVE){ USER={name:'Guest',username:'guest',role:'viewer'}; startApp(); return; }
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('ab-user')||'null'); }catch(e){}
  if(saved){ USER=saved; startApp(); }
  else{ document.getElementById('login').classList.add('on');
        setTimeout(()=>{const el=document.getElementById('lu');if(el)el.focus();},60); }
}

/* topbar wiring */
document.getElementById('b-reg').onclick=()=>{if(GRID&&WINS.has(GRID.win.id))focusWin(GRID.win.id);else openRegister();};
document.getElementById('b-dash').onclick=openDashboard;
document.getElementById('b-undo').onclick=undo;
document.getElementById('b-redo').onclick=redo;
document.getElementById('b-bell').onclick=openNotifs;
document.getElementById('mbell').onclick=()=>{
  msgBox('Notifications','🔔',NOTIFS.length?NOTIFS.map(n=>
    `<div class="mrow"><div><b>${esc(n.title)}</b><div class="hint">${esc(n.body||'')}</div></div></div>`).join('')
    :'<div class="empty">Nothing needs your attention.</div>',[['Close',null,'primary']]);};
document.getElementById('mback').onclick=mobBack;
document.getElementById('lgo').onclick=doLogin;
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
const menu=document.getElementById('menu');
document.getElementById('b-menu').onclick=e=>{e.stopPropagation();menu.classList.toggle('open');};
document.addEventListener('click',()=>menu.classList.remove('open'));
menu.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  menu.classList.remove('open');
  const a=b.dataset.a;
  if(a==='cols')openCols(); else if(a==='xlsx')exportXLSX(); else if(a==='csv')exportCSV();
  else if(a==='import')importExcel(); else if(a==='activity')openActivity();
  else if(a==='users')openUsers(); else if(a==='arrange')arrangeWins();
  else if(a==='theme')toggleTheme(); else if(a==='mobile')setMobile(true,true);
  else if(a==='logout')logout();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('msgwrap').classList.contains('on'))closeMsg();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!GRID?.editing&&e.target===document.body){e.preventDefault();undo();}
});
window.addEventListener('hashchange',()=>setMobile(isPhone(),false));
boot();

</script>
