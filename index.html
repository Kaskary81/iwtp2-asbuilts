    const qi=document.getElementById('pkq');
    if(qi&&caret!=null){qi.focus();qi.setSelectionRange(caret,caret);}
  };
  wire();
}


/* ================= plan as a Gantt =================
   One bar per document, running from the start of the plan week (or today,
   whichever is later) to its target date, with the target marked. Colour
   carries the state, so slippage is visible without reading a table. */
let PLAN_VIEW='table';

function ganttHTML(planId){
  const plan=PLANS.find(p=>p.id===planId), items=PITEMS[planId]||[];
  if(!plan||!items.length)
    return '<div class="empty"><b>Nothing to chart</b>Add documents to the plan first.</div>';

  const ws=plan.weekStart, we=weekEndOf(ws);
  const dates=items.map(i=>i.targetDate).filter(Boolean);
  const lo=[ws,...dates].sort()[0];
  const hiRaw=[we,...dates,today].sort().pop();
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
  const start=addDays(lo,-1), end=addDays(hiRaw,1);
  const span=Math.max(1,days(start,end));
  const pos=d=>Math.max(0,Math.min(100,days(start,d)/span*100));

  // day columns, labelled every other day when the span is long
  let grid='', labels='';
  for(let i=0;i<=span;i++){
    const d=addDays(start,i), x=i/span*100;
    const dow=new Date(d).getDay();               // 5=Fri 6=Sat
    const rest=(dow===5);                          // Friday is the day off
    grid+=`<i class="gl${rest?' rest':''}" style="left:${x}%;width:${100/span}%"></i>`;
    if(span<=10||i%2===0)
      labels+=`<span style="left:${x}%">${new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</span>`;
  }
  const todayX=(today>=start&&today<=end)?pos(today):null;

  const rows=items.map(it=>{
    const r=AB.find(a=>a.id===(it.docId!=null?it.docId:it.asbuiltId))||{};
    const st=itemState(it,plan);
    const from=(ws>today?ws:today);
    const to=it.targetDate||we;
    const a=pos(from<to?from:to), b=pos(to);
    const w=Math.max(1.2,b-a);
    const cls={done:'g-done',late:'g-late',overdue:'g-over',due:'g-due',
               nodate:'g-none',pending:'g-plan'}[st.k]||'g-due';
    return `<div class="grow" data-pi="${it.id}">
      <div class="glab" title="${esc(r.title||'')}">${esc(r.title||'—')}
        <i>${esc(r.discipline||'')}${it.assigneeId?' · '+esc(assigneeName(it.assigneeId)):''}</i></div>
      <div class="gtrack">
        ${grid}
        ${todayX!=null?`<i class="gnow" style="left:${todayX}%"></i>`:''}
        <div class="gbar ${cls}" style="left:${a}%;width:${w}%">
          <b>${esc(st.label)}</b></div>
        ${it.targetDate?`<i class="gdia ${cls}" style="left:${b}%"
           title="${esc(it.targetDate)}"></i>`:''}
      </div>
      <div class="gdate">${esc(it.targetDate||'—')}</div></div>`;}).join('');

  return `<div class="gantt" data-chart="gantt">
    <div class="ghead"><div class="glab"></div>
      <div class="gtrack gaxis">${grid}${labels}
        ${todayX!=null?`<i class="gnow" style="left:${todayX}%"></i>
          <span class="gnowlab" style="left:${todayX}%">today</span>`:''}</div>
      <div class="gdate">Target</div></div>
    ${rows}
    <div class="legend" style="margin-top:10px">
      <span><i class="sw" style="background:#0f9d58"></i>Done</span>

/* ================= PDF report =================
   Rendered as a print stylesheet rather than a PDF library, so it needs no
   CDN, keeps the exact layout, and works on a phone (Share → Save to Files)
   as well as on a desktop (Print → Save as PDF). Landscape A4, tables only. */

function filterLabel(){
  const bits=[];
  if(MOBILE){
    if(MOB.fd)bits.push(MOB.fd);
    if(MOB.fs)bits.push('Code '+MOB.fs);
    const m={open:'Open items only',ur:'Under review',late:'Past target date',ns:'Not submitted'};
    if(MOB.f&&m[MOB.f])bits.push(m[MOB.f]);
    if(MOB.q)bits.push('Search: "'+MOB.q+'"');
  }else{
    if(GRID.fd)bits.push(GRID.fd);
    if(GRID.fs)bits.push('Code '+GRID.fs);
    const m={open:'Open items only',ur:'Under review',late:'Past target date',ns:'Not submitted'};
    if(GRID.fx&&m[GRID.fx])bits.push(m[GRID.fx]);
    if(GRID.q)bits.push('Search: "'+GRID.q+'"');
  }
  return bits.length?bits.join(' · '):'Complete register — no filter applied';
}
function reportRows(){ return MOBILE?mobRows():(GRID&&GRID.rows?GRID.rows:AB); }
function reportCols(){
  if(!MOBILE)return visCols().filter(c=>c.k!=='sn');
  return ['docNo','title','discipline','currentRev','status','targetDate','actualSub','actualRcv']
    .map(k=>COLBY[k]);
}

const PRINT_DISC=SHORT_DISC;
const PRINT_HEAD={docNo:'Drawing number',title:'Submittal name',discipline:'Discipline',
  currentRev:'Rev',status:'Code',targetDate:'Targeted',actualSub:'Submitted',actualRcv:'Received'};

function buildReport(){
  const rows=reportRows(), cols=reportCols();
  const n=rows.length;
  const sub=rows.filter(submitted).length;
  const app=rows.filter(r=>APPROVED.includes(r.status)).length;
  const rej=rows.filter(r=>REJECTED.includes(r.status)).length;
  const ur =rows.filter(r=>r.status==='W').length;
  const ns =n-sub;
  const late=rows.filter(r=>!APPROVED.includes(r.status)&&r.targetDate&&r.targetDate<today).length;
  const stamp=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});

  const cell=(r,c)=>{
    let v=c.calc?c.calc(r):(r[c.k]??'');
    if(c.k==='status')v=(v||'Not Submitted')==='Not Submitted'?'Not sub.':v;
    if(c.k==='discipline')v=PRINT_DISC[v]||v;
    return v||'—';
  };
  const head=cols.map(c=>`<th class="c-${c.k}">${esc(PRINT_HEAD[c.k]||c.t)}</th>`).join('');
  const body=rows.map((r,i)=>`<tr><td class="c-idx">${i+1}</td>`+
      cols.map(c=>`<td class="c-${c.k}">${esc(cell(r,c))}</td>`).join('')+`</tr>`).join('');

  const kpi=(l,v)=>`<div class="rk"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="rhead">
      <div class="rt"><h1>IWTP2 — As-Built Drawings Register</h1>
        <div class="rs">Independent Water Transmission Pipeline 2</div></div>
      <div class="rd">${stamp}<br><span>${n} drawing${n===1?'':'s'}</span></div>
    </div>
    <div class="rfilt"><b>Selection:</b> ${esc(filterLabel())}</div>
    <div class="rkpis">
      ${kpi('In selection',n)}${kpi('Submitted',sub)}${kpi('Approved',app)}
      ${kpi('Under review',ur)}${kpi('Resubmit',rej)}${kpi('Not submitted',ns)}${kpi('Past target',late)}
    </div>
    <table class="rtbl"><thead><tr><th class="c-idx">#</th>${head}</tr></thead>
      <tbody>${body}</tbody></table>
    <div class="rfoot">IWTP2 As-Built Drawings Register · ${esc(filterLabel())} · ${stamp}${
      USER?' · issued by '+esc(USER.name):''}</div>`;
}
function exportPDF(){
  const rows=reportRows();
  if(!rows.length)return toast('Nothing to export with those filters');
  let root=document.getElementById('printroot');
  if(!root){ root=document.createElement('div'); root.id='printroot'; document.body.appendChild(root); }
  root.innerHTML=buildReport();
  document.body.classList.add('printing');
  const done=()=>{ document.body.classList.remove('printing');
    window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>{ window.print(); setTimeout(done,1500); },60);
  toast(rows.length+' rows — set Landscape, then Save as PDF');
}

/* ================= dashboard ================= */
function stats(){
  const t=AB.length, sub=AB.filter(submitted).length;
  return {t,sub,
    app:AB.filter(r=>APPROVED.includes(r.status)).length,
    rej:AB.filter(r=>REJECTED.includes(r.status)).length,

}
function kpiHTML(){
  const s=stats(), pc=n=>s.t?Math.round(n/s.t*100):0;

    <div class="p">${p}</div><div class="bar"><i style="width:${f}%;background:${col}"></i></div></div>`;

/* ================= charts =================
   Drawn as instrument plots rather than presentation graphics: hairline
   grids, monospace readouts, a variance band against plan, and a live
   readout strip that replaces the value labels while you drag across it.
   All hand-rolled SVG so the dashboard survives with no CDN. */

let TIP=null;
function tip(){ if(TIP)return TIP;
  TIP=document.createElement('div'); TIP.className='ctip';
  document.body.appendChild(TIP); return TIP; }
function showTip(html,x,y){ const t=tip(); t.innerHTML=html; t.classList.add('on');
  const r=t.getBoundingClientRect();
  t.style.left=Math.min(window.innerWidth-r.width-10,Math.max(8,x-r.width/2))+'px';
  t.style.top=(y-r.height-14<8?y+18:y-r.height-14)+'px'; }
function moveTip(e){ const t=tip(); if(!t.classList.contains('on'))return;
  t.style.left=Math.min(window.innerWidth-t.offsetWidth-10,Math.max(8,e.clientX-t.offsetWidth/2))+'px';
  t.style.top=(e.clientY-t.offsetHeight-14<8?e.clientY+18:e.clientY-t.offsetHeight-14)+'px'; }
function hideTip(){ if(TIP)TIP.classList.remove('on'); }
document.addEventListener('scroll',hideTip,true);

function drillTo(f){
  if(MOBILE){
    MOB.stack=[]; MOB.view='reg'; MOB.id=null; MOB.q='';
    MOB.f=f.fx||''; MOB.fs=f.fs||''; MOB.fd=f.fd||'';
    MOB.fage=f.fage||null; MOB.fageL=f.fageL||'';
    const b=document.getElementById('mbody'); if(b)b.scrollTop=0;
    mobRender(); return;
  }
  if(!GRID||!WINS.has(GRID.win.id))openRegister();
  Object.assign(GRID,{q:'',fd:'',fs:'',fx:'',fage:null,fageL:'',...f});
  renderGrid(); focusWin(GRID.win.id);
  toast('Showing '+([f.fd,f.fs&&('code '+f.fs),f.fageL&&(f.fageL+' with reviewer')]
    .filter(Boolean).join(' · ')||'everything'));
}

/* ---------- monthly series shared by two charts ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel=m=>MON[+m.slice(5,7)-1]+" '"+m.slice(2,4);
function monthly(){
  const sm={},rm={},tm={};
  AB.forEach(r=>{ if(r.actualSub)sm[r.actualSub.slice(0,7)]=(sm[r.actualSub.slice(0,7)]||0)+1;
                  if(r.actualRcv)rm[r.actualRcv.slice(0,7)]=(rm[r.actualRcv.slice(0,7)]||0)+1;
                  if(r.targetDate)tm[r.targetDate.slice(0,7)]=(tm[r.targetDate.slice(0,7)]||0)+1;});
  const ms=[...new Set([...Object.keys(sm),...Object.keys(rm),...Object.keys(tm)])].sort();
  let a=0,b=0,c=0;
  return ms.map(m=>{a+=sm[m]||0;b+=rm[m]||0;c+=tm[m]||0;
    return {m,sub:sm[m]||0,rcv:rm[m]||0,act:a,ret:b,pln:c};});
}

/* ---------- cumulative plot ---------- */
function curveChart(){
  const D=monthly();
  if(!D.length)return '<div class="empty">No dates recorded yet.</div>';
  const W=960,H=300,PL=44,PR=16,PT=18,PB=34;
  const max=Math.max(20,Math.ceil(Math.max(AB.length,...D.map(d=>Math.max(d.pln,d.act)))/20)*20);
  const X=i=>PL+(W-PL-PR)*(D.length<2?.5:i/(D.length-1));
  const Y=v=>H-PB-(H-PT-PB)*(v/max);
  const path=key=>D.map((d,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(d[key]).toFixed(1)).join(' ');
  // shaded band between plan and actual — the shortfall, drawn not stated
  // shade what is genuinely informative: the gap between sent and returned
  // is the work sitting with the reviewer right now.
  const gap=D.map((d,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(d.act).toFixed(1)).join('')
    +D.slice().reverse().map((d,i)=>'L'+X(D.length-1-i).toFixed(1)+' '+Y(d.ret).toFixed(1)).join('');
  let grid='';
  for(let i=0;i<=4;i++){const v=max*i/4;
    grid+=`<line class="gl" x1="${PL}" y1="${Y(v)}" x2="${W-PR}" y2="${Y(v)}"/>
      <text class="ax" x="${PL-9}" y="${Y(v)+3.5}" text-anchor="end">${Math.round(v)}</text>`;}
  D.forEach((d,i)=>{ const step=Math.ceil(D.length/12);
    grid+=`<line class="gl vt" x1="${X(i)}" y1="${PT}" x2="${X(i)}" y2="${H-PB}"/>`;
    if(D.length<14||i%step===0)
      grid+=`<text class="ax" x="${X(i)}" y="${H-13}" text-anchor="middle">${d.m.slice(2).replace('-','/')}</text>`;});
  const last=D[D.length-1], v=last.act-last.pln;
  return `<div class="chart plot" data-chart="curve">
    <div class="readout" id="ro-curve">
      <div class="ro"><span>Month</span><b id="ro-m">${mLabel(last.m)}</b></div>
      <div class="ro"><span>Sent</span><b id="ro-a">${last.act}</b></div>
      <div class="ro"><span>Back</span><b id="ro-r">${last.ret}</b></div>
      <div class="ro"><span>Plan</span><b id="ro-p">${last.pln}</b></div>
      <div class="ro"><span>Var</span><b id="ro-v" class="${v<0?'neg':'pos'}">${v>=0?'+':''}${v}</b></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="plotsvg">
      <defs>
        <linearGradient id="fillA" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>
        <linearGradient id="fillR" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#0f9d58" stop-opacity=".16"/>
          <stop offset="100%" stop-color="#0f9d58" stop-opacity="0"/></linearGradient>
      </defs>
      ${grid}
      <path d="${gap}Z" fill="#f0b429" fill-opacity=".16"/>
      <path d="${path('ret')}L${X(D.length-1)} ${Y(0)}L${X(0)} ${Y(0)}Z" fill="url(#fillR)"/>
      <path class="ln pln" d="${path('pln')}"/>
      <path class="ln ret" d="${path('ret')}"/>
      <path class="ln act draw" d="${path('act')}"/>
      <g class="pts">${D.map((d,i)=>
        `<circle data-i="${i}" cx="${X(i)}" cy="${Y(d.act)}" r="0"/>`).join('')}</g>
      <circle class="tip act" cx="${X(D.length-1)}" cy="${Y(last.act)}" r="4"/>
      <circle class="tip ret" cx="${X(D.length-1)}" cy="${Y(last.ret)}" r="3.4"/>
      <line class="cross" id="cx-curve" x1="0" y1="${PT}" x2="0" y2="${H-PB}" opacity="0"/>
      <g class="hot">${D.map((d,i)=>{
        const w=D.length<2?W-PL-PR:(X(1)-X(0));
        return `<rect data-i="${i}" x="${i?X(i)-w/2:PL}" y="${PT}" width="${w}" height="${H-PT-PB}"/>`;}).join('')}</g>
    </svg>
    <div class="legend">
      <span><i class="sw act"></i>Submitted</span>
      <span><i class="sw ret"></i>Returned</span>
      <span><i class="sw pln"></i>Planned</span>
      <span><i class="sw wip"></i>With reviewer</span>
      <span class="rt">${last.act} of ${AB.length} sent · <b>${v>=0?'+':''}${v}</b> vs plan</span>
    </div></div>`;
}
function wireCurve(root){
  const box=root.querySelector('[data-chart="curve"]'); if(!box)return;
  const D=monthly(), pts=[...box.querySelectorAll('.pts circle')];
  const cx=box.querySelector('#cx-curve');
  const set=(id,v,cls)=>{const el=box.querySelector('#ro-'+id);if(!el)return;
    el.textContent=v; if(cls!==undefined)el.className=cls;};
  const reset=()=>{const d=D[D.length-1],v=d.act-d.pln;
    set('m',mLabel(d.m));set('a',d.act);set('r',d.ret);set('p',d.pln);
    set('v',(v>=0?'+':'')+v,v<0?'neg':'pos');
    cx.setAttribute('opacity','0'); pts.forEach(p=>p.setAttribute('r','0'));};
  box.querySelectorAll('.hot rect').forEach(rc=>{
    rc.addEventListener('pointerenter',()=>{
      const i=+rc.dataset.i,d=D[i]; if(!d)return;
      const v=d.act-d.pln;
      set('m',mLabel(d.m));set('a',d.act);set('r',d.ret);set('p',d.pln);
      set('v',(v>=0?'+':'')+v,v<0?'neg':'pos');
      pts.forEach(p=>p.setAttribute('r',+p.dataset.i===i?'4.5':'0'));
      const x=pts[i].getAttribute('cx');
      cx.setAttribute('x1',x);cx.setAttribute('x2',x);cx.setAttribute('opacity','1');});
  });
  box.addEventListener('pointerleave',reset);
}

/* ---------- review code ring ---------- */
function donutChart(){
  const c={}; AB.forEach(r=>{const k=r.status||'Not Submitted';c[k]=(c[k]||0)+1;});
  const keys=CODES.filter(k=>c[k]), total=AB.length||1;
  const R=54, CIRC=2*Math.PI*R, GAP=1.4;
  let off=0, seg='';
  keys.forEach(k=>{
    const frac=c[k]/total, len=Math.max(CIRC*frac-GAP,0.5);
    seg+=`<circle class="ring" data-k="${esc(k)}" cx="70" cy="70" r="${R}"
      stroke="${COLOR[k]}" stroke-dasharray="${len} ${CIRC-len}"
      stroke-dashoffset="${-off}"/>`;
    off+=CIRC*frac;});
  return `<div class="chart ringc" data-chart="donut">
    <svg viewBox="0 0 140 140" class="ringsvg">
      <circle class="track" cx="70" cy="70" r="${R}"/>${seg}
      <text id="rg-n" x="70" y="68" text-anchor="middle" class="rgn">${AB.length}</text>
      <text id="rg-l" x="70" y="83" text-anchor="middle" class="rgl">IN SCOPE</text>
    </svg>
    <div class="codes">${keys.map(k=>`
      <button class="crow" data-k="${esc(k)}">
        <i style="background:${COLOR[k]}"></i>
        <span class="cl">${esc(k==='Not Submitted'?'Not submitted':'Code '+k)}</span>
        <b>${c[k]}</b><em>${(c[k]/total*100).toFixed(1)}%</em></button>`).join('')}</div></div>`;
}
function wireDonut(root){
  const box=root.querySelector('[data-chart="donut"]'); if(!box)return;
  const n=box.querySelector('#rg-n'), l=box.querySelector('#rg-l');
  const enter=k=>{
    const c=AB.filter(r=>(r.status||'Not Submitted')===k).length;
    n.textContent=c; l.textContent=(k==='Not Submitted'?'NOT SUBMITTED':'CODE '+k);
    box.querySelectorAll('.ring').forEach(s=>s.classList.toggle('dim',s.dataset.k!==k));
    box.querySelectorAll('.crow').forEach(r=>r.classList.toggle('dim',r.dataset.k!==k));};
  const leave=()=>{ n.textContent=AB.length; l.textContent='IN SCOPE';
    box.querySelectorAll('.ring,.crow').forEach(e=>e.classList.remove('dim'));};
  box.querySelectorAll('.ring,.crow').forEach(el=>{
    el.addEventListener('pointerenter',()=>enter(el.dataset.k));
    el.addEventListener('click',()=>drillTo({fs:el.dataset.k}));});
  box.addEventListener('pointerleave',leave);
}

/* ---------- time with the reviewer ---------- */
function ageingChart(){
  const ur=AB.filter(r=>r.status==='W'&&r.actualSub).map(r=>({...r,age:days(r.actualSub,today)}))
    .sort((a,b)=>b.age-a.age);
  if(!ur.length)return '<div class="empty">Nothing is with the reviewer.</div>';
  const B=[['0–14 days',0,14,'#0f9d58'],['15–30 days',15,30,'#f0b429'],
           ['31–60 days',31,60,'#e8834a'],['Over 60 days',61,1e9,'#d64545']];
  const counts=B.map(([l,lo,hi])=>ur.filter(r=>r.age>=lo&&r.age<=hi).length);
  const max=Math.max(...counts)||1;
  return `<div class="chart bullets" data-chart="age">
    ${B.map(([l,lo,hi,col],i)=>`
      <div class="brow" data-lo="${lo}" data-hi="${hi}" data-l="${l}" data-n="${counts[i]}">
        <div class="blab">${l}</div>

function ensureXLSX(){return new Promise((res,rej)=>{
  if(window.XLSX)return res(window.XLSX);
  const s=document.createElement('script');s.src=XLSX_CDN;
  s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('no xlsx'));document.head.appendChild(s);});}
function tableAOA(){
  const cs=visCols(), rows=GRID?GRID.rows:AB;
  return [cs.map(c=>c.t)].concat(rows.map(r=>cs.map(c=>c.calc?c.calc(r):(r[c.k]??''))));
}
async function exportXLSX(){
  try{
    const X=await ensureXLSX();
    const ws=X.utils.aoa_to_sheet(tableAOA());
    ws['!cols']=visCols().map(c=>({wpx:colW(c)}));
    const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,'As-Builts');
    X.writeFile(wb,'IWTP2_AsBuilts_'+today+'.xlsx');
    toast('Excel file downloaded');
  }catch(e){ toast('Could not load the Excel library — CSV works offline'); exportCSV(); }
}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=tableAOA().map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download='IWTP2_AsBuilts_'+today+'.csv';a.click();
  toast('CSV downloaded');
}
function importExcel(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls,.csv';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f)return;
    try{
      const X=await ensureXLSX();
      const wb=X.read(await f.arrayBuffer(),{type:'array'});
      const aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
      if(aoa.length<2)return toast('That sheet looks empty');
      const head=aoa[0].map(h=>String(h).trim().toLowerCase());
      const map=head.map(h=>{const c=COLS.find(c=>c.t.toLowerCase()===h||c.k.toLowerCase()===h);
        return c&&!c.ro?c.k:null;});
      if(!map.some(Boolean))return msgBox('Import from Excel','',
        'None of the headings matched. Use the same headings as the register — '+
        'export it first if you want a template.',[['Close',null,'primary']]);
      const dn=map.indexOf('docNo');
      msgBox('Import '+(aoa.length-1)+' row(s)?','',
        `Matching on <b>Drawing number</b>: rows that already exist are updated, new numbers are added.
         Columns matched: ${map.filter(Boolean).map(k=>esc(COLBY[k].t)).join(', ')}.`,
        [['Cancel',null,''],['Import',async()=>{
          txBegin('import '+(aoa.length-1)+' row(s)');
          let upd=0,add=0;
          for(let i=1;i<aoa.length;i++){
            const line=aoa[i]; if(!line.join('').trim())continue;
            const no=dn>=0?String(line[dn]||'').trim():'';
            let row=no?AB.find(r=>r.docNo===no):null;
            if(!row){
              const base={projectId:PROJ,sn:String(AB.length+1),docNo:no,title:'',
                discipline:'',currentRev:'',status:'Not Submitted'};
              row=await apiInsert(base); AB.push(row); txPush({t:'add',id:row.id,row:base}); add++;
            } else upd++;
            for(let j=0;j<map.length;j++){
              if(!map[j])continue;
              const v=String(line[j]??'').trim(); if(v==='')continue;
              await setCell(row,map[j],v,true);
            }
          }
          txEnd(); refresh(); toast(add+' added, '+upd+' updated');
        },'primary']]);
    }catch(e){ console.error(e); toast('Could not read that file'); }
  };
  inp.click();
}

function whenSeen(ts){
  if(!ts)return {t:'Never used it',cls:'never'};
  const d=new Date(ts), mins=Math.round((Date.now()-d)/60000);
  if(mins<2)return {t:'Just now',cls:'now'};
  if(mins<60)return {t:mins+' min ago',cls:'now'};
  if(mins<24*60)return {t:Math.round(mins/60)+'h ago',cls:'now'};
  const days=Math.round(mins/1440);
  if(days<8)return {t:days+'d ago',cls:''};
  return {t:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}),cls:''};
}

/* horizontal swipe on a card: left to remove, right to tick.
   Only engages once the movement is clearly sideways, so the list still scrolls. */
function attachSwipe(el,{onLeft,onRight,leftLabel,rightLabel}){
  let x0=0,y0=0,dx=0,live=false,decided=false;
  const TH=64;
  el.style.touchAction='pan-y';
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    x0=e.clientX;y0=e.clientY;dx=0;live=true;decided=false;});
  el.addEventListener('pointermove',e=>{
    if(!live)return;
    const ax=e.clientX-x0, ay=e.clientY-y0;
    if(!decided){
      if(Math.abs(ay)>Math.abs(ax)){live=false;return;}
      if(Math.abs(ax)<10)return;
      decided=true; el.classList.add('swiping');
    }
    dx=ax;
    if((dx<0&&!onLeft)||(dx>0&&!onRight))dx=0;
    el.style.transform='translateX('+Math.max(-110,Math.min(110,dx))+'px)';
    el.dataset.swipe=dx<-TH?'left':dx>TH?'right':'';
  });
  const end=()=>{
    if(!live){el.style.transform='';el.classList.remove('swiping');return;}
    live=false; el.classList.remove('swiping'); el.style.transform='';
    const hit=el.dataset.swipe; el.dataset.swipe='';
    if(hit==='left'&&onLeft)onLeft();
    if(hit==='right'&&onRight)onRight();
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('pointerleave',end);
}

    USER={id:s.user.id,email:s.user.email,name:who[0].name||s.user.email,role:who[0].role};

    try{localStorage.setItem('ab-session',JSON.stringify(
      {t:s.access_token,r:s.refresh_token,exp:Date.now()+(s.expires_in||3600)*1000}));

      (String(e.message).includes('credentials')?'That email and password do not match.':esc(e.message))+'</span>';
  }finally{ btn.disabled=false; btn.textContent='Sign in'; }

async function resumeSession(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('ab-session')||'null'); }catch(e){}
  if(!s||!s.r)return false;
  try{
    const n=(s.exp&&s.exp>Date.now()+60000)?{access_token:s.t,refresh_token:s.r,expires_in:(s.exp-Date.now())/1000}
      :await auth('token?grant_type=refresh_token',{refresh_token:s.r});
    TOKEN=n.access_token;
    const me=await api('members?user_id=eq.'+
      (n.user?n.user.id:(JSON.parse(atob(n.access_token.split('.')[1])).sub))+'&limit=1');
    if(!me.length){TOKEN=null;return false;}
    USER={id:me[0].user_id,email:me[0].email,name:me[0].name||me[0].email,role:me[0].role};
    if(me[0].prefs)loadPrefs(me[0].prefs);
    try{localStorage.setItem('ab-session',JSON.stringify(
      {t:n.access_token,r:n.refresh_token||s.r,exp:Date.now()+(n.expires_in||3600)*1000}));}catch(e){}
    return true;
  }catch(e){ TOKEN=null; try{localStorage.removeItem('ab-session');}catch(_){} return false; }
}

async function loadRevs(){
  try{
    const r=await api('revisions?order=id.asc&limit=5000');
    REVS={}; r.forEach(x=>{ (REVS[x.asbuiltId]=REVS[x.asbuiltId]||[]).push(x); });
  }catch(e){ REVS={}; }
}
const revNum=v=>{const m=/(\d+)/.exec(v||'');return m?+m[1]:-1;};
function revsOf(id){
  return (REVS[id]||[]).slice().sort((a,b)=>{
    const d=revNum(a.rev)-revNum(b.rev);
    return d||String(a.submitted||'').localeCompare(String(b.submitted||''));});
}

/* ---------- log a new submission cycle ---------- */
function revBasis(r){
  const dated=revsOf(r.id).filter(x=>x.submitted);
  if(!dated.length)return 'First submission — starting at 0X.';
  const last=dated[dated.length-1];
  return 'Next after '+esc(last.rev)+', submitted '+esc(last.submitted)+'.';
}
function nextRevAB(id){
  const rows=revsOf(id);
  const nums=rows.map(x=>{const m=/(\d+)/.exec(x.rev||'');return m?+m[1]:-1;});
  const top=nums.length?Math.max(...nums):-1;
  // revisions on this project are written 0X, 1X, 2X — keep the suffix
  const suffix=(rows.map(x=>x.rev||'').find(v=>/^\d+[A-Za-z]+$/.test(v))||'0X')
    .replace(/^\d+/,'') || 'X';
  return String(top+1)+suffix;
}
async function removeCycle(r,cid){
  if(!canEdit())return toast('Your account cannot edit');
  const all=revsOf(r.id);
  const c=all.find(x=>x.id===cid); if(!c)return;
  const dated=all.filter(x=>x.submitted&&x.id!==cid);
  const wasLatest=!!c.submitted&&!all.filter(x=>x.submitted).some(x=>revNum(x.rev)>revNum(c.rev));
  const next=dated.length?dated[dated.length-1]:null;
  const after=!c.submitted ? 'The drawing is not affected — this cycle has no dates.'
    : wasLatest
      ? (next
          ? `The drawing will fall back to <b>Rev ${esc(next.rev)}</b>
             (<b>${esc(next.status||'W')}</b>, submitted ${esc(next.submitted)}).`
          : `Nothing else has been submitted, so the drawing will go back to
             <b>Not Submitted</b> with no dates.`)
      : 'This is an earlier cycle, so the drawing keeps its current revision and code.';
  msgBox('Remove Rev '+(c.rev||'')+'?','',
    `<b>${esc(r.docNo||'')}</b><br>${esc(r.title||'')}<br><br>
     ${c.submitted?`Submitted ${esc(c.submitted)}${c.received?', returned '+esc(c.received):''}
       ${c.status?' — '+esc(c.status):''}.<br><br>`:''}
     ${after}<br><br>
     <b>This cannot be undone.</b> Removing a cycle erases that piece of the
     submission record permanently.`,
    [['Keep it',null,''],['Remove',async()=>{
      try{
        await api('revisions?id=eq.'+cid,{method:'DELETE'});
        const fresh=await api('asbuilts?id=eq.'+r.id+'&limit=1');
        if(fresh&&fresh[0])Object.assign(r,fresh[0]);
        await loadRevs();
        await logAct('edit',r,'revision removed',c.rev+' '+(c.submitted||'no dates'),'');
        if(MOBILE)mobRender(); else refresh();
        toast('Rev '+c.rev+' removed');
      }catch(e){ toast('Could not remove that cycle'); }
    },'danger']]);
}
function editCycle(r,cid){
  if(!canEdit())return toast('Your account cannot edit');
  const all=revsOf(r.id);
  const c=all.find(x=>x.id===cid); if(!c)return;
  const dated=all.filter(x=>x.submitted);
  const isLatest=!dated.length||revNum(c.rev)>=revNum(dated[dated.length-1].rev);
  msgBox('Rev '+(c.rev||''),'',
    `<div class="itemhd">${esc(r.docNo||'')}<span>${esc(r.title||'')}</span></div>
     <label class="fl">Submitted</label>
     <input class="f big" id="edSent" type="date" value="${esc(c.submitted||'')}">
     <label class="fl">Returned</label>
     <input class="f big" id="edResp" type="date" value="${esc(c.received||'')}">
     <label class="fl">Code</label>
     <select class="f big" id="edOut"><option value="">— not returned yet —</option>
       ${CODES.filter(k=>k!=='Not Submitted').map(k=>
         `<option${c.status===k?' selected':''}>${esc(k)}</option>`).join('')}</select>
     <div class="hint" id="edNote" style="margin-top:10px"></div>`,
    [['Remove this cycle',()=>removeCycle(r,cid),'danger'],['Save',async()=>{
      const sent=document.getElementById('edSent').value;
      const resp=document.getElementById('edResp').value;
      const out=document.getElementById('edOut').value;
      try{
        await api('revisions?id=eq.'+cid,{method:'PATCH',body:JSON.stringify({
          submitted:sent,received:resp,status:resp?(out||'W'):(sent?'W':''),
          turnaround:(sent&&resp&&resp>=sent)?days(sent,resp):null,
          actor:(USER&&USER.email)||'app'})});
        // the drawing follows its latest revision, so reload the row itself too
        const fresh=await api('asbuilts?id=eq.'+r.id+'&limit=1');
        if(fresh&&fresh[0])Object.assign(r,fresh[0]);
        await loadRevs();
        if(MOBILE)mobRender(); else refresh();
        toast('Rev '+c.rev+' updated'+(isLatest?' — drawing now '+(r.status||'')  :''));
      }catch(e){ toast('Could not save that cycle'); }
    },'primary']]);
  const enote=()=>{
    const el=document.getElementById('edNote'); if(!el)return;
    const resp=document.getElementById('edResp').value;
    const sel=document.getElementById('edOut');
    // no receipt date means the cycle is still with the reviewer — code is W
    sel.disabled=!resp; if(!resp)sel.value='';
    const out=sel.value;
    const code=resp?(out||'W'):'W';
    const openNote=resp?'':' No receipt date, so this cycle stays <b>W</b> — still with the reviewer.';
    el.innerHTML=(isLatest
      ? `This is the latest revision, so the drawing takes its code —
         <b>${esc(code)}</b> — and its dates.`
      : `This is an earlier cycle. The drawing keeps its current revision
         (<b>${esc(r.currentRev||'—')}</b>) and code (<b>${esc(r.status||'—')}</b>).`)+openNote;};
  ['edSent','edResp','edOut'].forEach(id=>{
    const e=document.getElementById(id); if(e)e.onchange=enote;});
  enote();
}
function logCycle(r){
  if(!canEdit())return toast('Your account cannot edit');
  msgBox('Log a submission','',
    `<label class="fl">Revision</label>
     <div class="autofield">
       <input class="f big" id="lgRev" value="${esc(nextRevAB(r.id))}" readonly>
       <button type="button" class="lnk" id="lgRevEdit">change</button>
     </div>
     <div class="hint" style="margin-top:4px">${revBasis(r)}</div>
     <label class="fl">Submitted</label>
     <input class="f big" id="lgSent" type="date" value="${today}">
     <label class="fl">Returned (leave blank if still with the reviewer)</label>
     <input class="f big" id="lgResp" type="date" value="">
     <label class="fl">Code</label>
     <select class="f big" id="lgOut"><option value="">— not returned yet —</option>
       ${CODES.filter(k=>k!=='Not Submitted').map(k=>`<option>${esc(k)}</option>`).join('')}</select>
     <div class="hint" id="lgNote" style="margin-top:10px"></div>`,
    [['Cancel',null,''],['Save',async()=>{
      const rev=document.getElementById('lgRev').value.trim();
      const sent=document.getElementById('lgSent').value;
      const resp=document.getElementById('lgResp').value;
      const out=document.getElementById('lgOut').value;
      if(!rev||!sent)return toast('A revision and a submitted date are needed');
      const before=(r.currentRev||'')+' '+(r.status||'');
      try{
        await api('revisions',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({
          asbuiltId:r.id,docNo:r.docNo,rev,submitted:sent,received:resp||'',
          status:resp?(out||'W'):'W',
          turnaround:(resp&&sent&&resp>=sent)?days(sent,resp):null,
          actor:(USER&&USER.email)||'app'})});
        // the drawing is derived from its latest cycle, so read it back rather
        // than patching it here — that is what left a stale receipt date on screen
        const fresh=await api('asbuilts?id=eq.'+r.id+'&limit=1');
        if(fresh&&fresh[0])Object.assign(r,fresh[0]);
        await loadRevs();
        await logAct('edit',r,'submission',before,rev+' '+sent+(resp?' → '+resp:''));
        if(MOBILE)mobRender(); else refresh();
        toast('Rev '+rev+' logged'+(r.actualRcv?'':' — now with the reviewer'));
      }catch(e){ toast('Could not log that submission'); }
    },'primary']]);
  const note=()=>{
    const resp=document.getElementById('lgResp').value;
    const sel=document.getElementById('lgOut');
    sel.disabled=!resp; if(!resp)sel.value='';
    const el=document.getElementById('lgNote'); if(!el)return;
    el.innerHTML=resp
      ? `This closes the cycle and sets the drawing to <b>${esc(sel.value||'W')}</b>.`
      : `This opens a new cycle. With no receipt date the drawing shows as
         <b>W</b> — still with the reviewer.`;
  };
  const re=document.getElementById('lgRevEdit');
  if(re)re.onclick=()=>{const f=document.getElementById('lgRev');
    f.removeAttribute('readonly'); f.focus(); f.select(); re.remove();};
  ['lgSent','lgResp','lgOut'].forEach(id=>{const e=document.getElementById(id);if(e)e.onchange=note;});
  note();
}

function historyHTML(r){
  const list=revsOf(r.id);
  if(!list.length)return '<div class="empty">Not submitted yet — no history.</div>';
  const closed=list.filter(c=>c.turnaround!=null);
  const avg=closed.length?Math.round(closed.reduce((a,c)=>a+c.turnaround,0)/closed.length):null;
  const foot=`<div class="hint" style="margin-top:7px">${list.length} submission${
    list.length===1?'':'s'} recorded${avg!=null?' · average turnaround '+avg+' days':''}</div>`;

  if(MOBILE){
    // a phone cannot show six columns; one block per cycle reads far better
    return `<div class="hlist">${list.map((c,i)=>{
      const k=c.status||'W', out=c.turnaround==null;
      const blank=!c.submitted;
      return `<div class="hrow${blank?' pending':''}" data-rev="${c.id}">
        <div class="hrev">Rev ${esc(c.rev)||'—'}<i>${blank?'no dates yet'
          :(c.rev===r.currentRev?'current':'cycle '+(i+1))}</i></div>
        <div class="hmid">
          <div class="hdates">${blank?'<span class="hint">tap to add the dates</span>'
            :`<b>${esc(c.submitted)}</b><span>→</span>
              <b>${c.received?esc(c.received):'<span class="hint">still out</span>'}</b>`}</div>
          ${blank?'':`<span class="pill ${k==='Not Submitted'?'s-N':'s-'+k}">${esc(k)}</span>`}
        </div>
        <div class="hdays ${out?'out':''}">${blank?'<span class="hint">—</span>'
          :(out?(c.submitted?days(c.submitted,today)+'d':'—'):c.turnaround+'d')}<i>${
          blank?'':(out?'so far':'turnaround')}</i></div>
      </div>`;}).join('')}</div>${foot}`;
  }
  return `<table class="histtbl">
    <thead><tr><th>Cycle</th><th>Rev</th><th>Submitted</th><th>Returned</th>
      <th>Code</th><th style="text-align:right">Days out</th></tr></thead><tbody>
    ${list.map((c,i)=>{
      const k=c.status||'W', blank=!c.submitted;
      return `<tr class="${blank?'pending':''}${c.rev===r.currentRev?' iscur':''}" data-rev="${c.id}" style="cursor:pointer">
        <td>${blank?'—':i+1}</td><td class="mono">${esc(c.rev)||'—'}</td>
        <td class="mono">${c.submitted?esc(c.submitted):'<span class="hint">awaiting DC</span>'}</td>
        <td class="mono">${esc(c.received)||'<span class="hint">still out</span>'}</td>
        <td><span class="pill ${k==='Not Submitted'?'s-N':'s-'+k}">${esc(k)}</span></td>
        <td style="text-align:right" class="mono">${c.turnaround==null?
          (c.submitted?days(c.submitted,today)+' so far':'—'):c.turnaround}</td></tr>`;}).join('')}
    </tbody></table>${foot}`;
}

  else if(a==='theme')toggleTheme(); else if(a==='mobile')setMobile(true,true);
  else if(a==='logout')logout();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('msgwrap').classList.contains('on'))closeMsg();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!GRID?.editing&&e.target===document.body){e.preventDefault();undo();}
});
window.addEventListener('hashchange',()=>setMobile(isPhone(),false));
boot();

</script>
</body>
</html>
