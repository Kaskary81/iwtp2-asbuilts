function beginEdit(r,c){
  const cs=visCols(), col=cs[c], row=GRID.rows[r];

  if(col.ro)return toast(col.t+' is worked out automatically');

  GRID.editing={r,c};

    el.innerHTML=col.opts().map(o=>`<option${String(cur)===String(o)?' selected':''}>${esc(o)}</option>`).join('');
  }else{ el=document.createElement('input'); el.type=col.date?'date':'text'; el.value=cur; }
  el.className='cellin'; td.appendChild(el); el.focus(); if(el.select)el.select();
  const done=async(commit)=>{
    if(GRID.editing===null)return; GRID.editing=null;
    const v=el.value;

  });

async function gridKey(e){
  if(GRID.editing)return;
  const cs=visCols(), maxR=GRID.rows.length-1, maxC=cs.length-1;
  const mv=(dr,dc,ext)=>{
    const r=Math.max(0,Math.min(maxR,GRID.cur.r+dr)), c=Math.max(0,Math.min(maxC,GRID.cur.c+dc));
    GRID.cur={r,c};
    GRID.sel=ext&&GRID.sel?{...GRID.sel,r2:r,c2:c}:{r1:r,c1:c,r2:r,c2:c};
    paintSel();
    const td=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
    if(td)td.scrollIntoView({block:'nearest',inline:'nearest'});
  };
  const k=e.key;
  if(k==='ArrowDown'){e.preventDefault();mv(1,0,e.shiftKey);}
  else if(k==='ArrowUp'){e.preventDefault();mv(-1,0,e.shiftKey);}
  else if(k==='ArrowLeft'){e.preventDefault();mv(0,-1,e.shiftKey);}
  else if(k==='ArrowRight'||k==='Tab'){e.preventDefault();mv(0,1,e.shiftKey&&k!=='Tab');}
  else if(k==='Enter'){e.preventDefault();beginEdit(GRID.cur.r,GRID.cur.c);}
  else if(k==='Delete'||k==='Backspace'){e.preventDefault();await clearSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='c'){e.preventDefault();copySel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='a'){e.preventDefault();
    GRID.sel={r1:0,c1:0,r2:maxR,c2:maxC};paintSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();undo();}
  else if((e.ctrlKey||e.metaKey)&&(k.toLowerCase()==='y'||(e.shiftKey&&k.toLowerCase()==='z'))){e.preventDefault();redo();}
  else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    beginEdit(GRID.cur.r,GRID.cur.c);
    const el=document.querySelector('.cellin');
    if(el&&el.tagName==='INPUT'){el.value=k;}
  }
}
function copySel(){
  const cells=selCells(); if(!cells.length)return;
  const {r1,r2,c1,c2}=GRID.sel;
  const [ra,rb]=[Math.min(r1,r2),Math.max(r1,r2)],[ca,cb]=[Math.min(c1,c2),Math.max(c1,c2)];
  const cs=visCols(), lines=[];
  for(let r=ra;r<=rb;r++){
    const row=GRID.rows[r]; if(!row)continue;
    const cells=[];
    for(let c=ca;c<=cb;c++){const col=cs[c]; cells.push(col.calc?col.calc(row):(row[col.k]??''));}
    lines.push(cells.join('\t'));
  }
  const txt=lines.join('\r\n');
  navigator.clipboard.writeText(txt).then(()=>toast(lines.length+' row(s) copied'))
    .catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
      ta.select();document.execCommand('copy');ta.remove();toast('Copied');});
}
function parseTSV(txt){
  return txt.replace(/\r\n?/g,'\n').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
}
async function pasteIntoSel(txt){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const data=parseTSV(txt); if(!data.length)return;
  const cs=visCols(), {r1,c1,r2,c2}=GRID.sel||{r1:0,c1:0,r2:0,c2:0};
  const ra=Math.min(r1,r2), ca=Math.min(c1,c2);
  txBegin('paste');
  let n=0,skipped=0;
  for(let i=0;i<data.length;i++){
    const row=GRID.rows[ra+i]; if(!row)break;
    for(let j=0;j<data[i].length;j++){
      const col=cs[ca+j]; if(!col)break;
      if(col.ro){skipped++;continue;}
      await setCell(row,col.k,data[i][j].trim(),true); n++;
    }
  }
  txEnd(); renderGrid();
  toast(n+' cell(s) pasted'+(skipped?', '+skipped+' calculated cell(s) skipped':''));
}
async function clearSel(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const cells=selCells().filter(x=>!x.col.ro); if(!cells.length)return;
  txBegin('clear '+cells.length+' cell(s)');
  for(const {row,col} of cells) await setCell(row,col.k,'',true);
  txEnd(); renderGrid(); toast(cells.length+' cell(s) cleared');
}
const nextSn=()=>Math.max(0,...AB.map(r=>parseInt(r.sn,10)||0))+1;
async function addRow(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  /* AB.length+1 reuses a row number as soon as anything has been binned —
     count from the highest number actually in use instead. */
  const base={projectId:PROJ,sn:String(nextSn()),docNo:'',title:'',
    discipline:'',currentRev:'',status:'Not Submitted'};
  let row;
  try{ row=await apiInsert(base); }
  catch(e){ return toast('Could not add the drawing — nothing was saved'); }
  if(!row)return toast('The drawing may not have saved — reload to check');
  AB.push(row); txPush({t:'add',id:row.id,row:base}); updateUndoBtns();
  await logAct('add',row); refresh(); toast('Drawing added — fill in the number and name');
}
async function deleteSelected(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  /* Ticked boxes win — that is what the row numbers show as chosen. Only when
     nothing is ticked do we fall back to the highlighted cells, the way
     Add to plan has always worked. */
  const ids=PICKED.size?[...PICKED].filter(id=>AB.some(r=>r.id===id))
                       :[...new Set(selCells().map(x=>x.row.id))];
  if(!ids.length)return toast('Tick the rows to delete, or highlight them first');
  msgBox('Delete '+ids.length+' drawing(s)?','',
    'They come off the register but are not erased — their revision history is kept, '+
    'and an administrator can restore them at any time from Deleted drawings.',
    [['Cancel',null,''],['Delete',async()=>{
      /* Bin on the server first, then take the row off the screen — the other
         way round, a failure half way leaves rows gone from the register but
         alive in the database, back on the next reload. txEnd runs whatever
         happens, or the transaction stays open and undo stops recording. */
      let done=0, stuck=null;
      txBegin('delete '+ids.length+' row(s)');
      try{
        for(const id of ids){
          const row=AB.find(r=>r.id===id); if(!row)continue;
          try{ await apiBin(id); }catch(e){ stuck=e; break; }
          txPush({t:'del',id,row:{...row}});
          AB=AB.filter(r=>r.id!==id); PICKED.delete(id); done++;
          try{ await logAct('delete',row); }catch(e){}
        }
      } finally { txEnd(); refresh(); }
      if(stuck)toast(done+' of '+ids.length+' deleted — the rest could not be reached');
      else toast(done+' drawing(s) moved to the bin — undo, or restore from the menu');
    },'danger']]);
}
document.addEventListener('paste',e=>{
  if(!GRID||!GRID.win||GRID.editing)return;
  if(!document.getElementById('gwrap'))return;
  const t=(e.clipboardData||window.clipboardData).getData('text');

/* ================= discussion =================
   A thread per drawing. Every comment carries who wrote it and when.
   Anyone signed in can read and post; you can edit or remove your own,
   an admin can remove anything. */

let CMTS={}, MEMBERS=[];                       // asbuiltId -> [comment]
async function loadComments(id){
  try{
    const list=await api('comments?asbuiltId=eq.'+id+'&deletedAt=is.null&order=createdAt.asc');
    CMTS[id]=list; return list;
  }catch(e){ CMTS[id]=[]; return []; }
}
async function loadCommentCounts(){
  try{
    const list=await apiAll('comments?deletedAt=is.null&select=asbuiltId');
    CCOUNT={}; list.forEach(c=>{CCOUNT[c.asbuiltId]=(CCOUNT[c.asbuiltId]||0)+1;});
  }catch(e){ CCOUNT={}; }
}
let CCOUNT={};
const ago=ts=>{
  if(!ts)return '';
  const mins=Math.round((Date.now()-new Date(ts))/60000);
  if(mins<1)return 'just now';
  if(mins<60)return mins+' min ago';
  if(mins<1440)return Math.round(mins/60)+'h ago';
  const d=Math.round(mins/1440);
  if(d<8)return d+'d ago';
  return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'});
};
const initials=n=>(n||'?').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

function commentsHTML(id){
  const list=CMTS[id]||[];
  if(!list.length)return '<div class="empty">No discussion yet. Start it below.</div>';
  return `<div class="thread">${list.map(c=>{
    const mine=USER&&c.authorId===USER.id;
    return `<div class="cmt" data-c="${c.id}">
      <div class="av">${esc(initials(c.authorName))}</div>
      <div class="cb">
        <div class="ch"><b>${esc(c.authorName||c.authorEmail)}</b>
          <span>${esc(ago(c.createdAt))}${c.editedAt?' · edited':''}</span>
          ${(mine||canAdmin())?`<button class="cx" data-del="${c.id}" title="Remove">✕</button>`:''}
          ${mine?`<button class="cx" data-edit="${c.id}" title="Edit">✎</button>`:''}
        </div>
        <div class="ct">${renderMentions(c.body).replace(/\n/g,'<br>')}</div>
      </div></div>`;}).join('')}</div>`;

function composerHTML(id){
  if(!LIVE||!USER)return '';
  return `<div class="composer">
    <div class="av me">${esc(initials(USER.name))}</div>
    <div class="cwrap">
      <textarea id="cnew" rows="2" placeholder="Write a comment…  type @ to mention someone"></textarea>
      <div class="mpick" id="mpick"></div>
    </div>
    <button class="btn primary" id="csend">Post</button></div>`;
}
function findMentions(text){
  const hits=[];
  MEMBERS.forEach(m=>{
    const n=(m.name||'').trim(); if(!n)return;
    const re=new RegExp('@'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    if(re.test(text))hits.push(m);
  });
  return hits;
}
function renderMentions(text){
  let out=esc(text);
  MEMBERS.forEach(m=>{
    const n=(m.name||'').trim(); if(!n)return;
    out=out.replace(new RegExp('@'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),
      '<span class="mention">@'+esc(n)+'</span>');
  });
  return out;
}
async function notifyMentions(text,r,commentId){
  const hits=findMentions(text).filter(m=>!USER||m.user_id!==USER.id);
  for(const m of hits){
    try{
      await api('notifs',{method:'POST',body:JSON.stringify({
        projectId:PROJ, ts:nowTs(), kind:'mention',
        title:(USER?USER.name:'Someone')+' mentioned you',
        body:text.slice(0,220), toUser:m.user_id,
        fromName:(USER&&USER.name)||'', docNo:r.docNo||'',
        asbuiltId:r.id, commentId:commentId||null, read:'', cleared:''})});
    }catch(e){ console.warn('could not notify',m.name,e); }
  }
  return hits;
}
async function postComment(id,body){
  if(!body.trim())return;
  const row={asbuiltId:id,body:body.trim(),authorId:USER.id,
    authorName:USER.name||USER.email,authorEmail:USER.email};
  const r=await api('comments',{method:'POST',
    headers:{Prefer:'return=representation'},body:JSON.stringify(row)});
  (CMTS[id]=CMTS[id]||[]).push(r[0]);
  const drawing=AB.find(x=>x.id===id)||{id,docNo:''};
  const told=await notifyMentions(body.trim(),drawing,r[0].id);
  if(told.length)toast('Notified '+told.map(m=>m.name.split(' ')[0]).join(', '));
  CCOUNT[id]=(CCOUNT[id]||0)+1;
  await logAct('comment',AB.find(x=>x.id===id)||{id},'discussion','',body.trim().slice(0,60));
  if(GRID&&GRID.win&&WINS.has(GRID.win.id))renderGrid();
}
async function removeComment(id,cid){
  /* this was awaited inside a dialog handler with nothing to catch it: the
     box closed and the comment was still there, with no word either way */
  try{ await api('comments?id=eq.'+cid,{method:'PATCH',body:JSON.stringify({deletedAt:nowTs()})}); }
  catch(e){ return toast('Not removed — could not reach the server'); }
  CMTS[id]=(CMTS[id]||[]).filter(c=>c.id!==cid);
  CCOUNT[id]=Math.max(0,(CCOUNT[id]||1)-1);
  if(GRID&&GRID.win&&WINS.has(GRID.win.id))renderGrid();
}
function wireComments(root,id,redraw){
  const send=root.querySelector('#csend'), ta=root.querySelector('#cnew');
  if(send)send.onclick=async()=>{
    const v=ta.value; if(!v.trim())return;
    send.disabled=true;
    try{ await postComment(id,v); ta.value=''; redraw(); }
    catch(e){ toast('Could not post that comment'); }
    finally{ send.disabled=false; }
  };
  if(ta){
    const pick=root.querySelector('#mpick');
    let open=false, idx=0, matches=[];
    const close=()=>{open=false;if(pick){pick.style.display='none';pick.innerHTML='';}};
    const paint=()=>{
      if(!pick)return;
      pick.innerHTML=(matches.length?'<div class="mphd">Mention someone</div>':'')+
        matches.map((m,i)=>
        `<button class="mp${i===idx?' on':''}" data-m="${i}">
           <b>${esc(m.name)}</b><i>${esc(m.role)}</i></button>`).join('');
      pick.style.display=matches.length?'block':'none';
      pick.querySelectorAll('[data-m]').forEach(b=>b.onmousedown=e=>{
        e.preventDefault(); insert(matches[+b.dataset.m]);});
    };
    const insert=m=>{
      const v=ta.value, c=ta.selectionStart;
      const at=v.lastIndexOf('@',c-1);
      ta.value=v.slice(0,at)+'@'+m.name+' '+v.slice(c);
      const np=at+m.name.length+2;
      close(); ta.focus(); ta.setSelectionRange(np,np);
    };
    const scan=()=>{
      const v=ta.value, c=ta.selectionStart;
      const at=v.lastIndexOf('@',c-1);
      if(at<0||(at>0&&/\S/.test(v[at-1]))){close();return;}
      const frag=v.slice(at+1,c);
      if(/\s{2,}|\n/.test(frag)){close();return;}
      matches=MEMBERS.filter(m=>m.user_id!==(USER&&USER.id)
        &&(m.name||'').toLowerCase().includes(frag.toLowerCase())).slice(0,4);
      idx=0; open=matches.length>0; paint();
    };
    ta.addEventListener('input',scan);
    ta.addEventListener('click',scan);
    ta.addEventListener('blur',()=>setTimeout(close,150));
    ta.addEventListener('keydown',e=>{
      if(open&&matches.length){
        if(e.key==='ArrowDown'){e.preventDefault();idx=(idx+1)%matches.length;paint();return;}
        if(e.key==='ArrowUp'){e.preventDefault();idx=(idx-1+matches.length)%matches.length;paint();return;}
        if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insert(matches[idx]);return;}
        if(e.key==='Escape'){close();return;}
      }
      if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send.click();}
    });
  }
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    msgBox('Remove this comment?','','It will no longer be shown to anyone.',
      [['Cancel',null,''],['Remove',async()=>{await removeComment(id,+b.dataset.del);redraw();},'danger']]);});
  root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{
    const c=(CMTS[id]||[]).find(x=>x.id===+b.dataset.edit); if(!c)return;
    msgBox('Edit your comment','',
      `<textarea id="cedit" rows="4" style="width:100%;padding:9px;border-radius:9px;
        border:1px solid var(--ring);background:var(--field);color:var(--ink);font:inherit">${esc(c.body)}</textarea>`,
      [['Cancel',null,''],['Save',async()=>{
        const v=document.getElementById('cedit').value.trim(); if(!v)return;
        try{ await api('comments?id=eq.'+c.id,{method:'PATCH',
          body:JSON.stringify({body:v,editedAt:nowTs()})}); }
        catch(e){ return toast('Not saved — could not reach the server'); }
        c.body=v; c.editedAt=nowTs(); redraw();},'primary']]);});
}

/* ================= weekly submission plan =================
   Pick drawings, say who is submitting each and by when. The person
   responsible need not have a login — they are names on a list. */

let ASSIGNEES=[], PLANS=[], PITEMS={};
/* the working week here runs Saturday to Thursday */
const WEEK_DAYS=6;
const weekStartOf=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+1)%7));
  return isoDay(x);};
const monday=weekStartOf;            /* kept so older calls still work */
const weekEndOf=ws=>{const b=new Date(ws);b.setDate(b.getDate()+WEEK_DAYS-1);
  return isoDay(b);};
const weekLabel=ws=>{
  const a=new Date(ws), b=new Date(weekEndOf(ws));
  const f=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  return 'Sat '+f(a)+' – Thu '+f(b);
};
function weekOptions(back,fwd){
  const out=[], base=new Date(weekStartOf(today));
  for(let i=-back;i<=fwd;i++){
    const d=new Date(base); d.setDate(d.getDate()+i*7);
    const ws=isoDay(d);
    const taken=PLANS.find(p=>p.weekStart===ws);
    out.push({ws,label:weekLabel(ws),taken:!!taken,planId:taken?taken.id:null,
      note:i===0?'this week':i===1?'next week':i===-1?'last week'
        :i<0?Math.abs(i)+' weeks ago':'in '+i+' weeks'});
  }
  return out;
}
const planStarted=p=>!!p&&p.weekStart<=today;
const planEnded=p=>!!p&&weekEndOf(p.weekStart)<today;
/* A drawing already on the plan is a duplicate key and nothing to report. A
   refusal, a timeout or a 400 is a failure — it used to be counted as
   "already there", so a whole batch could silently not be added. */
const isDup=e=>/23505|duplicate key|already exists/i.test(String(e&&e.message));
const planSummary=(added,already,failed)=>
  added+' added to the plan'+(already?', '+already+' already there':'')+
  (failed?' — '+failed+' could not be added':'');
const planPhase=p=>{
  if(!p)return {k:'none',label:''};
  if(!planStarted(p)){
    const d=days(today,p.weekStart);
    return {k:'future',label:d===1?'Starts tomorrow':'Starts in '+d+' days'};
  }
  if(planEnded(p))return {k:'past',label:'Week finished'};
  return {k:'live',label:'Live this week'};
};
async function loadPlanning(){
  try{
    [ASSIGNEES,PLANS]=await Promise.all([
      api('assignees?active=is.true&order=usedCount.desc,name.asc'),
      api('plans?projectId=eq.'+PROJ+'&deletedAt=is.null&order=weekStart.desc')]);
  }catch(e){ ASSIGNEES=[]; PLANS=[]; }
}
async function loadPlanItems(planId){
  try{ PITEMS[planId]=await api('plan_items?planId=eq.'+planId+'&order=id.asc'); }
  catch(e){ PITEMS[planId]=[]; }
  return PITEMS[planId];
}
const assigneeName=id=>{const a=ASSIGNEES.find(x=>x.id===id);return a?a.name:'— not assigned —';};
/* the people who do the submitting are kept separately from the login
   accounts — type a name once and it is remembered for next time */
function assigneeField(id,val){

function wireAssignee(){

/* resolve a typed name to an assignee, creating and remembering it if new */
async function resolveAssignee(name){
  const n=(name||'').trim();
  if(!n)return null;
  const hit=ASSIGNEES.find(a=>a.name.toLowerCase()===n.toLowerCase());
  if(hit){
    api('assignees?id=eq.'+hit.id,{method:'PATCH',
      body:JSON.stringify({usedCount:(hit.usedCount||0)+1,lastUsed:nowTs()})}).catch(()=>{});
    return hit.id;
  }
  try{
    const r=await api('assignees',{method:'POST',headers:{Prefer:'return=representation'},
      body:JSON.stringify({name:n,reportsTo:USER?USER.id:null,usedCount:1,lastUsed:nowTs()})});
    await loadPlanning();
    return r[0].id;
  }catch(e){ await loadPlanning();
    const again=ASSIGNEES.find(a=>a.name.toLowerCase()===n.toLowerCase());
    return again?again.id:null; }
}

/* An item counts as achieved when the drawing has been submitted SINCE it was
   planned — comparing against the submission date captured when it was added,
   so work already done beforehand is not claimed as progress. */
function itemState(it,plan){
  const r=AB.find(a=>a.id===it.asbuiltId)||{};
  if(plan&&!planStarted(plan))
    return {k:'pending',label:'Planned',cls:'st-none'};
  const sub=(r.actualSub||'').trim(), base=(it.baseSub||'').trim();
  const done=!!sub&&sub!==base;
  if(done){
    const late=it.targetDate&&sub>it.targetDate;
    return {k:late?'late':'done',label:late?'Submitted late':'Submitted',
            cls:late?'st-late':'st-done',sub,days:it.targetDate?days(it.targetDate,sub):null};
  }
  if(it.targetDate&&it.targetDate<today)
    return {k:'overdue',label:days(it.targetDate,today)+'d overdue',cls:'st-over'};
  if(it.targetDate)return {k:'due',label:'Due '+it.targetDate,cls:'st-due'};
  return {k:'nodate',label:'No target date',cls:'st-none'};
}
function planProgress(planId){
  const items=PITEMS[planId]||[];
  const plan=PLANS.find(p=>p.id===planId);
  const st=items.map(it=>itemState(it,plan));
  const done=st.filter(x=>x.k==='done'||x.k==='late').length;
  return {total:items.length,done,
    onTime:st.filter(x=>x.k==='done').length,
    late:st.filter(x=>x.k==='late').length,
    overdue:st.filter(x=>x.k==='overdue').length,
    open:st.filter(x=>x.k==='due'||x.k==='nodate'||x.k==='pending').length,
    pct:items.length?Math.round(done/items.length*100):0,
    started:planStarted(plan),phase:planPhase(plan)};
}
function progressBar(p){
  const w=n=>p.total?(n/p.total*100):0;
  if(!p.started)return `<div class="pgwrap">
    <div class="pgnum"><b>—</b><span>${p.total} drawing(s) planned · ${esc(p.phase.label)}</span></div>
    <div class="pgbar"></div>
    <div class="pglg"><span>Progress starts being measured on the first day of the week.</span></div></div>`;
  return `<div class="pgwrap">
    <div class="pgnum"><b>${p.pct}%</b><span>${p.done} of ${p.total} submitted${
      p.phase.k==='past'?' · week finished':''}</span></div>
    <div class="pgbar">
      <i class="on" style="width:${w(p.onTime)}%"></i>
      <i class="lt" style="width:${w(p.late)}%"></i>
      <i class="ov" style="width:${w(p.overdue)}%"></i>
    </div>
    <div class="pglg">
      <span><i class="on"></i>On time ${p.onTime}</span>
      <span><i class="lt"></i>Late ${p.late}</span>
      <span><i class="ov"></i>Overdue ${p.overdue}</span>
      <span><i class="op"></i>Still to come ${p.open}</span>
    </div></div>`;
}

function openPicker(planId,draw){
  const on=new Set((PITEMS[planId]||[]).map(i=>i.asbuiltId));
  const pool=()=>AB.filter(r=>!on.has(r.id));
  let q='', only='open';
  const match=r=>{
    if(only==='open'&&!isOpen(r))return false;
    if(only==='ns'&&!notSubmitted(r))return false;
    if(!q)return true;
    return ((r.docNo||'')+' '+(r.title||'')+' '+(r.discipline||'')).toLowerCase().includes(q);
  };
  const chosen=new Set();
  const body=()=>`
    <div class="planbar" style="margin-bottom:9px">
      <input class="f" id="pkq" placeholder="Search number, name or discipline" style="flex:1;min-width:180px" value="${esc(q)}">
      <select class="f" id="pkf" style="min-width:132px">
        <option value="open"${only==='open'?' selected':''}>Open items</option>
        <option value="ns"${only==='ns'?' selected':''}>Not submitted</option>
        <option value=""${only===''?' selected':''}>Everything</option>
      </select></div>
    <div class="picker">${pool().filter(match).slice(0,300).map(r=>`
      <label class="pk"><input type="checkbox" data-p="${r.id}"${chosen.has(r.id)?' checked':''}>
        <span class="pmain"><b>${esc(r.title)||'(untitled)'}</b>
          <i>${esc(SHORT_DISC[r.discipline]||r.discipline||'')} · ${esc(r.docNo)}</i></span></label>`).join('')
      ||'<div class="empty">Nothing matches.</div>'}</div>
    <div class="hint" id="pksum" style="margin-top:8px">${chosen.size} selected</div>`;
  const m=msgBox('Add drawings to the plan','',body(),
    [['Cancel',null,''],['Add selected',async()=>{
      /* every other editing path checks for itself rather than trusting a
         disabled button — this one was reachable without doing so */
      if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
      let added=0,already=0,failed=0;
      const p=PLANS.find(x=>x.id===planId);
      /* An item with no target date can never read as overdue and sits in
         "Still to come" for ever — default it to the end of the plan's week. */
      const dflt=p?weekEndOf(p.weekStart):'';
      for(const id of chosen){
        try{ await api('plan_items',{method:'POST',
          body:JSON.stringify({planId,asbuiltId:id,targetDate:dflt})}); added++; }
        catch(e){ isDup(e)?already++:failed++; }
      }
      delete PITEMS[planId]; await draw();
      toast(planSummary(added,already,failed));
    },'primary']]);
  const wire=()=>{
    const box=document.getElementById('msg');
    box.querySelectorAll('[data-p]').forEach(cb=>cb.onchange=()=>{
      const id=+cb.dataset.p; cb.checked?chosen.add(id):chosen.delete(id);
      const s=document.getElementById('pksum'); if(s)s.textContent=chosen.size+' selected';});
    const qi=document.getElementById('pkq');
    if(qi)qi.oninput=()=>{q=qi.value.trim().toLowerCase();redraw(qi.selectionStart);};
    const fi=document.getElementById('pkf');
    if(fi)fi.onchange=()=>{only=fi.value;redraw();};
  };
  const redraw=(caret)=>{
    const box=document.getElementById('msg');
    box.querySelector('.body').innerHTML=body(); wire();
    const qi=document.getElementById('pkq');
    if(qi&&caret!=null){qi.focus();qi.setSelectionRange(caret,caret);}
  };
  wire();
}


/* ================= plan as a Gantt =================
   One bar per document, running from the start of the plan week (or today,
   whichever is later) to its target date, with the target marked. Colour
   carries the state, so slippage is visible without reading a table. */
let PLAN_VIEW='table';

function ganttHTML(planId){
  const plan=PLANS.find(p=>p.id===planId), items=PITEMS[planId]||[];
  if(!plan||!items.length)
    return '<div class="empty"><b>Nothing to chart</b>Add documents to the plan first.</div>';

  const ws=plan.weekStart, we=weekEndOf(ws);
  const dates=items.map(i=>i.targetDate).filter(Boolean);
  const lo=[ws,...dates].sort()[0];
  const hiRaw=[we,...dates,today].sort().pop();
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return isoDay(x);};
  const start=addDays(lo,-1), end=addDays(hiRaw,1);
  const span=Math.max(1,days(start,end));
  const pos=d=>Math.max(0,Math.min(100,days(start,d)/span*100));

  // day columns, labelled every other day when the span is long
  let grid='', labels='';
  for(let i=0;i<=span;i++){
    const d=addDays(start,i), x=i/span*100;
    const dow=new Date(d).getDay();               // 5=Fri 6=Sat
    const rest=(dow===5);                          // Friday is the day off
    grid+=`<i class="gl${rest?' rest':''}" style="left:${x}%;width:${100/span}%"></i>`;
    if(span<=10||i%2===0)
      labels+=`<span style="left:${x}%">${new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</span>`;
  }
  const todayX=(today>=start&&today<=end)?pos(today):null;

  const rows=items.map(it=>{
    const r=AB.find(a=>a.id===(it.docId!=null?it.docId:it.asbuiltId))||{};
    const st=itemState(it,plan);
    const from=(ws>today?ws:today);
    const to=it.targetDate||we;
    const a=pos(from<to?from:to), b=pos(to);
    const w=Math.max(1.2,b-a);
    const cls={done:'g-done',late:'g-late',overdue:'g-over',due:'g-due',
               nodate:'g-none',pending:'g-plan'}[st.k]||'g-due';
    return `<div class="grow" data-pi="${it.id}">
      <div class="glab" title="${esc(r.title||'')}">${esc(r.title||'—')}
        <i>${esc(r.discipline||'')}${it.assigneeId?' · '+esc(assigneeName(it.assigneeId)):''}</i></div>
      <div class="gtrack">
        ${grid}
        ${todayX!=null?`<i class="gnow" style="left:${todayX}%"></i>`:''}
        <div class="gbar ${cls}" style="left:${a}%;width:${w}%">
          <b>${esc(st.label)}</b></div>
        ${it.targetDate?`<i class="gdia ${cls}" style="left:${b}%"
           title="${esc(it.targetDate)}"></i>`:''}
      </div>
      <div class="gdate">${esc(it.targetDate||'—')}</div></div>`;}).join('');

  return `<div class="gantt" data-chart="gantt">
    <div class="ghead"><div class="glab"></div>
      <div class="gtrack gaxis">${grid}${labels}
        ${todayX!=null?`<i class="gnow" style="left:${todayX}%"></i>
          <span class="gnowlab" style="left:${todayX}%">today</span>`:''}</div>
      <div class="gdate">Target</div></div>
    ${rows}
    <div class="legend" style="margin-top:10px">
      <span><i class="sw" style="background:#0f9d58"></i>Done</span>
      <span><i class="sw" style="background:#f0b429"></i>Late</span>
      <span><i class="sw" style="background:#d64545"></i>Overdue</span>
      <span><i class="sw" style="background:var(--accent)"></i>Due</span>
      <span><i class="sw" style="background:var(--muted)"></i>Planned</span>
      <span class="rt">Fridays shaded</span></div></div>`;
}

/* ================= PDF report =================
   Rendered as a print stylesheet rather than a PDF library, so it needs no
   CDN, keeps the exact layout, and works on a phone (Share → Save to Files)
   as well as on a desktop (Print → Save as PDF). Landscape A4, tables only. */

function filterLabel(){
  if(PICKED.size&&AB.some(r=>PICKED.has(r.id))){
    const n=AB.filter(r=>PICKED.has(r.id)).length;
    return n+' selected drawing'+(n===1?'':'s');
  }
  return filterLabelOf();
}
/* the same words without the tick override, for anything that deliberately
   describes the filter rather than the selection */
function filterLabelOf(){
  const bits=[];
  if(MOBILE){
    if(MOB.fd)bits.push(MOB.fd);
    if(MOB.fs)bits.push('Code '+MOB.fs);
    const m={open:'Open items only',ur:'Under review',late:'Past target date',ns:'Not submitted'};
    if(MOB.f&&m[MOB.f])bits.push(m[MOB.f]);
    if(MOB.q)bits.push('Search: "'+MOB.q+'"');
  }else{
    if(GRID.fd)bits.push(GRID.fd);
    if(GRID.fs)bits.push('Code '+GRID.fs);
    const m={open:'Open items only',ur:'Under review',late:'Past target date',ns:'Not submitted'};
    if(GRID.fx&&m[GRID.fx])bits.push(m[GRID.fx]);
    if(GRID.q)bits.push('Search: "'+GRID.q+'"');
  }
  return bits.length?bits.join(' · '):'Complete register — no filter applied';
}
/* GRID.rows is only rewritten when the register is painted, and closing the
   window leaves it behind — so a report run afterwards described the rows as
   they were at the last paint, missing anything added since and carrying a
   filter the user can no longer see. Trust it only while the window is open. */
function reportRows(ignoreTicks){
  /* Ticks win here as they do everywhere else — tick twelve drawings for a
     transmittal and that is what the report, the CSV and the Excel hold. The
     header says so in as many words, and the toolbar has been showing the
     ticked count all along, so it cannot be a silent surprise. */
  if(PICKED.size&&!ignoreTicks){
    const picked=AB.filter(r=>PICKED.has(r.id));
    if(picked.length)return picked;
  }
  if(MOBILE)return mobRows();
  const live=GRID&&GRID.win&&WINS.has(GRID.win.id)&&GRID.rows;
  return live?GRID.rows:AB;
}
function reportCols(){
  if(!MOBILE)return visCols().filter(c=>c.k!=='sn');
  return ['docNo','title','discipline','currentRev','status','targetDate','actualSub','actualRcv']
    .map(k=>COLBY[k]);
}

const PRINT_DISC=SHORT_DISC;
const PRINT_HEAD={docNo:'Drawing number',title:'Submittal name',discipline:'Discipline',
  currentRev:'Rev',status:'Code',targetDate:'Targeted',actualSub:'Submitted',actualRcv:'Received'};

function buildReport(){
  const rows=reportRows(), cols=reportCols();
  const n=rows.length;
  const sub=rows.filter(submitted).length;
  const app=rows.filter(r=>APPROVED.includes(r.status)).length;
  const rej=rows.filter(r=>REJECTED.includes(r.status)).length;
  const ur =rows.filter(r=>r.status==='W').length;
  const ns =n-sub;
  const late=rows.filter(r=>!APPROVED.includes(r.status)&&r.targetDate&&r.targetDate<today).length;
  const stamp=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});

  const cell=(r,c)=>{
    let v=c.calc?c.calc(r):(r[c.k]??'');
    if(c.k==='status')v=(v||'Not Submitted')==='Not Submitted'?'Not sub.':v;
    if(c.k==='discipline')v=PRINT_DISC[v]||v;
    return v||'—';
  };
  const head=cols.map(c=>`<th class="c-${c.k}">${esc(PRINT_HEAD[c.k]||c.t)}</th>`).join('');

  /* Cut the rows into pages ourselves. The browser would break them for us,
     but then only page one carries the project name and no page carries a
     number — which is the first thing a client notices in a document that
     arrives as six loose sheets. */
  const PER=34, pages=[];
  for(let i=0;i<rows.length;i+=PER)pages.push(rows.slice(i,i+PER));
  if(!pages.length)pages.push([]);
  const total=pages.length+1;                     /* the summary is page 1 */

  const kpi=(l,v)=>`<div class="rk"><b>${v}</b><span>${l}</span></div>`;
  const banner=(p)=>`<div class="rhead">
      <div class="rt"><h1>IWTP2 — As-Built Drawings Register</h1>
        <div class="rs">Independent Water Transmission Pipeline 2</div></div>
      <div class="rd">${stamp}<br><span>${n} drawing${n===1?'':'s'}</span>
        <br>Page ${p} of ${total}</div>
    </div>`;
  const foot=`<div class="rfoot">IWTP2 As-Built Drawings Register · ${esc(filterLabel())} · ${stamp}${
      USER?' · issued by '+esc(USER.name):''}</div>`;

  /* ---- page 1: what the numbers say, before the list of them ---- */
  const S=chSeries(rows);
  const W=960;
  const half=(c,w)=>{const r=c(S,w);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${Math.ceil(r.h)}"
      width="100%" preserveAspectRatio="xMinYMin meet">${r.svg}</svg>`;};
  const codePc=sharePc(S.codes.map(c=>c.n),n);
  const codeRows=S.codes.map((c,i)=>
    `<tr><td>${esc(c.k==='Not Submitted'?'Not submitted':'Code '+c.k)}</td>
      <td class="num">${c.n}</td><td class="num">${codePc[i]}%</td></tr>`).join('');
  const summary=`<section class="rpage">${banner(1)}
    <div class="rfilt"><b>Selection:</b> ${esc(filterLabel())}</div>
    <div class="rkpis">
      ${kpi('In selection',n)}${kpi('Submitted',sub)}${kpi('Approved',app)}
      ${kpi('Under review',ur)}${kpi('Resubmit',rej)}${kpi('Not submitted',ns)}${kpi('Past target',late)}
    </div>
    <div class="rcharts">
      <div class="rc"><h4>Submission curve — cumulative</h4>${half(chCurve,620)}</div>
      <div class="rc"><h4>Review codes</h4>${half(chDonut,620)}</div>
    </div>
    <div class="rcharts">
      <div class="rc rcwide"><h4>Discipline against review code</h4>${half(chDisc,W)}</div>
      <div class="rc rcnarrow"><h4>Review code summary</h4>
        <table class="rsum"><tbody>${codeRows}
          <tr class="tot"><td>Total</td><td class="num">${n}</td><td class="num">100%</td></tr>
        </tbody></table></div>
    </div>
    ${foot}</section>`;

  /* ---- the register itself, one page at a time ---- */
  const tableFoot=`<tfoot><tr class="rtot"><td class="c-idx"></td>`+
    cols.map((c,i)=>`<td class="c-${c.k}">${i===0
      ?n+' drawing'+(n===1?'':'s')+' · '+sub+' submitted · '+app+' approved · '+late+' past target'
      :''}</td>`).join('')+`</tr></tfoot>`;
  const listing=pages.map((pg,pi)=>`<section class="rpage">${banner(pi+2)}
    <table class="rtbl"><thead><tr><th class="c-idx">#</th>${head}</tr></thead>
      <tbody>${pg.map((r,i)=>`<tr><td class="c-idx">${pi*PER+i+1}</td>`+
        cols.map(c=>`<td class="c-${c.k}">${esc(cell(r,c))}</td>`).join('')+`</tr>`).join('')}</tbody>
      ${pi===pages.length-1?tableFoot:''}</table>
    ${foot}</section>`).join('');

  return summary+listing;
}
function exportPDF(){
  const rows=reportRows();
  if(!rows.length)return toast('Nothing to export with those filters');
  let root=document.getElementById('printroot');
  if(!root){ root=document.createElement('div'); root.id='printroot'; document.body.appendChild(root); }
  root.innerHTML=buildReport();
  document.body.classList.add('printing');
  const done=()=>{ document.body.classList.remove('printing');
    window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>{ window.print(); setTimeout(done,1500); },60);
  toast(rows.length+' rows — set Landscape, then Save as PDF');
}

function stats(){
  const t=AB.length, sub=AB.filter(submitted).length;
  return {t,sub,
    app:AB.filter(r=>APPROVED.includes(r.status)).length,
    rej:AB.filter(r=>REJECTED.includes(r.status)).length,

/* ================= charts =================
   Drawn as instrument plots rather than presentation graphics: hairline
   grids, monospace readouts, a variance band against plan, and a live
   readout strip that replaces the value labels while you drag across it.
   All hand-rolled SVG so the dashboard survives with no CDN. */

let TIP=null;
function tip(){ if(TIP)return TIP;
  TIP=document.createElement('div'); TIP.className='ctip';
  document.body.appendChild(TIP); return TIP; }
function showTip(html,x,y){ const t=tip(); t.innerHTML=html; t.classList.add('on');
  const r=t.getBoundingClientRect();
  t.style.left=Math.min(window.innerWidth-r.width-10,Math.max(8,x-r.width/2))+'px';
  t.style.top=(y-r.height-14<8?y+18:y-r.height-14)+'px'; }
function moveTip(e){ const t=tip(); if(!t.classList.contains('on'))return;
  t.style.left=Math.min(window.innerWidth-t.offsetWidth-10,Math.max(8,e.clientX-t.offsetWidth/2))+'px';
  t.style.top=(e.clientY-t.offsetHeight-14<8?e.clientY+18:e.clientY-t.offsetHeight-14)+'px'; }
function hideTip(){ if(TIP)TIP.classList.remove('on'); }
document.addEventListener('scroll',hideTip,true);

function drillTo(f){
  if(MOBILE){
    MOB.stack=[]; MOB.view='reg'; MOB.id=null; MOB.q='';
    MOB.f=f.fx||''; MOB.fs=f.fs||''; MOB.fd=f.fd||'';
    MOB.fage=f.fage||null; MOB.fageL=f.fageL||'';
    const b=document.getElementById('mbody'); if(b)b.scrollTop=0;

  }
  if(!GRID||!WINS.has(GRID.win.id))openRegister();
  Object.assign(GRID,{q:'',fd:'',fs:'',fx:'',fage:null,fageL:'',...f});

/* ---------- monthly series shared by two charts ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel=m=>MON[+m.slice(5,7)-1]+" '"+m.slice(2,4);
function monthly(){
  const sm={},rm={},tm={};
  AB.forEach(r=>{ if(r.actualSub)sm[r.actualSub.slice(0,7)]=(sm[r.actualSub.slice(0,7)]||0)+1;
                  if(r.actualRcv)rm[r.actualRcv.slice(0,7)]=(rm[r.actualRcv.slice(0,7)]||0)+1;
                  if(r.targetDate)tm[r.targetDate.slice(0,7)]=(tm[r.targetDate.slice(0,7)]||0)+1;});
  const ms=[...new Set([...Object.keys(sm),...Object.keys(rm),...Object.keys(tm)])].sort();
  let a=0,b=0,c=0;
  return ms.map(m=>{a+=sm[m]||0;b+=rm[m]||0;c+=tm[m]||0;
    return {m,sub:sm[m]||0,rcv:rm[m]||0,act:a,ret:b,pln:c};});
}

/* ---------- cumulative plot ---------- */
function curveChart(){
  const D=monthly();
  if(!D.length)return '<div class="empty">No dates recorded yet.</div>';
  const W=960,H=300,PL=44,PR=16,PT=18,PB=34;
  const max=Math.max(20,Math.ceil(Math.max(AB.length,...D.map(d=>Math.max(d.pln,d.act)))/20)*20);
  const X=i=>PL+(W-PL-PR)*(D.length<2?.5:i/(D.length-1));
  const Y=v=>H-PB-(H-PT-PB)*(v/max);
  const path=key=>D.map((d,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(d[key]).toFixed(1)).join(' ');
  // shaded band between plan and actual — the shortfall, drawn not stated
  // shade what is genuinely informative: the gap between sent and returned
  // is the work sitting with the reviewer right now.
  const gap=D.map((d,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(d.act).toFixed(1)).join('')
    +D.slice().reverse().map((d,i)=>'L'+X(D.length-1-i).toFixed(1)+' '+Y(d.ret).toFixed(1)).join('');
  let grid='';
  for(let i=0;i<=4;i++){const v=max*i/4;
    grid+=`<line class="gl" x1="${PL}" y1="${Y(v)}" x2="${W-PR}" y2="${Y(v)}"/>
      <text class="ax" x="${PL-9}" y="${Y(v)+3.5}" text-anchor="end">${Math.round(v)}</text>`;}
  D.forEach((d,i)=>{ const step=Math.ceil(D.length/12);
    grid+=`<line class="gl vt" x1="${X(i)}" y1="${PT}" x2="${X(i)}" y2="${H-PB}"/>`;
    if(D.length<14||i%step===0)
      grid+=`<text class="ax" x="${X(i)}" y="${H-13}" text-anchor="middle">${d.m.slice(2).replace('-','/')}</text>`;});
  const last=D[D.length-1], v=last.act-last.pln;
  return `<div class="chart plot" data-chart="curve">
    <div class="readout" id="ro-curve">
      <div class="ro"><span>Month</span><b id="ro-m">${mLabel(last.m)}</b></div>
      <div class="ro"><span>Sent</span><b id="ro-a">${last.act}</b></div>
      <div class="ro"><span>Back</span><b id="ro-r">${last.ret}</b></div>
      <div class="ro"><span>Plan</span><b id="ro-p">${last.pln}</b></div>
      <div class="ro"><span>Var</span><b id="ro-v" class="${v<0?'neg':'pos'}">${v>=0?'+':''}${v}</b></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="plotsvg">
      <defs>
        <linearGradient id="fillA" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>
        <linearGradient id="fillR" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#0f9d58" stop-opacity=".16"/>
          <stop offset="100%" stop-color="#0f9d58" stop-opacity="0"/></linearGradient>
      </defs>
      ${grid}
      <path d="${gap}Z" fill="#f0b429" fill-opacity=".16"/>
      <path d="${path('ret')}L${X(D.length-1)} ${Y(0)}L${X(0)} ${Y(0)}Z" fill="url(#fillR)"/>
      <path class="ln pln" d="${path('pln')}"/>
      <path class="ln ret" d="${path('ret')}"/>
      <path class="ln act draw" d="${path('act')}"/>
      <g class="pts">${D.map((d,i)=>
        `<circle data-i="${i}" cx="${X(i)}" cy="${Y(d.act)}" r="0"/>`).join('')}</g>
      <circle class="tip act" cx="${X(D.length-1)}" cy="${Y(last.act)}" r="4"/>
      <circle class="tip ret" cx="${X(D.length-1)}" cy="${Y(last.ret)}" r="3.4"/>
      <line class="cross" id="cx-curve" x1="0" y1="${PT}" x2="0" y2="${H-PB}" opacity="0"/>
      <g class="hot">${D.map((d,i)=>{
        const w=D.length<2?W-PL-PR:(X(1)-X(0));
        return `<rect data-i="${i}" x="${i?X(i)-w/2:PL}" y="${PT}" width="${w}" height="${H-PT-PB}"/>`;}).join('')}</g>
    </svg>
    <div class="legend">
      <span><i class="sw act"></i>Submitted</span>
      <span><i class="sw ret"></i>Returned</span>
      <span><i class="sw pln"></i>Planned</span>
      <span><i class="sw wip"></i>With reviewer</span>
      <span class="rt">${last.act} of ${AB.length} sent · <b>${v>=0?'+':''}${v}</b> vs plan</span>
    </div></div>`;
}
function wireCurve(root){
  const box=root.querySelector('[data-chart="curve"]'); if(!box)return;
  const D=monthly(), pts=[...box.querySelectorAll('.pts circle')];
  const cx=box.querySelector('#cx-curve');
  const set=(id,v,cls)=>{const el=box.querySelector('#ro-'+id);if(!el)return;
    el.textContent=v; if(cls!==undefined)el.className=cls;};
  const reset=()=>{const d=D[D.length-1],v=d.act-d.pln;
    set('m',mLabel(d.m));set('a',d.act);set('r',d.ret);set('p',d.pln);
    set('v',(v>=0?'+':'')+v,v<0?'neg':'pos');
    cx.setAttribute('opacity','0'); pts.forEach(p=>p.setAttribute('r','0'));};
  box.querySelectorAll('.hot rect').forEach(rc=>{
    rc.addEventListener('pointerenter',()=>{
      const i=+rc.dataset.i,d=D[i]; if(!d)return;
      const v=d.act-d.pln;
      set('m',mLabel(d.m));set('a',d.act);set('r',d.ret);set('p',d.pln);
      set('v',(v>=0?'+':'')+v,v<0?'neg':'pos');
      pts.forEach(p=>p.setAttribute('r',+p.dataset.i===i?'4.5':'0'));
      const x=pts[i].getAttribute('cx');
      cx.setAttribute('x1',x);cx.setAttribute('x2',x);cx.setAttribute('opacity','1');});
  });
  box.addEventListener('pointerleave',reset);
}

/* ---------- review code ring ---------- */
/* Percentages rounded one at a time came to 99.9, which a reader notices and
   then stops trusting the panel. Hand the rounding error to the largest share,
   the way a cost report balances, so the column always reads 100. */
function sharePc(counts,total){
  if(!total)return counts.map(()=>'0.0');
  const raw=counts.map(n=>n/total*100);
  const out=raw.map(v=>Math.round(v*10)/10);
  const drift=Math.round((100-out.reduce((a,b)=>a+b,0))*10)/10;
  if(drift){ let big=0; raw.forEach((v,i)=>{ if(v>raw[big])big=i; });
    out[big]=Math.round((out[big]+drift)*10)/10; }
  return out.map(v=>v.toFixed(1));
}
function donutChart(){
  const c={}; AB.forEach(r=>{const k=r.status||'Not Submitted';c[k]=(c[k]||0)+1;});
  const keys=CODES.filter(k=>c[k]), total=AB.length||1;
  const pcs=sharePc(keys.map(k=>c[k]),AB.length);
  const R=54, CIRC=2*Math.PI*R, GAP=1.4;
  let off=0, seg='';
  keys.forEach(k=>{
    const frac=c[k]/total, len=Math.max(CIRC*frac-GAP,0.5);
    seg+=`<circle class="ring" data-k="${esc(k)}" cx="70" cy="70" r="${R}"
      stroke="${COLOR[k]}" stroke-dasharray="${len} ${CIRC-len}"
      stroke-dashoffset="${-off}"/>`;
    off+=CIRC*frac;});
  return `<div class="chart ringc" data-chart="donut">
    <svg viewBox="0 0 140 140" class="ringsvg">
      <circle class="track" cx="70" cy="70" r="${R}"/>${seg}
      <text id="rg-n" x="70" y="68" text-anchor="middle" class="rgn">${AB.length}</text>
      <text id="rg-l" x="70" y="83" text-anchor="middle" class="rgl">IN SCOPE</text>
    </svg>
    <div class="codes">${keys.map((k,i)=>`
      <button class="crow" data-k="${esc(k)}">
        <i style="background:${COLOR[k]}"></i>
        <span class="cl">${esc(k==='Not Submitted'?'Not submitted':'Code '+k)}</span>
        <b>${c[k]}</b><em>${pcs[i]}%</em></button>`).join('')}</div></div>`;
}
function wireDonut(root){
  const box=root.querySelector('[data-chart="donut"]'); if(!box)return;
  const n=box.querySelector('#rg-n'), l=box.querySelector('#rg-l');
  const enter=k=>{
    const c=AB.filter(r=>(r.status||'Not Submitted')===k).length;
    n.textContent=c; l.textContent=(k==='Not Submitted'?'NOT SUBMITTED':'CODE '+k);
    box.querySelectorAll('.ring').forEach(s=>s.classList.toggle('dim',s.dataset.k!==k));
    box.querySelectorAll('.crow').forEach(r=>r.classList.toggle('dim',r.dataset.k!==k));};
  const leave=()=>{ n.textContent=AB.length; l.textContent='IN SCOPE';
    box.querySelectorAll('.ring,.crow').forEach(e=>e.classList.remove('dim'));};
  box.querySelectorAll('.ring,.crow').forEach(el=>{
    el.addEventListener('pointerenter',()=>enter(el.dataset.k));
    el.addEventListener('click',()=>drillTo({fs:el.dataset.k}));});
  box.addEventListener('pointerleave',leave);
}

/* ================= chart export =================
   Four of the six dashboard charts are styled divs, not SVG, so there is
   nothing to serialise and no picture to hand over. Rather than drag in a
   rasteriser, the export redraws every chart as plain SVG from the same
   numbers: flat hex colours, presentation attributes, no stylesheet and no
   custom properties. That SVG stands on its own — it prints as vector, goes
   into the report as-is, and rasterises to PNG through a canvas.
   One set of numbers (chSeries), two renderers. */
const CH={ font:'Helvetica,Arial,sans-serif',
  ink:'#17171a', ink2:'#55555c', mute:'#8a8a92', grid:'#e6e6ea', rule:'#c9c9d0',
  accent:'#2a78d6', plan:'#9a9a9a', back:'#0ca30c', paper:'#ffffff' };
const chEsc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const chT=(x,y,s,o)=>{o=o||{};
  return `<text x="${x}" y="${y}" font-family="${CH.font}" font-size="${o.size||11}"`+
    ` fill="${o.fill||CH.ink2}" text-anchor="${o.anchor||'start'}"`+
    (o.weight?` font-weight="${o.weight}"`:'')+
    (o.mono?' font-family="SFMono-Regular,Consolas,monospace"':'')+
    `>${chEsc(s)}</text>`;};

/* ---------- the numbers, once, for both the pictures and the data sheet ----------
   Takes its rows rather than reaching for AB, so a chart can describe the whole
   register or only what is filtered on screen — and the sheet says which. */
function chMonthly(rows){
  const sm={},rm={},tm={};
  rows.forEach(r=>{ if(r.actualSub)sm[r.actualSub.slice(0,7)]=(sm[r.actualSub.slice(0,7)]||0)+1;
                    if(r.actualRcv)rm[r.actualRcv.slice(0,7)]=(rm[r.actualRcv.slice(0,7)]||0)+1;
                    if(r.targetDate)tm[r.targetDate.slice(0,7)]=(tm[r.targetDate.slice(0,7)]||0)+1;});
  const ms=[...new Set([...Object.keys(sm),...Object.keys(rm),...Object.keys(tm)])].sort();
  let a=0,b=0,c=0;
  return ms.map(m=>{a+=sm[m]||0;b+=rm[m]||0;c+=tm[m]||0;
    return {m,sub:sm[m]||0,rcv:rm[m]||0,act:a,ret:b,pln:c};});
}
function chSeries(rows){
  const R=rows||AB, t=R.length, sub=R.filter(submitted).length;
  const kpi={t,sub, app:R.filter(r=>APPROVED.includes(r.status)).length,
    rej:R.filter(r=>REJECTED.includes(r.status)).length,
    ur:R.filter(r=>r.status==='W').length, ns:t-sub};
  const codes=CODES.filter(k=>R.some(r=>(r.status||NOT_SUB)===k))
    .map(k=>({k,n:R.filter(r=>(r.status||NOT_SUB)===k).length}));
  /* a value outside the seven codes would otherwise leave a gap in the ring
     and go missing from every tile — show it rather than lose it */
  const odd=R.filter(r=>!CODES.includes(r.status||NOT_SUB)).length;
  if(odd)codes.push({k:'Other',n:odd});
  /* a blank discipline is still a drawing — give it a bucket rather than
     dropping it, or the bars stop adding up to the register */
  const dkeys=[...new Set(R.map(r=>r.discipline||'(not assigned)'))];
  const disc=dkeys.map(d=>{ const mine=R.filter(r=>(r.discipline||'(not assigned)')===d);
    return {d, n:mine.length, app:mine.filter(r=>APPROVED.includes(r.status)).length,
      parts:CODES.map(k=>({k,v:mine.filter(r=>(r.status||NOT_SUB)===k).length}))};})
    .sort((a,b)=>b.n-a.n);
  const ur=R.filter(r=>r.status==='W'&&r.actualSub).map(r=>({...r,age:days(r.actualSub,today)}))
    .sort((a,b)=>b.age-a.age);
  const BK=[['0–14 days',0,14,'#0f9d58'],['15–30 days',15,30,'#f0b429'],
            ['31–60 days',31,60,'#e8834a'],['Over 60 days',61,1e9,'#d64545']];
  return { kpi, months:chMonthly(R), codes, disc,
    ageing:BK.map(([l,lo,hi,col])=>({l,lo,hi,col,n:ur.filter(r=>r.age>=lo&&r.age<=hi).length})),
    urCount:ur.length, oldest:ur.length?ur[0].age:0 };
}

/* ---------- one chart, one function, plain SVG ---------- */
function chKpis(S,W){
  const s=S.kpi, pc=n=>s.t?Math.round(n/s.t*100):0, H=104;
  const tiles=[['In scope',s.t,'as-built drawings',CH.accent,100],
    ['Submitted',s.sub,pc(s.sub)+'% of scope',CH.accent,pc(s.sub)],
    ['Approved',s.app,'code A, B or I','#0ca30c',pc(s.app)],
    ['Under review',s.ur,'code W','#fab219',pc(s.ur)],
    ['Needs resubmission',s.rej,'code C or D','#d03b3b',pc(s.rej)],
    ['Not submitted',s.ns,pc(s.ns)+'% of scope','#b9b7b0',pc(s.ns)]];
  const gap=9, w=(W-gap*(tiles.length-1))/tiles.length;
  return {h:H, svg:tiles.map(([k,v,p,col,f],i)=>{const x=i*(w+gap);
    return `<rect x="${x}" y="0" width="${w.toFixed(1)}" height="${H}" rx="7" fill="#fbfbfc" stroke="${CH.grid}"/>`+
      chT(x+13,24,k.toUpperCase(),{size:9.5,fill:CH.mute,weight:600})+
      chT(x+13,60,v,{size:30,fill:CH.ink,weight:700})+
      chT(x+13,78,p,{size:10,fill:CH.ink2})+
      `<rect x="${x+13}" y="${H-18}" width="${(w-26).toFixed(1)}" height="5" rx="2.5" fill="${CH.grid}"/>`+
      `<rect x="${x+13}" y="${H-18}" width="${((w-26)*Math.max(f,0)/100).toFixed(1)}" height="5" rx="2.5" fill="${col}"/>`;
  }).join('')};
}
function chCurve(S,W){
  const D=S.months, H=300;
  if(!D.length)return {h:40,svg:chT(0,20,'No dates recorded yet.',{fill:CH.mute})};
  const PL=46,PR=14,PT=14,PB=36;
  const max=Math.max(20,Math.ceil(Math.max(S.kpi.t,...D.map(d=>Math.max(d.pln,d.act)))/20)*20);
  const X=i=>PL+(W-PL-PR)*(D.length<2?.5:i/(D.length-1));
  const Y=v=>H-PB-(H-PT-PB)*(v/max);
  const path=k=>D.map((d,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(d[k]).toFixed(1)).join(' ');
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4;
    g+=`<line x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}" stroke="${CH.grid}"/>`+
       chT(PL-8,Y(v)+3.5,Math.round(v),{anchor:'end',size:10,fill:CH.mute});}
  const step=Math.max(1,Math.ceil(D.length/12));
  D.forEach((d,i)=>{ if(D.length<14||i%step===0)
    g+=chT(X(i),H-14,d.m.slice(2).replace('-','/'),{anchor:'middle',size:9.5,fill:CH.mute});});
  /* the gap between sent and back is the work sitting with the reviewer */
  const band=D.map((d,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(d.act).toFixed(1)).join(' ')+
    ' '+D.slice().reverse().map((d,i)=>'L'+X(D.length-1-i).toFixed(1)+' '+Y(d.ret).toFixed(1)).join(' ')+'Z';
  const key=(x,col,lab,dash)=>`<line x1="${x}" y1="${PT-2}" x2="${x+16}" y2="${PT-2}" stroke="${col}"`+
    ` stroke-width="2"${dash?' stroke-dasharray="5 4"':''}/>`+chT(x+21,PT+1.5,lab,{size:10,fill:CH.ink2});
  return {h:H, svg:g+
    `<path d="${band}" fill="${CH.accent}" fill-opacity=".10"/>`+
    `<path d="${path('pln')}" fill="none" stroke="${CH.plan}" stroke-width="1.6" stroke-dasharray="5 4"/>`+
    `<path d="${path('ret')}" fill="none" stroke="${CH.back}" stroke-width="1.8"/>`+
    `<path d="${path('act')}" fill="none" stroke="${CH.accent}" stroke-width="2.4"/>`+
    D.map((d,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(d.act).toFixed(1)}" r="2.6" fill="${CH.accent}"/>`).join('')+
    `<line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="${CH.rule}"/>`+
    key(W-330,CH.accent,'Sent')+key(W-250,CH.back,'Back')+key(W-170,CH.plan,'Plan',1)};
}
function chDonut(S,W){
  const H=250, total=S.kpi.t||1, R=74, CX=118, CY=H/2, CIRC=2*Math.PI*R, GAP=1.6;
  if(!S.codes.length)return {h:40,svg:chT(0,20,'Nothing recorded yet.',{fill:CH.mute})};
  let off=0, seg='';
  S.codes.forEach(({k,n})=>{ const len=Math.max(CIRC*(n/total)-GAP,.5);
    seg+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${COLOR[k]}" stroke-width="22"`+
      ` stroke-dasharray="${len.toFixed(2)} ${(CIRC-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"`+
      ` transform="rotate(-90 ${CX} ${CY})"/>`;
    off+=CIRC*(n/total);});
  /* the legend columns follow the width it is given, so the panel fills
     whether the chart is a full sheet or half a landscape page */
  const LX=Math.min(268,CX+R+36), NX=Math.max(LX+150,W-86), PX=W-6;
  const pcs=sharePc(S.codes.map(c=>c.n),S.kpi.t);
  const rows=S.codes.map(({k,n},i)=>{const y=CY-S.codes.length*15+i*30+8;
    return `<rect x="${LX}" y="${y-9}" width="11" height="11" rx="2.5" fill="${COLOR[k]}"/>`+
      chT(LX+19,y,k==='Not Submitted'?'Not submitted':'Code '+k,{size:11.5,fill:CH.ink})+
      chT(NX,y,n,{size:11.5,anchor:'end',fill:CH.ink,weight:700})+
      chT(PX,y,pcs[i]+'%',{size:11,anchor:'end',fill:CH.mute});}).join('');
  return {h:H, svg:
    `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#f0f0f3" stroke-width="22"/>`+seg+
    chT(CX,CY+2,S.kpi.t,{size:28,anchor:'middle',fill:CH.ink,weight:700})+
    chT(CX,CY+20,'IN SCOPE',{size:9,anchor:'middle',fill:CH.mute,weight:600})+rows};
}
function chDisc(S,W){
  if(!S.disc.length)return {h:40,svg:chT(0,20,'No disciplines recorded.',{fill:CH.mute})};
  const RH=26, PAD=4, LW=168, NW=92, TW=W-LW-NW-16, max=S.disc[0].n||1;
  const body=S.disc.map((row,i)=>{ const y=i*RH, by=y+6, bh=RH-12-PAD+4;
    const bw=TW*row.n/max; let x=LW+8, bars='';
    row.parts.filter(p=>p.v).forEach(p=>{ const w=bw*p.v/row.n;
      bars+=`<rect x="${x.toFixed(1)}" y="${by}" width="${Math.max(w,.6).toFixed(1)}" height="${bh}" fill="${COLOR[p.k]}"/>`;
      x+=w;});
    return chT(LW,y+RH/2+2,SHORT_DISC[row.d]||row.d,{size:11,anchor:'end',fill:CH.ink})+
      `<rect x="${LW+8}" y="${by}" width="${TW}" height="${bh}" fill="#f4f4f7"/>`+bars+
      chT(LW+8+TW+34,y+RH/2+2,row.n,{size:11,anchor:'end',fill:CH.ink,weight:700})+
      chT(W,y+RH/2+2,Math.round(row.app/row.n*100)+'%',{size:11,anchor:'end',fill:CH.mute});}).join('');
  const ly=S.disc.length*RH+16;
  let lx=LW+8, leg='';
  CODES.forEach(k=>{ leg+=`<rect x="${lx}" y="${ly-8}" width="10" height="10" rx="2" fill="${COLOR[k]}"/>`+
    chT(lx+15,ly+1,k==='Not Submitted'?'Not sub.':k,{size:10,fill:CH.ink2});
    lx+=(k==='Not Submitted'?74:34);});
  leg+=chT(W,ly+1,'approved %',{size:10,anchor:'end',fill:CH.mute});
  return {h:ly+14, svg:body+leg};
}
function chAge(S,W){
  if(!S.urCount)return {h:40,svg:chT(0,20,'Nothing is with the reviewer.',{fill:CH.mute})};
  const RH=34, LW=118, NW=44, TW=W-LW-NW-16;
  const max=Math.max(...S.ageing.map(b=>b.n))||1;
  const body=S.ageing.map((b,i)=>{ const y=i*RH, by=y+9, bh=RH-20;
    return chT(LW,y+RH/2+3,b.l,{size:11.5,anchor:'end',fill:CH.ink})+
      `<rect x="${LW+10}" y="${by}" width="${TW}" height="${bh}" rx="3" fill="#f4f4f7"/>`+
      `<rect x="${LW+10}" y="${by}" width="${(TW*b.n/max).toFixed(1)}" height="${bh}" rx="3" fill="${b.col}"/>`+
      chT(W,y+RH/2+3,b.n,{size:12,anchor:'end',fill:CH.ink,weight:700});}).join('');

function chThr(S,W){
  const D=S.months.filter(d=>d.sub||d.rcv), H=250;
  if(!D.length)return {h:40,svg:chT(0,20,'Nothing submitted yet.',{fill:CH.mute})};
  const PL=40,PR=12,PT=14,PB=40;
  /* round the top of the axis up to something that divides into four whole
     numbers, so the gridline labels read 0/30/60/90/120 rather than 0/27/53/80 */
  const peak=Math.max(...D.map(d=>Math.max(d.sub,d.rcv)))||1;
  const tick=[1,2,5,10,20,25,50,100,200,250,500,1000].find(s=>s*4>=peak)||Math.ceil(peak/4);
  const max=tick*4;
  const bw=(W-PL-PR)/D.length, iw=Math.min(16,(bw-8)/2);
  const Y=v=>H-PB-(H-PT-PB)*(v/max);
  let g='';
  for(let i=0;i<=4;i++){const v=Math.round(max*i/4);
    g+=`<line x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}" stroke="${CH.grid}"/>`+
       chT(PL-7,Y(v)+3.5,v,{anchor:'end',size:10,fill:CH.mute});}
  const step=Math.max(1,Math.ceil(D.length/14));
  const bars=D.map((d,i)=>{ const cx=PL+bw*i+bw/2;
    const bar=(v,dx,col)=>v?`<rect x="${(cx+dx).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${iw.toFixed(1)}"`+
      ` height="${(H-PB-Y(v)).toFixed(1)}" fill="${col}"/>`+
      chT(cx+dx+iw/2,Y(v)-4,v,{anchor:'middle',size:9,fill:CH.ink2}):'';
    return bar(d.sub,-iw-1,CH.accent)+bar(d.rcv,1,CH.back)+
      ((D.length<16||i%step===0)?chT(cx,H-16,d.m.slice(2).replace('-','/'),{anchor:'middle',size:9.5,fill:CH.mute}):'');
  }).join('');
  const key=(x,col,lab)=>`<rect x="${x}" y="${PT-9}" width="10" height="10" rx="2" fill="${col}"/>`+
    chT(x+15,PT,lab,{size:10,fill:CH.ink2});
  return {h:H, svg:g+bars+`<line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="${CH.rule}"/>`+
    key(W-200,CH.accent,'Submitted')+key(W-105,CH.back,'Returned')};
}

/* Which drawings a chart describes, and the words that say so on the sheet —

function chPack(which){

/* ---------- hand it over ---------- */
function chSave(name,blob){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function chDownloadSVG(name,svg){
  chSave(name+'.svg',new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
}
/* A standalone SVG rasterises through an <img> and a canvas — no library,
   and no tainting, because the data: URL carries the whole picture. */
function chDownloadPNG(name,svg,scale){
  const m=svg.match(/width="(\d+)" height="(\d+)"/);
  const w=+(m?m[1]:960), h=+(m?m[2]:600), k=scale||2;
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=w*k; cv.height=h*k;
    const cx=cv.getContext('2d');
    cx.fillStyle=CH.paper; cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{ if(!b)return toast('The browser would not make a PNG — try SVG');
      chSave(name+'.png',b); toast(name+'.png downloaded'); },'image/png');
  };
  img.onerror=()=>toast('Could not rasterise — the SVG download still works');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function chPrint(svg,title){
  let root=document.getElementById('printroot');
  if(!root){ root=document.createElement('div'); root.id='printroot'; document.body.appendChild(root); }
  root.innerHTML=`<div class="chartprint">${svg}</div>`;
  document.body.classList.add('printing');
  const done=()=>{ document.body.classList.remove('printing');
    window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>{ window.print(); setTimeout(done,1500); },60);
  toast(title+' — set Portrait, then Save as PDF');
}

   ['Needs resubmission (C, D)',s.rej],['Not submitted',s.ns]]
    .forEach(([l,v])=>out.push([l,v,pc(v)]));
  out.push([]); out.push(['Submission curve — cumulative']);
  out.push(['Month','Submitted in month','Returned in month','Sent to date','Back to date','Planned to date']);

function dailyRows(n){
  const out=[], end=new Date(today+'T00:00:00'), cy=allCycles();
  for(let i=0;i<n;i++){
    const d=new Date(end); d.setDate(d.getDate()-i);
    const k=isoDay(d);
    const sub=cy.filter(c=>c.submitted===k).length;
    const back=cy.filter(c=>c.received===k);

      sub,
      ret:back.length,
      app:back.filter(c=>APPROVED.includes(c.status)).length,
      rej:back.filter(c=>REJECTED.includes(c.status)).length});
  }
  return out;
}

/* ================= excel ================= */
function ensureXLSX(){return new Promise((res,rej)=>{
  if(window.XLSX)return res(window.XLSX);
  const s=document.createElement('script');s.src=XLSX_CDN;
  s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('no xlsx'));document.head.appendChild(s);});}
function tableAOA(){
  /* CSV and Excel used to read GRID directly, which is null on a phone — so
     the menu said "Current filter" and handed over the whole register. Both
     now take the same rows and columns the PDF does. */
  const cs=reportCols(), rows=reportRows();
  return [cs.map(c=>c.t)].concat(rows.map(r=>cs.map(c=>c.calc?c.calc(r):(r[c.k]??''))));
}
async function exportXLSX(){
  try{
    const X=await ensureXLSX();
    const cols=reportCols(), aoa=tableAOA();
    const ws=X.utils.aoa_to_sheet(aoa);
    /* Every column in the database is text, so the whole sheet arrived as
       text: dates would not sort chronologically or filter by month, and
       numbers would not sum. Type the cells that have a type. */
    const iso=/^\d{4}-\d{2}-\d{2}$/;
    for(let r=1;r<aoa.length;r++){
      cols.forEach((c,ci)=>{
        const ref=X.utils.encode_cell({r,c:ci}), cell=ws[ref];
        if(!cell||cell.v===''||cell.v==null)return;
        const v=String(cell.v);
        if(/Date$|^actual/.test(c.k)&&iso.test(v)){
          cell.t='d'; cell.v=new Date(v+'T00:00:00'); cell.z='dd-mmm-yyyy';
        }else if((c.k==='sn'||c.num)&&/^-?\d+(\.\d+)?$/.test(v)){
          cell.t='n'; cell.v=+v;
        }
      });
    }
    ws['!cols']=cols.map(c=>({wpx:colW(c)}));
    ws['!freeze']={xSplit:0,ySplit:1};
    ws['!autofilter']={ref:X.utils.encode_range(
      {s:{r:0,c:0},e:{r:Math.max(aoa.length-1,1),c:Math.max(cols.length-1,0)}})};
    const wb=X.utils.book_new();
    X.utils.book_append_sheet(wb,ws,'As-Builts');
    /* the numbers behind the dashboard, so Excel can chart them natively */
    const sum=X.utils.aoa_to_sheet(chDataAOA('screen'));
    sum['!cols']=[{wpx:230}].concat(Array(9).fill({wpx:90}));
    X.utils.book_append_sheet(wb,sum,'Summary');
    X.writeFile(wb,'IWTP2_AsBuilts_'+today+'.xlsx',{cellDates:true});
    toast('Excel file downloaded — register and summary');
  }catch(e){ console.error(e);
    toast('Could not load the Excel library — CSV works offline'); exportCSV(); }
}
function exportCSV(){
  /* Quoting does not stop Excel evaluating a leading =, +, - or @ \u2014 it strips
     the quotes first and treats the cell as a formula. Titles are free text,
     so lead such a value with an apostrophe, which Excel shows but ignores. */
  const q=v=>{ let s=String(v??'');
    if(/^[=+\-@\t\r]/.test(s))s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"'; };
  const csv=tableAOA().map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download='IWTP2_AsBuilts_'+today+'.csv';
  /* a detached anchor does not download on iOS Safari, and CSV is in the
     phone menu \u2014 put it in the document, click, then clean up */
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('CSV downloaded');
}
function importExcel(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls,.csv';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f)return;
    try{
      const X=await ensureXLSX();
      const wb=X.read(await f.arrayBuffer(),{type:'array'});
      const aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
      if(aoa.length<2)return toast('That sheet looks empty');
      const head=aoa[0].map(h=>String(h).trim().toLowerCase());
      const map=head.map(h=>{const c=COLS.find(c=>c.t.toLowerCase()===h||c.k.toLowerCase()===h);
        return c&&!c.ro?c.k:null;});
      if(!map.some(Boolean))return msgBox('Import from Excel','',
        'None of the headings matched. Use the same headings as the register — '+
        'export it first if you want a template.',[['Close',null,'primary']]);
      const dn=map.indexOf('docNo');
      msgBox('Import '+(aoa.length-1)+' row(s)?','',
        `Matching on <b>Drawing number</b>: rows that already exist are updated, new numbers are added.
         Columns matched: ${map.filter(Boolean).map(k=>esc(COLBY[k].t)).join(', ')}.`,
        [['Cancel',null,''],['Import',async()=>{
          txBegin('import '+(aoa.length-1)+' row(s)');
          let upd=0,add=0;
          for(let i=1;i<aoa.length;i++){
            const line=aoa[i]; if(!line.join('').trim())continue;
            const no=dn>=0?String(line[dn]||'').trim():'';
            let row=no?AB.find(r=>r.docNo===no):null;
            if(!row){
              const base={projectId:PROJ,sn:String(nextSn()),docNo:no,title:'',
                discipline:'',currentRev:'',status:'Not Submitted'};
              row=await apiInsert(base); AB.push(row); txPush({t:'add',id:row.id,row:base}); add++;
            } else upd++;
            for(let j=0;j<map.length;j++){
              if(!map[j])continue;
              const v=String(line[j]??'').trim(); if(v==='')continue;
              await setCell(row,map[j],v,true);
            }
          }
          txEnd(); refresh(); toast(add+' added, '+upd+' updated');
        },'primary']]);
    }catch(e){ console.error(e); toast('Could not read that file'); }
  };
  inp.click();
}

function whenSeen(ts){
  if(!ts)return {t:'Never used it',cls:'never'};
  const d=new Date(ts), mins=Math.round((Date.now()-d)/60000);
  if(mins<2)return {t:'Just now',cls:'now'};
  if(mins<60)return {t:mins+' min ago',cls:'now'};
  if(mins<24*60)return {t:Math.round(mins/60)+'h ago',cls:'now'};
  const days=Math.round(mins/1440);
  if(days<8)return {t:days+'d ago',cls:''};
  return {t:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}),cls:''};
}

/* horizontal swipe on a card: left to remove, right to tick.
   Only engages once the movement is clearly sideways, so the list still scrolls. */
function attachSwipe(el,{onLeft,onRight,leftLabel,rightLabel}){
  let x0=0,y0=0,dx=0,live=false,decided=false;
  const TH=64;
  el.style.touchAction='pan-y';
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    x0=e.clientX;y0=e.clientY;dx=0;live=true;decided=false;});
  el.addEventListener('pointermove',e=>{
    if(!live)return;
    const ax=e.clientX-x0, ay=e.clientY-y0;
    if(!decided){
      if(Math.abs(ay)>Math.abs(ax)){live=false;return;}
      if(Math.abs(ax)<10)return;
      decided=true; el.classList.add('swiping');
    }
    dx=ax;
    if((dx<0&&!onLeft)||(dx>0&&!onRight))dx=0;
    el.style.transform='translateX('+Math.max(-110,Math.min(110,dx))+'px)';
    el.dataset.swipe=dx<-TH?'left':dx>TH?'right':'';
  });
  const end=()=>{
    if(!live){el.style.transform='';el.classList.remove('swiping');return;}
    live=false; el.classList.remove('swiping'); el.style.transform='';
    const hit=el.dataset.swipe; el.dataset.swipe='';
    if(hit==='left'&&onLeft)onLeft();
    if(hit==='right'&&onRight)onRight();
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('pointerleave',end);
}

async function resumeSession(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('ab-session')||'null'); }catch(e){}
  if(!s||!s.r)return false;
  try{
    const n=(s.exp&&s.exp>Date.now()+60000)?{access_token:s.t,refresh_token:s.r,expires_in:(s.exp-Date.now())/1000}
      :await auth('token?grant_type=refresh_token',{refresh_token:s.r});
    TOKEN=n.access_token;
    const me=await api('members?user_id=eq.'+
      (n.user?n.user.id:(JSON.parse(atob(n.access_token.split('.')[1])).sub))+'&limit=1');
    if(!me.length){TOKEN=null;return false;}
    USER={id:me[0].user_id,email:me[0].email,name:me[0].name||me[0].email,role:me[0].role};
    if(me[0].prefs)loadPrefs(me[0].prefs);
    try{localStorage.setItem('ab-session',JSON.stringify(
      {t:n.access_token,r:n.refresh_token||s.r,exp:Date.now()+(n.expires_in||3600)*1000}));}catch(e){}
    return true;
  }catch(e){ TOKEN=null; try{localStorage.removeItem('ab-session');}catch(_){} return false; }
}

async function loadRevs(){
  try{
    /* revisions carries no projectId, so this pulled every cycle in the
       database — harmless with one project, wrong the day there are two.
       Keep only the cycles belonging to drawings on this register. */
    const r=await apiAll('revisions?order=id.asc');
    const mine=new Set(AB.map(x=>x.id));
    REVS={}; r.forEach(x=>{ if(mine.has(x.asbuiltId))
      (REVS[x.asbuiltId]=REVS[x.asbuiltId]||[]).push(x); });
  }catch(e){ REVS={}; }
}
/* refetching all 219 cycles after every keystroke was the lag — pull one drawing */
async function loadRevsFor(id){
  try{ REVS[id]=await api('revisions?asbuiltId=eq.'+id+'&order=id.asc'); }
  catch(e){}
}
const revNum=v=>{const m=/(\d+)/.exec(v||'');return m?+m[1]:-1;};
function revsOf(id){
  return (REVS[id]||[]).slice().sort((a,b)=>{
    const d=revNum(a.rev)-revNum(b.rev);
    return d||String(a.submitted||'').localeCompare(String(b.submitted||''));});
}

/* ---------- log a new submission cycle ---------- */
function revBasis(r){
  const dated=revsOf(r.id).filter(x=>x.submitted);
  if(!dated.length)return 'First submission — starting at 0X.';
  const last=dated[dated.length-1];
  return 'Next after '+esc(last.rev)+', submitted '+esc(last.submitted)+'.';
}
function nextRevAB(id){
  const rows=revsOf(id);
  const nums=rows.map(x=>{const m=/(\d+)/.exec(x.rev||'');return m?+m[1]:-1;});
  const top=nums.length?Math.max(...nums):-1;
  // revisions on this project are written 0X, 1X, 2X — keep the suffix
  const suffix=(rows.map(x=>x.rev||'').find(v=>/^\d+[A-Za-z]+$/.test(v))||'0X')
    .replace(/^\d+/,'') || 'X';
  return String(top+1)+suffix;
}
async function removeCycle(r,cid){
  if(!canEdit())return toast('Your account cannot edit');
  const all=revsOf(r.id);
  const c=all.find(x=>x.id===cid); if(!c)return;
  const dated=all.filter(x=>x.submitted&&x.id!==cid);
  const wasLatest=!!c.submitted&&!all.filter(x=>x.submitted).some(x=>revNum(x.rev)>revNum(c.rev));
  const next=dated.length?dated[dated.length-1]:null;
  const after=!c.submitted ? 'The drawing is not affected — this cycle has no dates.'
    : wasLatest
      ? (next
          ? `The drawing will fall back to <b>Rev ${esc(next.rev)}</b>
             (<b>${esc(next.status||'W')}</b>, submitted ${esc(next.submitted)}).`
          : `Nothing else has been submitted, so the drawing will go back to
             <b>Not Submitted</b> with no dates.`)
      : 'This is an earlier cycle, so the drawing keeps its current revision and code.';
  msgBox('Remove Rev '+(c.rev||'')+'?','',
    `<b>${esc(r.docNo||'')}</b><br>${esc(r.title||'')}<br><br>
     ${c.submitted?`Submitted ${esc(c.submitted)}${c.received?', returned '+esc(c.received):''}
       ${c.status?' — '+esc(c.status):''}.<br><br>`:''}
     ${after}<br><br>
     <b>This cannot be undone.</b> Removing a cycle erases that piece of the
     submission record permanently.`,
    [['Keep it',null,''],['Remove',async()=>{
      try{
        await api('revisions?id=eq.'+cid,{method:'DELETE'});
        const fresh=await api('asbuilts?id=eq.'+r.id+'&limit=1');
        if(fresh&&fresh[0])Object.assign(r,fresh[0]);
        await loadRevsFor(r.id);
        logAct('edit',r,'revision removed',c.rev+' '+(c.submitted||'no dates'),'');
        if(MOBILE)mobRender(); else refresh();
        toast('Rev '+c.rev+' removed');
      }catch(e){ toast('Could not remove that cycle'); }
    },'danger']]);
}

    el.innerHTML=(isLatest
      ? `This is the latest revision, so the drawing takes its code —
         <b>${esc(code)}</b> — and its dates.`
      : `This is an earlier cycle. The drawing keeps its current revision

  ['edSent','edResp','edOut'].forEach(id=>{

}
function logCycle(r){
  if(!canEdit())return toast('Your account cannot edit');
  msgBox('Log a submission','',
    `<label class="fl">Revision</label>
     <div class="autofield">
       <input class="f big" id="lgRev" value="${esc(nextRevAB(r.id))}" readonly>
       <button type="button" class="lnk" id="lgRevEdit">change</button>
     </div>
     <div class="hint" style="margin-top:4px">${revBasis(r)}</div>
     <label class="fl">Submitted</label>
     <input class="f big" id="lgSent" type="date" value="${today}">
     <label class="fl">Returned (leave blank if still with the reviewer)</label>

     <select class="f big" id="lgOut"><option value="">— not returned yet —</option>
       ${CODES.filter(k=>k!=='Not Submitted').map(k=>`<option>${esc(k)}</option>`).join('')}</select>
     <div class="hint" id="lgNote" style="margin-top:10px"></div>`,
    [['Cancel',null,''],['Save',async()=>{
      const rev=document.getElementById('lgRev').value.trim();
      const sent=document.getElementById('lgSent').value;
      const resp=document.getElementById('lgResp').value;
      const out=document.getElementById('lgOut').value;
      if(!rev||!sent)return toast('A revision and a submitted date are needed');
      /* The database orders a drawing's cycles by the digits in the revision.
         A revision with none — 'A', or a stray letter — makes that conversion
         fail, and from then on every submission logged against this drawing,
         and every attempt to remove a cycle, fails with nothing to explain it.
         Catch it here, where it can still be corrected. */
      if(!/^\d+[A-Za-z]*$/.test(rev))
        return toast('A revision starts with a number, like 0X or 2 — "'+rev+'" would break this drawing');
      const before=(r.currentRev||'')+' '+(r.status||'');
      try{
        await api('revisions',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({
          asbuiltId:r.id,docNo:r.docNo,rev,submitted:sent,received:resp||'',
          status:resp?(out||'W'):'W',
          turnaround:(resp&&sent&&resp>=sent)?days(sent,resp):null,
          actor:(USER&&USER.email)||'app'})});
        // the drawing is derived from its latest cycle, so read it back rather
        // than patching it here — that is what left a stale receipt date on screen
        const fresh=await api('asbuilts?id=eq.'+r.id+'&limit=1');
        if(fresh&&fresh[0])Object.assign(r,fresh[0]);
        await loadRevsFor(r.id);
        logAct('edit',r,'submission',before,rev+' '+sent+(resp?' → '+resp:''));
        if(MOBILE)mobRender(); else refresh();
        toast('Rev '+rev+' logged'+(r.actualRcv?'':' — now with the reviewer'));
      }catch(e){ toast('Could not log that submission'); }
    },'primary']]);
  const note=()=>{
    const resp=document.getElementById('lgResp').value;
    const sel=document.getElementById('lgOut');
    sel.disabled=!resp; if(!resp)sel.value='';
    const el=document.getElementById('lgNote'); if(!el)return;
    el.innerHTML=resp
      ? `This closes the cycle and sets the drawing to <b>${esc(sel.value||'W')}</b>.`
      : `This opens a new cycle. With no receipt date the drawing shows as
         <b>W</b> — still with the reviewer.`;
  };
  const re=document.getElementById('lgRevEdit');
  if(re)re.onclick=()=>{const f=document.getElementById('lgRev');
    f.removeAttribute('readonly'); f.focus(); f.select(); re.remove();};
  ['lgSent','lgResp','lgOut'].forEach(id=>{const e=document.getElementById(id);if(e)e.onchange=note;});
  note();
}

async function boot(){
  /* This read 'ab-theme', which nothing has ever written — so the first paint
     was always dark whatever the user had chosen. The theme lives in
     'ab-prefs' with the rest of the settings. */
  try{ const p=JSON.parse(localStorage.getItem('ab-prefs')||'null');
    document.documentElement.dataset.theme=(p&&p.theme==='light')?'':'dark'; }
  catch(e){ document.documentElement.dataset.theme='dark'; }
  loadPrefs();   /* whatever this browser last had, so there is no flash of the wrong theme */
  const ok=await resumeSession();
  if(ok){
    try{ await loadData(); startApp(); return; }
    catch(e){ console.warn('Could not load the register',e); }
  }
  document.getElementById('login').classList.add('on');
  loadDirectory();
}

/* topbar wiring */
document.getElementById('b-reg').onclick=()=>{if(GRID&&WINS.has(GRID.win.id))focusWin(GRID.win.id);else openRegister();};
document.getElementById('b-dash').onclick=openDashboard;
document.getElementById('b-plan').onclick=openPlans;
document.getElementById('b-undo').onclick=undo;
document.getElementById('b-redo').onclick=redo;
document.getElementById('b-bell').onclick=openNotifs;
document.getElementById('mbell').onclick=()=>{
  msgBox('Notifications','',NOTIFS.length?NOTIFS.map(n=>
    `<div class="nrow${n.read==='Yes'?'':' unread'}" ${n.asbuiltId?`data-mgo="${n.asbuiltId}"`:''}>
      <div style="flex:1;min-width:0">${notifTag(n.kind)}<b>${esc(n.title)}</b>
        <div class="hint">${esc(n.docNo||'')}${n.docNo?' · ':''}${esc(ago(n.ts))}</div>
        <div class="nb">${esc(n.body||'')}</div></div></div>`).join('')
    :'<div class="empty">Nothing needs your attention.</div>',[['Close',null,'primary']]);
  document.querySelectorAll('[data-mgo]').forEach(el=>el.onclick=()=>{
    closeMsg(); MOB.stack=[]; mobGo('one',+el.dataset.mgo);});
  if(LIVE&&USER&&NOTIFS.some(n=>n.read!=='Yes')){
    api('notifs?toUser=eq.'+USER.id,{method:'PATCH',body:JSON.stringify({read:'Yes'})})
      .then(()=>{NOTIFS.forEach(n=>n.read='Yes');updateBell();}).catch(()=>{});
  }};
document.getElementById('mback').onclick=mobBack;
document.getElementById('lgo').onclick=doLogin;
document.getElementById('lreset').onclick=resetPassword;
document.getElementById('lname').onchange=onPickName;
document.getElementById('lother').onclick=function(){useEmailField(!this.dataset.on);};
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
const menu=document.getElementById('menu');
document.getElementById('b-menu').onclick=e=>{e.stopPropagation();menu.classList.toggle('open');};
document.addEventListener('click',()=>menu.classList.remove('open'));
menu.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  menu.classList.remove('open');
  const a=b.dataset.a;
  if(a==='cols')openCols(); else if(a==='pdf')exportPDF(); else if(a==='xlsx')exportXLSX(); else if(a==='csv')exportCSV();
  else if(a==='import')importExcel(); else if(a==='bin')openBin();
  else if(a==='activity')openActivity();
  else if(a==='users')openUsers(); else if(a==='arrange')arrangeWins();
  else if(a==='theme')toggleTheme(); else if(a==='mobile')setMobile(true,true);
  else if(a==='logout')logout();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('msgwrap').classList.contains('on'))closeMsg();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!GRID?.editing&&e.target===document.body){e.preventDefault();undo();}
});
window.addEventListener('hashchange',()=>setMobile(isPhone(),false));
boot();

</script>
</body>
</html>
